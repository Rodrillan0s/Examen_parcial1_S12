<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="1380" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1350" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 480 15 L 495 35 L 495 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold">CU/W32: Visualizar indicadores empresariales (Analytics)</text>

  <g transform="translate(80, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="11" font-weight="bold" text-anchor="middle">GERENTE</text></g>

  <g><rect x="195" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="260" y="107" font-size="11" font-weight="bold" text-anchor="middle">Dashboard_KPIs_View</text></g>
  <g><rect x="415" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="480" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">KPI_Controller</text></g>
  <g><rect x="665" y="85" width="150" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="740" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Analytics_Engine_Service</text></g>
  <g><rect x="950" y="85" width="100" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1000" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_VENTA</text></g>
  <g><rect x="1120" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1180" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_DETALLE_VENTA</text></g>
  <g><rect x="1275" y="85" width="90" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1320" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_PAGO</text></g>

  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="121" x2="260" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="480" y1="121" x2="480" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="740" y1="121" x2="740" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1000" y1="121" x2="1000" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1180" y1="121" x2="1180" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1320" y1="121" x2="1320" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="254" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="474" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="734" y="215" width="12" height="575" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="994" y="325" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1174" y="420" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1314" y="525" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Consultar KPIs -->
  <line x1="80" y1="160" x2="254" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="170.0" y="152" font-size="10.5" text-anchor="middle">1: SeleccionarPeriodoAnalitico('ESTE_MES')</text>

  <!-- 2: GET /kpis -->
  <line x1="266" y1="190" x2="474" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="370.0" y="182" font-size="10.5" text-anchor="middle">2: GET /api/kpis/dashboard-ejecutivo?periodo=mensual</text>

  <!-- 3: Invocación Analytics Engine (Directo) -->
  <line x1="486" y1="220" x2="734" y2="220" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="610.0" y="212" font-size="10" text-anchor="middle">3: calcular_kpis_empresariales(periodo, canal)</text>

  <!-- LOOP: Procesar agregaciones analíticas -->
  <rect x="35" y="240" width="1320" height="495" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 240 L 90 240 L 100 257 L 100 265 L 35 265 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="257" font-size="11" font-weight="bold" text-anchor="middle">loop</text>
  <text x="110" y="258" font-size="10.5" font-weight="bold">[POR CADA SERIE TEMPORAL (DÍA / SEMANA / MES)]</text>

  <path d="M 746 270 L 785 270 L 785 295 L 748 295" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="792" y="285" font-size="10" text-anchor="start">4: calcular_ticket_promedio_y_crecimiento()</text>

  <!-- Agregación en T_VENTA -->
  <line x1="746" y1="325" x2="994" y2="325" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="870.0" y="317" font-size="9.5" text-anchor="middle">5: SELECT COUNT(*), AVG(TOTAL), SUM(TOTAL) FROM T_VENTA</text>

  <line x1="994" y1="355" x2="746" y2="355" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="870.0" y="347" font-size="9.5" text-anchor="middle">6: return metricas_ingresos_globales</text>

  <!-- ALT: Canal POS vs Canal Online -->
  <rect x="50" y="380" width="1290" height="195" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 380 L 95 380 L 105 395 L 105 402 L 50 402 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="395" font-size="10" font-weight="bold" text-anchor="middle">alt</text>
  <text x="115" y="396" font-size="10" font-weight="bold">[CANAL TIENDAS FÍSICAS POS]</text>

  <line x1="746" y1="420" x2="1174" y2="420" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="960.0" y="412" font-size="9" text-anchor="middle">7: SELECT TOP prendas_mas_vendidas FROM T_DETALLE_VENTA</text>

  <line x1="1174" y1="450" x2="746" y2="450" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="960.0" y="442" font-size="9" text-anchor="middle">8: return ranking_rotacion_pos</text>

  <line x1="50" y1="480" x2="1340" y2="480" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="65" y="497" font-size="10" font-weight="bold">[CANAL COMERCIO ELECTRÓNICO / MÓVIL]</text>

  <line x1="746" y1="525" x2="1314" y2="525" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1030.0" y="517" font-size="9" text-anchor="middle">9: SELECT MONTO, ESTADO FROM T_PAGO WHERE METODO_PAGO = 'ONLINE'</text>

  <line x1="1314" y1="555" x2="746" y2="555" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1030.0" y="547" font-size="9" text-anchor="middle">10: return metricas_pagos_digitales</text>

  <!-- OPT: Comparativa Interanual -->
  <rect x="50" y="590" width="1290" height="75" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 590 L 95 590 L 105 605 L 105 612 L 50 612 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="605" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="606" font-size="10" font-weight="bold">[COMPARATIVA CON MISMO PERIODO AÑO ANTERIOR]</text>

  <path d="M 746 625 L 785 625 L 785 645 L 748 645" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="792" y="638" font-size="9.5" text-anchor="start">11: tasa_crecimiento = ((actual - anterior)/anterior)*100</text>

  <!-- Retornos -->
  <line x1="734" y1="760" x2="486" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="610.0" y="752" font-size="10" text-anchor="middle">12: return dataset_kpis_ejecutivo</text>

  <line x1="474" y1="795" x2="266" y2="795" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="370.0" y="787" font-size="10" text-anchor="middle">13: HTTP 200 OK (graficos, tablas_kpis)</text>

  <line x1="254" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="170.0" y="827" font-size="10" text-anchor="middle">14: RenderizarTablerosEjecutivos(graficos_tendencias)</text>

</svg>
