<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1370" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 490 15 L 505 35 L 505 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold">CU/W31: Consultar ventas, reservas e inventario</text>

  <g transform="translate(80, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">ENCARGADO</text></g>

  <g><rect x="200" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="260" y="107" font-size="11" font-weight="bold" text-anchor="middle">IU_MonitorOperativo</text></g>
  <g><rect x="420" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="480" y="107" font-size="11" font-weight="bold" text-anchor="middle">inventario_routes</text></g>
  <g><rect x="655" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="720" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Consolidador_Service</text></g>
  <g><rect x="880" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="940" y="107" font-size="11" font-weight="bold" text-anchor="middle">inventario_repos</text></g>
  <g><rect x="1055" y="85" width="90" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1100" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_VENTA</text></g>
  <g><rect x="1190" y="85" width="100" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1240" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_RESERVA</text></g>
  <g><rect x="1305" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1360" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_INVENTARIO</text></g>

  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="121" x2="260" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="480" y1="121" x2="480" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="720" y1="121" x2="720" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="940" y1="121" x2="940" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1100" y1="121" x2="1100" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1240" y1="121" x2="1240" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1360" y1="121" x2="1360" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="254" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="474" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="714" y="215" width="12" height="575" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="934" y="325" width="12" height="375" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1094" y="340" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1234" y="420" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1354" y="505" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Solicitar panel -->
  <line x1="80" y1="160" x2="254" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="170.0" y="152" font-size="10.5" text-anchor="middle">1: ConsultarBalanceOperativo(id_sucursal, fecha)</text>

  <!-- 2: GET /monitor -->
  <line x1="266" y1="190" x2="474" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="370.0" y="182" font-size="10.5" text-anchor="middle">2: GET /api/inventario/monitor-operativo?sucursal=1</text>

  <!-- 3: Invocación servicio -->
  <line x1="486" y1="220" x2="714" y2="220" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="600.0" y="212" font-size="10.5" text-anchor="middle">3: consolidar_operaciones_sucursal(sucursal, fecha)</text>

  <!-- LOOP: Recorrer Sucursales -->
  <rect x="35" y="240" width="1340" height="495" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 240 L 90 240 L 100 257 L 100 265 L 35 265 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="257" font-size="11" font-weight="bold" text-anchor="middle">loop</text>
  <text x="110" y="258" font-size="10.5" font-weight="bold">[POR CADA SUCURSAL VINCULADA AL ENCARGADO / ADMIN]</text>

  <line x1="726" y1="285" x2="934" y2="285" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="830.0" y="277" font-size="10" text-anchor="middle">4: query_balance_completo(id_sucursal)</text>

  <!-- Consulta 1: T_VENTA -->
  <line x1="946" y1="325" x2="1094" y2="325" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1020.0" y="317" font-size="9.5" text-anchor="middle">5: SELECT SUM(TOTAL) FROM T_VENTA</text>

  <line x1="1094" y1="355" x2="946" y2="355" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1020.0" y="347" font-size="9" text-anchor="middle">6: return total_ventas_dia</text>

  <!-- Consulta 2: T_RESERVA -->
  <line x1="946" y1="405" x2="1234" y2="405" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1090.0" y="397" font-size="9.5" text-anchor="middle">7: SELECT * FROM T_RESERVA WHERE ESTADO = 'PENDIENTE'</text>

  <line x1="1234" y1="435" x2="946" y2="435" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1090.0" y="427" font-size="9" text-anchor="middle">8: return apartados_por_vencer</text>

  <!-- Consulta 3: T_INVENTARIO -->
  <line x1="946" y1="485" x2="1354" y2="485" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1150.0" y="477" font-size="9.5" text-anchor="middle">9: SELECT STOCK_DISPONIBLE, STOCK_MINIMO FROM T_INVENTARIO</text>

  <line x1="1354" y1="515" x2="946" y2="515" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1150.0" y="507" font-size="9" text-anchor="middle">10: return existencias_fisicas</text>

  <!-- OPT: Alerta de stock crítico -->
  <rect x="50" y="550" width="1310" height="75" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 550 L 95 550 L 105 565 L 105 572 L 50 572 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="565" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="566" font-size="10" font-weight="bold">[STOCK_DISPONIBLE &lt;= STOCK_MINIMO: GENERAR ALERTA]</text>

  <path d="M 726 585 L 765 585 L 765 605 L 728 605" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="772" y="598" font-size="9.5" text-anchor="start">11: flag_alerta_reposicion = true</text>

  <line x1="934" y1="675" x2="726" y2="675" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="830.0" y="667" font-size="10" text-anchor="middle">12: return dataset_operativo_sucursal</text>

  <!-- Retornos finales -->
  <line x1="714" y1="760" x2="486" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="600.0" y="752" font-size="10" text-anchor="middle">13: consolidar_kpis_en_vivo(metricas)</text>

  <line x1="474" y1="795" x2="266" y2="795" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="370.0" y="787" font-size="10" text-anchor="middle">14: HTTP 200 OK (balance_consolidado)</text>

  <line x1="254" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="170.0" y="827" font-size="10" text-anchor="middle">15: RenderizarMonitorOperativo(tablas, semaforos_stock)</text>

</svg>
