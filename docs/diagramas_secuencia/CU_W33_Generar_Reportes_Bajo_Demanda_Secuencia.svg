<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="1380" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1350" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 450 15 L 465 35 L 465 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold">CU/W33: Generar reportes bajo demanda</text>

  <g transform="translate(80, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">ADMINISTRADOR</text></g>

  <g><rect x="195" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="260" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">IU_ReportesDemanda</text></g>
  <g><rect x="420" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="480" y="107" font-size="11" font-weight="bold" text-anchor="middle">reportes_routes</text></g>
  <g><rect x="655" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="720" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Report_Builder_Service</text></g>
  <g><rect x="880" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="940" y="107" font-size="11" font-weight="bold" text-anchor="middle">reportes_repos</text></g>
  <g><rect x="1065" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1120" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_INVENTARIO</text></g>
  <g><rect x="1235" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1290" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_BITACORA</text></g>

  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="121" x2="260" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="480" y1="121" x2="480" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="720" y1="121" x2="720" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="940" y1="121" x2="940" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1120" y1="121" x2="1120" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1290" y1="121" x2="1290" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="254" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="474" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="714" y="215" width="12" height="575" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="934" y="325" width="12" height="340" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1114" y="350" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1284" y="575" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Solicitar reporte -->
  <line x1="80" y1="160" x2="254" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="170.0" y="152" font-size="10.5" text-anchor="middle">1: ConfigurarParametros(tipo='STOCK', fechas, formato='PDF')</text>

  <!-- 2: POST /reportes/generar -->
  <line x1="266" y1="190" x2="474" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="370.0" y="182" font-size="10.5" text-anchor="middle">2: POST /api/reportes/generar</text>

  <!-- 3: Invocación builder -->
  <line x1="486" y1="220" x2="714" y2="220" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="600.0" y="212" font-size="10.5" text-anchor="middle">3: compilar_reporte_documental(criterios)</text>

  <!-- Fragmento ALT: PDF vs EXCEL -->
  <rect x="35" y="240" width="1320" height="490" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 240 L 90 240 L 100 257 L 100 265 L 35 265 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="257" font-size="11" font-weight="bold" text-anchor="middle">alt</text>
  <text x="110" y="258" font-size="10.5" font-weight="bold">[FORMATO SELECCIONADO = PDF (REPORTLAB)]</text>

  <line x1="726" y1="285" x2="934" y2="285" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="830.0" y="277" font-size="10" text-anchor="middle">4: extraer_datos_reporte_stock(sucursal)</text>

  <line x1="946" y1="350" x2="1114" y2="350" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1030.0" y="342" font-size="9.5" text-anchor="middle">5: SELECT * FROM T_INVENTARIO WHERE STOCK_ACTUAL &gt; 0</text>

  <line x1="1114" y1="380" x2="946" y2="380" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1030.0" y="372" font-size="9.5" text-anchor="middle">6: return tuplas_inventario_valorizado</text>

  <line x1="934" y1="410" x2="726" y2="410" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="830.0" y="402" font-size="10" text-anchor="middle">7: return dataset_tabular</text>

  <path d="M 726 435 L 765 435 L 765 455 L 728 455" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="772" y="448" font-size="10" text-anchor="start">8: renderizar_plantilla_pdf(ReportLab_Canvas)</text>

  <line x1="35" y1="480" x2="1355" y2="480" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="50" y="497" font-size="10.5" font-weight="bold">[FORMATO SELECCIONADO = EXCEL (OPENPYXL)]</text>

  <path d="M 726 520 L 765 520 L 765 540 L 728 540" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="772" y="533" font-size="10" text-anchor="start">9: generar_hoja_calculo_xlsx(OpenPyXL_Workbook)</text>

  <!-- OPT: Auditoría en T_BITACORA -->
  <rect x="50" y="560" width="1290" height="70" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 560 L 95 560 L 105 575 L 105 582 L 50 582 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="575" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="576" font-size="10" font-weight="bold">[TRAZABILIDAD DE EXPORTACIÓN EN T_BITACORA]</text>

  <line x1="726" y1="600" x2="1284" y2="600" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1005.0" y="592" font-size="9.5" text-anchor="middle">10: INSERT INTO T_BITACORA ('EXPORTAR_REPORTE', formato, user_id)</text>

  <!-- Retornos finales -->
  <line x1="714" y1="760" x2="486" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="600.0" y="752" font-size="10" text-anchor="middle">11: return archivo_binario(bytes)</text>

  <line x1="474" y1="795" x2="266" y2="795" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="370.0" y="787" font-size="10" text-anchor="middle">12: HTTP 200 OK (Content-Type: application/pdf o xlsx)</text>

  <line x1="254" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="170.0" y="827" font-size="10" text-anchor="middle">13: DescargarDocumentoOficial(archivo_generado)</text>

</svg>
