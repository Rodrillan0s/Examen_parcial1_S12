<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="1380" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1350" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 430 15 L 445 35 L 445 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12.5" font-weight="bold">CU/W30: Gestionar promociones</text>

  <g transform="translate(80, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">ADMIN_TIENDA</text></g>

  <g><rect x="200" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="260" y="107" font-size="11" font-weight="bold" text-anchor="middle">IU_Promociones</text></g>
  <g><rect x="420" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="480" y="107" font-size="11" font-weight="bold" text-anchor="middle">productos_routes</text></g>
  <g><rect x="660" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="720" y="107" font-size="11" font-weight="bold" text-anchor="middle">productos_services</text></g>
  <g><rect x="900" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="960" y="107" font-size="11" font-weight="bold" text-anchor="middle">productos_repos</text></g>
  <g><rect x="1075" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1140" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_PROMOCION</text></g>
  <g><rect x="1245" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1300" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_BITACORA</text></g>

  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="121" x2="260" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="480" y1="121" x2="480" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="720" y1="121" x2="720" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="960" y1="121" x2="960" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1140" y1="121" x2="1140" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1300" y1="121" x2="1300" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="254" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="474" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="714" y="215" width="12" height="575" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="954" y="360" width="12" height="340" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1134" y="390" width="12" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1294" y="650" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Crear promocion -->
  <line x1="80" y1="160" x2="254" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="170.0" y="152" font-size="10.5" text-anchor="middle">1: GuardarPromocion(nombre, %descuento, fechas, prendas)</text>

  <!-- 2: POST /promocion -->
  <line x1="266" y1="190" x2="474" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="370.0" y="182" font-size="10.5" text-anchor="middle">2: POST /api/productos/promocion</text>

  <!-- 3: Validar reglas -->
  <line x1="486" y1="220" x2="714" y2="220" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="600.0" y="212" font-size="10.5" text-anchor="middle">3: asignar_promocion_producto_service(datos)</text>

  <!-- Fragmento ALT: Fechas válidas vs Solapamiento -->
  <rect x="35" y="240" width="1320" height="490" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 240 L 90 240 L 100 257 L 100 265 L 35 265 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="257" font-size="11" font-weight="bold" text-anchor="middle">alt</text>
  <text x="110" y="258" font-size="10.5" font-weight="bold">[FECHAS VÁLIDAS Y SIN SOLAPAMIENTO DE CAMPAÑA]</text>

  <line x1="726" y1="280" x2="954" y2="280" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="840.0" y="272" font-size="10" text-anchor="middle">4: validar_no_solapamiento_vigencia(fechas)</text>

  <line x1="954" y1="305" x2="726" y2="305" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="840.0" y="297" font-size="10" text-anchor="middle">5: return ok_sin_conflicto</text>

  <!-- 6: Insert T_PROMOCION -->
  <line x1="726" y1="335" x2="954" y2="335" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="840.0" y="327" font-size="10" text-anchor="middle">6: registrar_promocion(cabecera_promo)</text>

  <line x1="966" y1="365" x2="1134" y2="365" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1050.0" y="357" font-size="9.5" text-anchor="middle">7: INSERT INTO T_PROMOCION</text>

  <line x1="1134" y1="395" x2="966" y2="395" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1050.0" y="387" font-size="9.5" text-anchor="middle">8: return id_promocion_generado</text>

  <!-- LOOP: Vincular cada prenda -->
  <rect x="50" y="420" width="1290" height="100" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 420 L 95 420 L 105 435 L 105 442 L 50 442 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="435" font-size="10" font-weight="bold" text-anchor="middle">loop</text>
  <text x="115" y="436" font-size="10" font-weight="bold">[POR CADA PRENDA SELECCIONADA PARA LA PROMOCIÓN]</text>

  <line x1="966" y1="465" x2="1134" y2="465" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1050.0" y="457" font-size="9.5" text-anchor="middle">9: INSERT INTO T_PROMOCION_PRODUCTO (id_promo, id_producto, %)</text>

  <line x1="1134" y1="495" x2="966" y2="495" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1050.0" y="487" font-size="9.5" text-anchor="middle">10: return confirmacion_vinculacion</text>

  <!-- OPT: Auditoría en Bitácora -->
  <rect x="50" y="535" width="1290" height="70" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 535 L 95 535 L 105 550 L 105 557 L 50 557 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="550" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="551" font-size="10" font-weight="bold">[AUDITAR REGISTRO DE PROMOCIÓN]</text>

  <line x1="966" y1="575" x2="1294" y2="575" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1130.0" y="567" font-size="9.5" text-anchor="middle">11: INSERT INTO T_BITACORA ('CREAR_PROMOCION', user_id)</text>

  <!-- Rama 2 ALT: Solapamiento -->
  <line x1="35" y1="620" x2="1355" y2="620" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="50" y="637" font-size="10.5" font-weight="bold">[ERROR: SOLAPAMIENTO DE FECHAS O RANGO INVÁLIDO]</text>

  <line x1="714" y1="665" x2="486" y2="665" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="600.0" y="657" font-size="10" text-anchor="middle">12: return Error('Conflicto con promoción vigente en las mismas fechas')</text>

  <line x1="474" y1="695" x2="266" y2="695" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="370.0" y="687" font-size="10" text-anchor="middle">13: HTTP 400 Bad Request</text>

  <!-- Retorno exitoso final -->
  <line x1="714" y1="760" x2="486" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="600.0" y="752" font-size="10" text-anchor="middle">14: respuesta_exitosa(promocion_guardada)</text>

  <line x1="474" y1="795" x2="266" y2="795" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="370.0" y="787" font-size="10" text-anchor="middle">15: HTTP 201 Created (datos_promocion)</text>

  <line x1="254" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="170.0" y="827" font-size="10" text-anchor="middle">16: NotificarPromocionActiva(mensaje_exito)</text>

</svg>
