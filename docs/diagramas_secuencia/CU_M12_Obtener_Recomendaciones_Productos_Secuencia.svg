<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="1380" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1350" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 480 15 L 495 35 L 495 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold">CU/M12: Obtener recomendaciones de productos (Mobile)</text>

  <g transform="translate(80, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">CLIENTE_MOVIL</text></g>

  <g><rect x="200" y="85" width="140" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="270" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Feed_Recomendados_Screen</text></g>
  <g><rect x="435" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="500" y="107" font-size="11" font-weight="bold" text-anchor="middle">Recomendaciones_Cubit</text></g>
  <g><rect x="670" y="85" width="140" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="740" y="107" font-size="10" font-weight="bold" text-anchor="middle">Mobile_API_Client</text></g>
  <g><rect x="925" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="990" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_RECOMENDACION</text></g>
  <g><rect x="1095" y="85" width="150" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1170" y="107" font-size="9.5" font-weight="bold" text-anchor="middle">T_HISTORIAL_NAVEGACION</text></g>
  <g><rect x="1260" y="85" width="100" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1310" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_PRODUCTO</text></g>

  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="270" y1="121" x2="270" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="121" x2="500" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="740" y1="121" x2="740" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="990" y1="121" x2="990" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1170" y1="121" x2="1170" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1310" y1="121" x2="1310" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="264" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="494" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="734" y="215" width="12" height="575" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="984" y="360" width="12" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1164" y="575" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1304" y="440" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Abrir app móvil -->
  <line x1="80" y1="160" x2="264" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="175.0" y="152" font-size="10.5" text-anchor="middle">1: TocarPestañaParaTi()</text>

  <!-- 2: Cargar Cubit -->
  <line x1="276" y1="190" x2="494" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="385.0" y="182" font-size="10.5" text-anchor="middle">2: cargar_recomendaciones()</text>

  <!-- ALT: Cache Local vs Sync Backend -->
  <rect x="35" y="220" width="1320" height="510" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 220 L 90 220 L 100 237 L 100 245 L 35 245 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="237" font-size="11" font-weight="bold" text-anchor="middle">alt</text>
  <text x="110" y="238" font-size="10.5" font-weight="bold">[CACHE LOCAL VÁLIDA EN DISPOSITIVO]</text>

  <path d="M 506 265 L 545 265 L 545 285 L 508 285" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="552" y="278" font-size="10" text-anchor="start">3: recuperar_cache_local_hive()</text>

  <line x1="35" y1="310" x2="1355" y2="310" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="50" y="327" font-size="10.5" font-weight="bold">[FEED DESACTUALIZADO O SIN CONEXIÓN PREVIA: SYNC REST]</text>

  <line x1="506" y1="340" x2="734" y2="340" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="620.0" y="332" font-size="10" text-anchor="middle">4: get_productos_recomendados(id_cliente)</text>

  <line x1="746" y1="370" x2="984" y2="370" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="865.0" y="362" font-size="9.5" text-anchor="middle">5: SELECT * FROM T_RECOMENDACION WHERE ID_CLIENTE = ?</text>

  <line x1="984" y1="400" x2="746" y2="400" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="865.0" y="392" font-size="9.5" text-anchor="middle">6: return id_productos_recomendados</text>

  <line x1="746" y1="440" x2="1304" y2="440" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1025.0" y="432" font-size="9.5" text-anchor="middle">7: SELECT NOMBRE, PRECIO, IMAGEN_URL FROM T_PRODUCTO</text>

  <line x1="1304" y1="470" x2="746" y2="470" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1025.0" y="462" font-size="9.5" text-anchor="middle">8: return datos_prendas_sugeridas</text>

  <!-- OPT: Registro en historial navegación -->
  <rect x="50" y="520" width="1290" height="80" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 520 L 95 520 L 105 535 L 105 542 L 50 542 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="535" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="536" font-size="10" font-weight="bold">[REGISTRAR VISITA EN HISTORIAL DE NAVEGACIÓN]</text>

  <line x1="746" y1="565" x2="1164" y2="565" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="955.0" y="557" font-size="9.5" text-anchor="middle">9: INSERT INTO T_HISTORIAL_NAVEGACION (ID_CLIENTE, ID_PRODUCTO, 'VISTA_FEED')</text>

  <line x1="734" y1="640" x2="506" y2="640" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="620.0" y="632" font-size="10" text-anchor="middle">10: return prendas_recomendadas_json</text>

  <!-- LOOP: Construir Cards Móviles -->
  <path d="M 506 675 L 545 675 L 545 695 L 508 695" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="552" y="688" font-size="9.5" text-anchor="start">11: emit(RecomendacionesLoaded(cards_optimizadas))</text>

  <line x1="494" y1="760" x2="276" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="385.0" y="752" font-size="10" text-anchor="middle">12: actualizar_estado_feed()</text>

  <line x1="264" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="175.0" y="827" font-size="10" text-anchor="middle">13: RenderizarCarruselNativo('Descubre tu Estilo')</text>

</svg>
