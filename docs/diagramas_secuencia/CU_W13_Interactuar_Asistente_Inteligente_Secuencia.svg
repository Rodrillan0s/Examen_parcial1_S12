<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 920" width="1420" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Marco Exterior -->
  <rect x="15" y="15" width="1390" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 470 15 L 485 35 L 485 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12.5" font-weight="bold" fill="#000000">CU/W13: Interactuar con asistente inteligente (DeepSeek AI)</text>

  <!-- Participantes -->
  <g transform="translate(80, 55)">
    <circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/>
    <line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/>
    <text x="0" y="78" font-size="11" font-weight="bold" text-anchor="middle">CLIENTE</text>
  </g>

  <g><rect x="190" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="250" y="107" font-size="11" font-weight="bold" text-anchor="middle">IU_AsistenteChat</text></g>
  <g><rect x="400" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="460" y="107" font-size="11" font-weight="bold" text-anchor="middle">asistente_routes</text></g>
  <g><rect x="615" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="680" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">DeepSeek_AI_Service</text></g>
  <g><rect x="850" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="910" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">asistente_repos</text></g>
  <g><rect x="1025" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1080" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">T_PRODUCTO</text></g>
  <g><rect x="1170" y="85" width="100" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1220" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_VENTA</text></g>
  <g><rect x="1300" y="85" width="100" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1350" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_SUCURSAL</text></g>

  <!-- Líneas de vida -->
  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="121" x2="250" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="460" y1="121" x2="460" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="680" y1="121" x2="680" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="910" y1="121" x2="910" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1080" y1="121" x2="1080" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1220" y1="121" x2="1220" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1350" y1="121" x2="1350" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Barras activación -->
  <rect x="244" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="454" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="674" y="215" width="12" height="575" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="904" y="365" width="12" height="345" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1074" y="390" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1214" y="525" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1344" y="650" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Enviar mensaje -->
  <line x1="80" y1="160" x2="244" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="165.0" y="152" font-size="10.5" text-anchor="middle">1: EnviarMensaje("¿Tienen blusas de seda en stock?")</text>

  <!-- 2: POST /chat -->
  <line x1="256" y1="190" x2="454" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="355.0" y="182" font-size="10.5" text-anchor="middle">2: POST /api/asistente/chat</text>

  <!-- 3: Procesar con DeepSeek -->
  <line x1="466" y1="220" x2="674" y2="220" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="570.0" y="212" font-size="10.5" text-anchor="middle">3: procesar_mensaje_chat(msg, historial)</text>

  <!-- Fragmento ALT: Charla simple vs Function Calling BD -->
  <rect x="35" y="240" width="1360" height="495" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 240 L 90 240 L 100 257 L 100 265 L 35 265 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="257" font-size="11" font-weight="bold" text-anchor="middle">alt</text>
  <text x="110" y="258" font-size="10.5" font-weight="bold">[RESPUESTA CONVERSACIONAL SIMPLE SIN TOOLS]</text>

  <path d="M 686 270 L 725 270 L 725 295 L 688 295" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="732" y="285" font-size="10" text-anchor="start">4: generar_respuesta_texto_directa()</text>

  <!-- Línea divisoria alt -->
  <line x1="35" y1="315" x2="1395" y2="315" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="50" y="332" font-size="10.5" font-weight="bold">[FUNCTION CALLING REQUERIDO: CONSULTAS EN BASE DE DATOS]</text>

  <!-- 5: Despachar Tool -->
  <line x1="686" y1="355" x2="904" y2="355" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="795.0" y="347" font-size="10" text-anchor="middle">5: ejecutar_herramienta('buscar_prendas_catalogo', params)</text>

  <!-- 6: Query T_PRODUCTO -->
  <line x1="916" y1="390" x2="1074" y2="390" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="995.0" y="382" font-size="9.5" text-anchor="middle">6: SELECT * FROM T_PRODUCTO</text>

  <line x1="1074" y1="415" x2="916" y2="415" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="995.0" y="407" font-size="9" text-anchor="middle">7: return prendas_encontradas</text>

  <!-- OPT: Consultar compras si el cliente pide su pedido -->
  <rect x="50" y="445" width="1330" height="120" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 445 L 95 445 L 105 460 L 105 467 L 50 467 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="460" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="461" font-size="10" font-weight="bold">[SI PREGUNTA POR ESTADO DE COMPRA / TRACKING]</text>

  <line x1="916" y1="490" x2="1214" y2="490" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1065.0" y="482" font-size="9.5" text-anchor="middle">8: SELECT * FROM T_VENTA WHERE ID_CLIENTE = ?</text>

  <line x1="1214" y1="520" x2="916" y2="520" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1065.0" y="512" font-size="9.5" text-anchor="middle">9: return estado_compras_recientes</text>

  <!-- OPT: Consultar tiendas físicas -->
  <rect x="50" y="580" width="1330" height="115" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 580 L 95 580 L 105 595 L 105 602 L 50 602 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="595" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="596" font-size="10" font-weight="bold">[SI CONSULTA TIENDAS FÍSICAS O DIRECCIONES]</text>

  <line x1="916" y1="625" x2="1344" y2="625" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1130.0" y="617" font-size="9.5" text-anchor="middle">10: SELECT * FROM T_SUCURSAL WHERE ESTADO = 'ACTIVO'</text>

  <line x1="1344" y1="655" x2="916" y2="655" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1130.0" y="647" font-size="9.5" text-anchor="middle">11: return lista_sucursales_horarios</text>

  <!-- Retorno Tools a DeepSeek -->
  <line x1="904" y1="715" x2="686" y2="715" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="795.0" y="707" font-size="10" text-anchor="middle">12: return resultado_datos_herramienta</text>

  <!-- Retornos finales -->
  <line x1="674" y1="760" x2="466" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="570.0" y="752" font-size="10" text-anchor="middle">13: return respuesta_sintetizada_ia(texto, datos_cards)</text>

  <line x1="454" y1="795" x2="256" y2="795" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="355.0" y="787" font-size="10" text-anchor="middle">14: HTTP 200 OK (payload_chat_cards)</text>

  <line x1="244" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="165.0" y="827" font-size="10" text-anchor="middle">15: DesplegarBurbujaAsistente(texto, cards_prendas)</text>

</svg>
