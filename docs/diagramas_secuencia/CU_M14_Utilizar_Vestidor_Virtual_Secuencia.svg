<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1250" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 490 15 L 505 35 L 505 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold">CU/M14: Utilizar vestidor virtual (Realidad Aumentada)</text>

  <g transform="translate(70, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">CLIENTE_MOVIL</text></g>

  <g><rect x="155" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="220" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Vestidor_Screen</text></g>
  <g><rect x="345" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="410" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">AR_Camera_Ctrl</text></g>
  <g><rect x="555" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="620" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Pose_Body_Detector</text></g>
  <g><rect x="770" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="830" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Vestidor_Service</text></g>
  <g><rect x="965" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1020" y="107" font-size="10" font-weight="bold" text-anchor="middle">T_PRENDA_RA</text></g>
  <g><rect x="1125" y="85" width="110" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1180" y="107" font-size="9.5" font-weight="bold" text-anchor="middle">T_VESTIDOR_VIRTUAL</text></g>

  <line x1="70" y1="138" x2="70" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="220" y1="121" x2="220" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="410" y1="121" x2="410" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="620" y1="121" x2="620" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="830" y1="121" x2="830" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1020" y1="121" x2="1020" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1180" y1="121" x2="1180" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="214" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="404" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="614" y="235" width="12" height="320" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="824" y="575" width="12" height="180" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1014" y="605" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1174" y="680" width="12" height="35" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Iniciar vestidor -->
  <line x1="70" y1="160" x2="214" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="145.0" y="152" font-size="10.5" text-anchor="middle">1: Tocar'Probar en Vestidor Virtual'</text>

  <!-- 2: Inicializar Cámara -->
  <line x1="226" y1="190" x2="404" y2="190" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="315.0" y="182" font-size="10.5" text-anchor="middle">2: inicializar_camara_frontal()</text>

  <!-- LOOP: 60 FPS Camera Frames -->
  <rect x="35" y="215" width="1220" height="325" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 215 L 90 215 L 100 232 L 100 240 L 35 240 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="232" font-size="11" font-weight="bold" text-anchor="middle">loop</text>
  <text x="110" y="233" font-size="10.5" font-weight="bold">[POR CADA FRAME DEL FEED DE CÁMARA]</text>

  <line x1="416" y1="260" x2="614" y2="260" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="515.0" y="252" font-size="10" text-anchor="middle">3: procesar_frame(CameraImage)</text>

  <!-- ALT: Cuerpo detectado vs Fuera de encuadre -->
  <rect x="50" y="285" width="1190" height="235" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 285 L 95 285 L 105 300 L 105 307 L 50 307 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="300" font-size="10" font-weight="bold" text-anchor="middle">alt</text>
  <text x="115" y="301" font-size="10" font-weight="bold">[CUERPO Y PUNTOS CLAVE DE TORSO DETECTADOS (ANCHORS OK)]</text>

  <path d="M 626 330 L 665 330 L 665 350 L 628 350" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="672" y="343" font-size="9.5" text-anchor="start">4: calcular_escala_y_posicion(hombros, cadera)</text>

  <line x1="614" y1="375" x2="416" y2="375" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="515.0" y="367" font-size="9.5" text-anchor="middle">5: return PoseData(escala, rotacion, traslacion)</text>

  <line x1="404" y1="405" x2="226" y2="405" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="315.0" y="397" font-size="9.5" text-anchor="middle">6: superponer_prenda_sobre_frame(PoseData)</text>

  <line x1="50" y1="435" x2="1240" y2="435" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="65" y="452" font-size="10" font-weight="bold">[CUERPO NO DETECTADO O ILUMINACIÓN INSUFICIENTE]</text>

  <line x1="614" y1="480" x2="226" y2="480" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="420.0" y="472" font-size="9.5" text-anchor="middle">7: MostrarGuiaVisual('Ubícate frente a la cámara')</text>

  <!-- Descargar recurso textil -->
  <line x1="226" y1="565" x2="824" y2="565" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="525.0" y="557" font-size="10" text-anchor="middle">8: get_recursos_prenda_ra(id_producto)</text>

  <line x1="836" y1="605" x2="1014" y2="605" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="925.0" y="597" font-size="9.5" text-anchor="middle">9: SELECT MODELO_2D_URL, MODELO_3D_URL FROM T_PRENDA_RA</text>

  <line x1="1014" y1="635" x2="836" y2="635" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="925.0" y="627" font-size="9.5" text-anchor="middle">10: return url_textura_transparente</text>

  <!-- OPT: Guardar sesion de uso en T_VESTIDOR_VIRTUAL -->
  <rect x="50" y="660" width="1190" height="70" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 660 L 95 660 L 105 675 L 105 682 L 50 682 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="675" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="676" font-size="10" font-weight="bold">[REGISTRAR USO DEL VESTIDOR VIRTUAL]</text>

  <line x1="836" y1="700" x2="1174" y2="700" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1005.0" y="692" font-size="9.5" text-anchor="middle">11: INSERT INTO T_VESTIDOR_VIRTUAL (ID_CLIENTE, ID_PRENDA_RA, NOW())</text>

  <!-- Retorno final -->
  <line x1="824" y1="760" x2="226" y2="760" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="525.0" y="752" font-size="10" text-anchor="middle">12: return textura_optimizada_ra</text>

  <line x1="214" y1="835" x2="70" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="145.0" y="827" font-size="10" text-anchor="middle">13: VisualizarPrendaSuperpuestaEnCuerpo(feed_en_vivo)</text>

</svg>
