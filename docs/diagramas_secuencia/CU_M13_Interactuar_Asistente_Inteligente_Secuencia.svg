<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow_sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/></marker>
    <marker id="arrow_return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker>
  </defs>

  <rect x="15" y="15" width="1370" height="890" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 15 15 L 480 15 L 495 35 L 495 45 L 15 45 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold">CU/M13: Interactuar con asistente inteligente (Mobile Voz/Chat)</text>

  <g transform="translate(80, 55)"><circle cx="0" cy="18" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="27" x2="0" y2="48" stroke="#000000" stroke-width="1.5"/><line x1="-15" y1="35" x2="15" y2="35" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="-12" y2="65" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="48" x2="12" y2="65" stroke="#000000" stroke-width="1.5"/><text x="0" y="78" font-size="10.5" font-weight="bold" text-anchor="middle">CLIENTE_MOVIL</text></g>

  <g><rect x="195" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="260" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Voice_Chat_Screen</text></g>
  <g><rect x="410" y="85" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="470" y="107" font-size="10.5" font-weight="bold" text-anchor="middle">Voice_Chat_Cubit</text></g>
  <g><rect x="615" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="680" y="107" font-size="10" font-weight="bold" text-anchor="middle">Speech_Detector</text></g>
  <g><rect x="835" y="85" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="900" y="107" font-size="10" font-weight="bold" text-anchor="middle">AI_Mobile_Client</text></g>
  <g><rect x="1025" y="85" width="90" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1070" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_CLIENTE</text></g>
  <g><rect x="1175" y="85" width="90" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1220" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_VENTA</text></g>
  <g><rect x="1300" y="85" width="100" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="1350" y="107" font-size="11" font-weight="bold" text-anchor="middle">T_RESERVA</text></g>

  <line x1="80" y1="138" x2="80" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="121" x2="260" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="470" y1="121" x2="470" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="680" y1="121" x2="680" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="900" y1="121" x2="900" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1070" y1="121" x2="1070" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1220" y1="121" x2="1220" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1350" y1="121" x2="1350" y2="880" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

  <rect x="254" y="155" width="12" height="695" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="464" y="185" width="12" height="635" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="674" y="235" width="12" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="894" y="360" width="12" height="340" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1214" y="465" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="1344" y="575" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- 1: Interacción móvil -->
  <line x1="80" y1="160" x2="254" y2="160" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="170.0" y="152" font-size="10.5" text-anchor="middle">1: TocarMicrofono('¿Dónde está mi pedido?')</text>

  <!-- ALT: Voz STT vs Texto Teclado -->
  <rect x="35" y="180" width="1340" height="170" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 35 180 L 90 180 L 100 197 L 100 205 L 35 205 Z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="65" y="197" font-size="11" font-weight="bold" text-anchor="middle">alt</text>
  <text x="110" y="198" font-size="10.5" font-weight="bold">[ENTRADA POR VOZ EN TIEMPO REAL]</text>

  <line x1="266" y1="225" x2="464" y2="225" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="365.0" y="217" font-size="10" text-anchor="middle">2: escuchar_audio_stream()</text>

  <line x1="476" y1="250" x2="674" y2="250" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="575.0" y="242" font-size="9.5" text-anchor="middle">3: convertir_audio_a_texto(buffer)</text>

  <line x1="674" y1="280" x2="476" y2="280" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="575.0" y="272" font-size="9.5" text-anchor="middle">4: return texto_transcrito</text>

  <line x1="35" y1="305" x2="1375" y2="305" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="50" y="322" font-size="10" font-weight="bold">[ENTRADA POR TECLADO EN PANTALLA]</text>
  <text x="365.0" y="337" font-size="9.5" text-anchor="middle">5: enviar_texto_directo(mensaje_str)</text>

  <!-- Enviar a AI Client -->
  <line x1="476" y1="375" x2="894" y2="375" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="685.0" y="367" font-size="10" text-anchor="middle">6: post_mensaje_ia(texto, token_jwt)</text>

  <!-- ALT: Intención Pedido vs Intención Reserva -->
  <rect x="50" y="405" width="1310" height="250" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 405 L 95 405 L 105 420 L 105 427 L 50 427 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="420" font-size="10" font-weight="bold" text-anchor="middle">alt</text>
  <text x="115" y="421" font-size="10" font-weight="bold">[INTENCIÓN: CONSULTAR ESTADO DE COMPRA / TRACKING]</text>

  <line x1="906" y1="455" x2="1214" y2="455" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1060.0" y="447" font-size="9" text-anchor="middle">7: SELECT NUMERO_VENTA, ESTADO, TOTAL FROM T_VENTA</text>

  <line x1="1214" y1="485" x2="906" y2="485" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1060.0" y="477" font-size="9" text-anchor="middle">8: return tracking_pedido_activo</text>

  <line x1="50" y1="520" x2="1360" y2="520" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="65" y="537" font-size="10" font-weight="bold">[INTENCIÓN: CONSULTAR CÓDIGO QR DE RESERVA EN TIENDA]</text>

  <line x1="906" y1="565" x2="1344" y2="565" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="1125.0" y="557" font-size="9" text-anchor="middle">9: SELECT CODIGO_RESERVA, FECHA_EXPIRACION FROM T_RESERVA</text>

  <line x1="1344" y1="595" x2="906" y2="595" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="1125.0" y="587" font-size="9" text-anchor="middle">10: return ticket_qr_reserva</text>

  <!-- Retorno AI Client -->
  <line x1="894" y1="685" x2="476" y2="685" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="685.0" y="677" font-size="10" text-anchor="middle">11: return respuesta_enriquecida_movil</text>

  <!-- OPT: Síntesis de voz TTS -->
  <rect x="50" y="715" width="1310" height="55" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M 50 715 L 95 715 L 105 730 L 105 737 L 50 737 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="75" y="730" font-size="10" font-weight="bold" text-anchor="middle">opt</text>
  <text x="115" y="731" font-size="10" font-weight="bold">[REPRODUCCIÓN DE VOZ SINTETIZADA TTS]</text>

  <line x1="476" y1="745" x2="674" y2="745" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow_sync)"/>
  <text x="575.0" y="738" font-size="9.5" text-anchor="middle">12: hablar_texto(respuesta_ia)</text>

  <!-- Retorno pantalla -->
  <line x1="464" y1="790" x2="266" y2="790" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="365.0" y="782" font-size="10" text-anchor="middle">13: emit(VoiceChatResponseLoaded(burbuja, action_card))</text>

  <line x1="254" y1="835" x2="80" y2="835" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow_return)"/>
  <text x="170.0" y="827" font-size="10" text-anchor="middle">14: MostrarRespuestaEnPantalla(texto, audio, card)</text>

</svg>
