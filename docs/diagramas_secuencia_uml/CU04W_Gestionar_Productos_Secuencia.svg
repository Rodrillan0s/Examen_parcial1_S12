<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 1060" width="1980" height="1060" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#b91c1c" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco exterior UML 2.5 -->
  <rect x="20" y="20" width="1940" height="1020" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <!-- Pestana de titulo UML con esquina achaflanada -->
  <path d="M 20 20 L 463 20 L 481 38 L 481 56 L 20 56 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <text x="35" y="42" font-size="13.5" font-weight="bold" fill="#0f172a">sd [CU04W] Gestionar productos (UML 2.5+ / BCE)</text>

  <!-- Actor -->
  <g transform="translate(130, 65)">
    <circle cx="0" cy="14" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#000000" stroke-width="1.8" />
    <line x1="-22" y1="36" x2="22" y2="36" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="-18" y2="78" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="18" y2="78" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="98" text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador de Empresa /</text>
    <text x='0' y='114' text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Encargado de Sucursal</text>
  </g>
  <line x1="130" y1="195" x2="130" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="126,1003 130,1013 134,1003" fill="#000000" />

  <!-- Participante: IU_Producto -->
  <g filter="url(#shadow)">
    <rect x="315" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="380" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;boundary&#187;</text>
    <text x="380" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IU_Producto</text>
  </g>
  <line x1="380" y1="191" x2="380" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="376,1003 380,1013 384,1003" fill="#000000" />

  <!-- Participante: ProductoControl -->
  <g filter="url(#shadow)">
    <rect x="585" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="660" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;control&#187;</text>
    <text x="660" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ProductoControl</text>
  </g>
  <line x1="660" y1="191" x2="660" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="656,1003 660,1013 664,1003" fill="#000000" />

  <!-- Participante: :t_categoria -->
