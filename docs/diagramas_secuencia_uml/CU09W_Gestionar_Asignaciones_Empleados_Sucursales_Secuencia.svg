<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 980" width="1920" height="980" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#b91c1c" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco exterior UML 2.5 -->
  <rect x="20" y="20" width="1880" height="940" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <!-- Pestana de titulo UML con esquina achaflanada -->
  <path d="M 20 20 L 724 20 L 742 38 L 742 56 L 20 56 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <text x="35" y="42" font-size="13.5" font-weight="bold" fill="#0f172a">sd [CU09W] Gestionar asignaciones de empleados a sucursales (UML 2.5+ / BCE)</text>

  <!-- Actor -->
  <g transform="translate(140, 65)">
    <circle cx="0" cy="14" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#000000" stroke-width="1.8" />
    <line x1="-22" y1="36" x2="22" y2="36" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="-18" y2="78" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="18" y2="78" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="98" text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador de Tienda</text>
    
  </g>
  <line x1="140" y1="195" x2="140" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="136,923 140,933 144,923" fill="#000000" />

  <!-- Participante: IU_AsignacionSucursales -->
  <g filter="url(#shadow)">
    <rect x="335" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="410" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;boundary&#187;</text>
    <text x="410" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IU_AsignacionSucursales</text>
  </g>
  <line x1="410" y1="191" x2="410" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="406,923 410,933 414,923" fill="#000000" />

  <!-- Participante: AsignacionControl -->
  <g filter="url(#shadow)">
    <rect x="645" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="720" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;control&#187;</text>
    <text x="720" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">AsignacionControl</text>
  </g>
  <line x1="720" y1="191" x2="720" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="716,923 720,933 724,923" fill="#000000" />

  <!-- Participante: :t_usuario -->
  <g filter="url(#shadow)">
    <rect x="950" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1010" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1010" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_usuario</text>
  </g>
  <line x1="1010" y1="191" x2="1010" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1006,923 1010,933 1014,923" fill="#000000" />

  <!-- Participante: :t_sucursal -->
  <g filter="url(#shadow)">
    <rect x="1205" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1270" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1270" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_sucursal</text>
  </g>
  <line x1="1270" y1="191" x2="1270" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1266,923 1270,933 1274,923" fill="#000000" />

  <!-- Participante: :t_usuario_sucursal -->
  <g filter="url(#shadow)">
    <rect x="1455" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1530" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1530" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_usuario_sucursal</text>
  </g>
  <line x1="1530" y1="191" x2="1530" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1526,923 1530,933 1534,923" fill="#000000" />

  <!-- Participante: :t_bitacora -->
  <g filter="url(#shadow)">
    <rect x="1720" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1780" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1780" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_bitacora</text>
  </g>
  <line x1="1780" y1="191" x2="1780" y2="925" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1776,923 1780,933 1784,923" fill="#000000" />
  <rect x="404" y="222" width="12" height="670" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="714" y="254" width="12" height="615" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1004" y="288" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1264" y="350" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1524" y="542" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1524" y="630" width="12" height="35" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1774" y="712" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <line x1="140" y1="228" x2="404" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="272.0" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">1: solicitar_asignacion_sucursales(id_empleado, ids_sucursales)</text>
  <line x1="416" y1="260" x2="714" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="565.0" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">2: asignar_sucursales(id_empleado, ids_sucursales)</text>
  <line x1="726" y1="292" x2="1004" y2="292" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="865.0" y="284" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">3: SELECT id_empresa, estado FROM t_usuario WHERE id_usuario = :id_empleado</text>
  <line x1="1004" y1="322" x2="726" y2="322" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="865.0" y="314" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">4: return datos_empleado</text>
  <line x1="726" y1="354" x2="1264" y2="354" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="995.0" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">5: SELECT COUNT(*) FROM t_sucursal WHERE id_sucursal = ANY(:ids) AND id_empresa = :actor_empresa</text>
  <line x1="1264" y1="384" x2="726" y2="384" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="995.0" y="376" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6: return sucursales_validas_count</text>
  <!-- Fragmento alt -->
  <rect x="35" y="405" width="1850" height="485" fill="none" stroke="#334155" stroke-width="1.3" />
  <path d="M 35 405 L 115 405 L 127 418 L 127 429 L 35 429 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3" />
  <text x="45" y="422" font-size="11" font-weight="bold" fill="#1e293b">alt</text>
  <text x="137" y="422" font-size="11" font-weight="bold" fill="#b91c1c">[sucursales_validas_count != length(ids_sucursales) || datos_empleado.id_empresa != actor.id_empresa] (Rechazo)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="505" x2="1885" y2="505" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="497" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="523" font-size="11" font-weight="bold" fill="#15803d">[else: sucursales_validas] (Curso Basico: Reemplazo Transaccional de Asignaciones)</text>
  <line x1="714" y1="445" x2="416" y2="445" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="565.0" y="437" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7.1: (Error, "Sucursales invalidas o ajenas a la empresa")</text>
  <line x1="404" y1="475" x2="140" y2="475" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="272.0" y="467" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7.2: Mostrar error: "Sucursales seleccionadas no pertenecen a la empresa"</text>
  <line x1="726" y1="545" x2="1524" y2="545" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1125.0" y="537" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">8: DELETE FROM t_usuario_sucursal WHERE id_usuario = :id_empleado</text>
  <line x1="1524" y1="575" x2="726" y2="575" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1125.0" y="567" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">9: return asignaciones_previas_eliminadas</text>
  <!-- Fragmento loop -->
  <rect x="470" y="600" width="1080" height="75" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,3" />
  <path d="M 470 600 L 520 600 L 530 612 L 530 622 L 470 622 Z" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" />
  <text x="478" y="616" font-size="10.5" font-weight="bold" fill="#1e293b">loop</text>
  <text x="536" y="616" font-size="10.5" font-weight="600" fill="#334155">[para cada id_sucursal en ids_sucursales]</text>
  <line x1="726" y1="635" x2="1524" y2="635" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1125.0" y="627" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10: INSERT INTO t_usuario_sucursal(id_usuario, id_sucursal)</text>
  <line x1="1524" y1="655" x2="726" y2="655" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1125.0" y="647" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11: return confirmacion_insercion</text>
  <line x1="726" y1="715" x2="1774" y2="715" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1250.0" y="707" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">12: INSERT INTO t_bitacora(id_usuario, id_empresa, modulo='USUARIOS', accion='ASIGNAR_SUCURSALES', ...)</text>
  <line x1="1774" y1="745" x2="726" y2="745" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1250.0" y="737" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">13: return confirmacion_log</text>
  <line x1="714" y1="795" x2="416" y2="795" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="565.0" y="787" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">14: confirmar_asignacion(ids_sucursales)</text>
  <line x1="404" y1="830" x2="140" y2="830" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="272.0" y="822" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">15: actualizar_asignaciones()</text>
</svg>