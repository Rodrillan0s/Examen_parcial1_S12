<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#b91c1c" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco exterior UML 2.5 -->
  <rect x="20" y="20" width="1880" height="920" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <!-- Pestana de titulo UML con esquina achaflanada -->
  <path d="M 20 20 L 643 20 L 661 38 L 661 56 L 20 56 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <text x="35" y="42" font-size="13.5" font-weight="bold" fill="#0f172a">sd [CU07W] Consultar plan y limites de suscripcion (UML 2.5+ / BCE)</text>

  <!-- Actor -->
  <g transform="translate(140, 65)">
    <circle cx="0" cy="14" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#000000" stroke-width="1.8" />
    <line x1="-22" y1="36" x2="22" y2="36" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="-18" y2="78" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="18" y2="78" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="98" text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador</text>
    
  </g>
  <line x1="140" y1="195" x2="140" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="136,903 140,913 144,903" fill="#000000" />

  <!-- Participante: IU_MiPlan -->
  <g filter="url(#shadow)">
    <rect x="345" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="410" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;boundary&#187;</text>
    <text x="410" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IU_MiPlan</text>
  </g>
  <line x1="410" y1="191" x2="410" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="406,903 410,913 414,903" fill="#000000" />

  <!-- Participante: ConsultaPlanControl -->
  <g filter="url(#shadow)">
    <rect x="640" y="135" width="160" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="720" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;control&#187;</text>
    <text x="720" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ConsultaPlanControl</text>
  </g>
  <line x1="720" y1="191" x2="720" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="716,903 720,913 724,903" fill="#000000" />

  <!-- Participante: :empresa -->
  <g filter="url(#shadow)">
    <rect x="950" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1010" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1010" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:empresa</text>
  </g>
  <line x1="1010" y1="191" x2="1010" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1006,903 1010,913 1014,903" fill="#000000" />

  <!-- Participante: :t_suscripcion -->
  <g filter="url(#shadow)">
    <rect x="1205" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1270" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1270" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_suscripcion</text>
  </g>
  <line x1="1270" y1="191" x2="1270" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1266,903 1270,913 1274,903" fill="#000000" />

  <!-- Participante: :t_plan -->
  <g filter="url(#shadow)">
    <rect x="1470" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1530" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1530" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_plan</text>
  </g>
  <line x1="1530" y1="191" x2="1530" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1526,903 1530,913 1534,903" fill="#000000" />

  <!-- Participante: :t_sucursal -->
  <g filter="url(#shadow)">
    <rect x="1705" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1770" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1770" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_sucursal</text>
  </g>
  <line x1="1770" y1="191" x2="1770" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1766,903 1770,913 1774,903" fill="#000000" />
  <rect x="404" y="222" width="12" height="650" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="714" y="254" width="12" height="595" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1004" y="318" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1264" y="382" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1524" y="578" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1764" y="642" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <line x1="140" y1="228" x2="404" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="272.0" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">1: solicitar_consulta_plan(id_empresa)</text>
  <line x1="416" y1="260" x2="714" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="565.0" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">2: consultar_plan_empresa(id_empresa)</text>
  <path d="M 726 276 L 752 276 L 752 296 L 726 296" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sync)" />
  <text x="758" y="290.0" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4px">3: validar_acceso_recurso_tenant(payload, id_empresa)</text>
  <line x1="726" y1="322" x2="1004" y2="322" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="865.0" y="314" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">4: SELECT estado, nombre_empresa FROM empresa WHERE id_empresa = :id</text>
  <line x1="1004" y1="352" x2="726" y2="352" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="865.0" y="344" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">5: return datos_empresa</text>
  <line x1="726" y1="386" x2="1264" y2="386" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="995.0" y="378" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6: SELECT id_suscripcion, codigo_plan, inicio, fin FROM t_suscripcion WHERE id_empresa = :id AND estado='ACTIVA' AND NOW() BETWEEN inicio AND fin</text>
  <line x1="1264" y1="416" x2="726" y2="416" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="995.0" y="408" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7: return suscripcion_activa</text>
  <!-- Fragmento alt -->
  <rect x="35" y="440" width="1850" height="435" fill="none" stroke="#334155" stroke-width="1.3" />
  <path d="M 35 440 L 115 440 L 127 453 L 127 464 L 35 464 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3" />
  <text x="45" y="457" font-size="11" font-weight="bold" fill="#1e293b">alt</text>
  <text x="137" y="457" font-size="11" font-weight="bold" fill="#b91c1c">[suscripcion_activa == null] (Curso Alterno: Sin Suscripcion Vigente)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="540" x2="1885" y2="540" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="532" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="558" font-size="11" font-weight="bold" fill="#15803d">[else: suscripcion_activa != null] (Curso Basico: Consulta y Calculo de Limites)</text>
  <line x1="714" y1="480" x2="416" y2="480" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="565.0" y="472" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">8.1: (Alerta, "Sin suscripcion activa o vigente")</text>
  <line x1="404" y1="510" x2="140" y2="510" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="272.0" y="502" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">8.2: Mostrar alerta: "Empresa sin suscripcion vigente"</text>
  <line x1="726" y1="582" x2="1524" y2="582" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1125.0" y="574" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">9: SELECT nombre, max_sucursales, reportes_generativos FROM t_plan WHERE codigo = :codigo_plan</text>
  <line x1="1524" y1="612" x2="726" y2="612" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1125.0" y="604" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10: return limites_plan</text>
  <line x1="726" y1="646" x2="1764" y2="646" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1245.0" y="638" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11: SELECT COUNT(*) FROM t_sucursal WHERE id_empresa = :id AND activo = true</text>
  <line x1="1764" y1="676" x2="726" y2="676" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1245.0" y="668" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">12: return conteo_sucursales_activas</text>
  <path d="M 726 706 L 752 706 L 752 726 L 726 726" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sync)" />
  <text x="758" y="720.0" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4px">13: calcular_margen_y_dias_restantes(suscripcion, limites, conteo)</text>
  <line x1="714" y1="755" x2="416" y2="755" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="565.0" y="747" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">14: entregar_resumen_plan(limites, conteo, dias_restantes)</text>
  <line x1="404" y1="790" x2="140" y2="790" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="272.0" y="782" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">15: mostrar_tablero_plan_y_limites()</text>
</svg>