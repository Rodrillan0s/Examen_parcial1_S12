<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 1060" width="1980" height="1060" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#b91c1c" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco exterior UML 2.5 -->
  <rect x="20" y="20" width="1940" height="1020" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <!-- Pestana de titulo UML con esquina achaflanada -->
  <path d="M 20 20 L 625 20 L 643 38 L 643 56 L 20 56 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <text x="35" y="42" font-size="13.5" font-weight="bold" fill="#0f172a">sd [CU06W] Gestionar suscripciones empresariales (UML 2.5+ / BCE)</text>

  <!-- Actor -->
  <g transform="translate(130, 65)">
    <circle cx="0" cy="14" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#000000" stroke-width="1.8" />
    <line x1="-22" y1="36" x2="22" y2="36" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="-18" y2="78" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="18" y2="78" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="98" text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador /</text>
    <text x='0' y='114' text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador de Tienda</text>
  </g>
  <line x1="130" y1="195" x2="130" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="126,1003 130,1013 134,1003" fill="#000000" />

  <!-- Participante: IU_Suscripciones -->
  <g filter="url(#shadow)">
    <rect x="305" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="370" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;boundary&#187;</text>
    <text x="370" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IU_Suscripciones</text>
  </g>
  <line x1="370" y1="191" x2="370" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="366,1003 370,1013 374,1003" fill="#000000" />

  <!-- Participante: SuscripcionControl -->
  <g filter="url(#shadow)">
    <rect x="565" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="640" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;control&#187;</text>
    <text x="640" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">SuscripcionControl</text>
  </g>
  <line x1="640" y1="191" x2="640" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="636,1003 640,1013 644,1003" fill="#000000" />

  <!-- Participante: :empresa -->
  <g filter="url(#shadow)">
    <rect x="860" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="920" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="920" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:empresa</text>
  </g>
  <line x1="920" y1="191" x2="920" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="916,1003 920,1013 924,1003" fill="#000000" />

  <!-- Participante: :t_plan -->
  <g filter="url(#shadow)">
    <rect x="1110" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1170" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1170" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_plan</text>
  </g>
  <line x1="1170" y1="191" x2="1170" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1166,1003 1170,1013 1174,1003" fill="#000000" />

  <!-- Participante: :t_sucursal -->
  <g filter="url(#shadow)">
    <rect x="1355" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1420" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1420" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_sucursal</text>
  </g>
  <line x1="1420" y1="191" x2="1420" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1416,1003 1420,1013 1424,1003" fill="#000000" />

  <!-- Participante: :t_suscripcion -->
  <g filter="url(#shadow)">
    <rect x="1605" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1670" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1670" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_suscripcion</text>
  </g>
  <line x1="1670" y1="191" x2="1670" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1666,1003 1670,1013 1674,1003" fill="#000000" />

  <!-- Participante: :t_bitacora -->
  <g filter="url(#shadow)">
    <rect x="1830" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1890" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1890" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_bitacora</text>
  </g>
  <line x1="1890" y1="191" x2="1890" y2="1005" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1886,1003 1890,1013 1894,1003" fill="#000000" />
  <rect x="364" y="222" width="12" height="750" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="634" y="254" width="12" height="695" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="914" y="288" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1164" y="348" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1414" y="408" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1664" y="468" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1664" y="658" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1884" y="728" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <line x1="130" y1="228" x2="364" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="247.0" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">1: solicitar_alta_suscripcion(id_empresa, codigo_plan, periodo, motivo)</text>
  <line x1="376" y1="260" x2="634" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="505.0" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">2: crear_suscripcion(id_empresa, datos_suscripcion)</text>
  <line x1="646" y1="292" x2="914" y2="292" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="780.0" y="284" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">3: SELECT estado FROM empresa WHERE id_empresa = :id FOR UPDATE</text>
  <line x1="914" y1="322" x2="646" y2="322" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="780.0" y="314" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">4: return estado_empresa</text>
  <line x1="646" y1="352" x2="1164" y2="352" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="905.0" y="344" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">5: SELECT max_sucursales, activo FROM t_plan WHERE codigo = :codigo FOR SHARE</text>
  <line x1="1164" y1="382" x2="646" y2="382" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="905.0" y="374" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6: return datos_plan</text>
  <line x1="646" y1="412" x2="1414" y2="412" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1030.0" y="404" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7: SELECT COUNT(*) FROM t_sucursal WHERE id_empresa = :id AND activo = true</text>
  <line x1="1414" y1="442" x2="646" y2="442" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1030.0" y="434" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">8: return sucursales_activas</text>
  <line x1="646" y1="472" x2="1664" y2="472" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1155.0" y="464" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">9: SELECT 1 FROM t_suscripcion WHERE id_empresa = :id AND estado='ACTIVA' AND inicio &lt; :fin AND fin &gt; :inicio</text>
  <line x1="1664" y1="502" x2="646" y2="502" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1155.0" y="494" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10: return periodo_solapado</text>
  <!-- Fragmento alt -->
  <rect x="35" y="520" width="1910" height="455" fill="none" stroke="#334155" stroke-width="1.3" />
  <path d="M 35 520 L 115 520 L 127 533 L 127 544 L 35 544 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3" />
  <text x="45" y="537" font-size="11" font-weight="bold" fill="#1e293b">alt</text>
  <text x="137" y="537" font-size="11" font-weight="bold" fill="#b91c1c">[estado_empresa != 'ACTIVO' || sucursales_activas &gt; max_sucursales || periodo_solapado] (Rechazo)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="620" x2="1945" y2="620" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="612" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="638" font-size="11" font-weight="bold" fill="#15803d">[else: validaciones_conformes] (Curso Basico: Registro de Suscripcion)</text>
  <line x1="634" y1="560" x2="376" y2="560" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="505.0" y="552" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11.1: (Error, "Periodo solapado o sucursales exceden limite del plan")</text>
  <line x1="364" y1="590" x2="130" y2="590" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="247.0" y="582" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11.2: Mostrar error: "Suscripcion incompatible: sucursales exceden limite"</text>
  <line x1="646" y1="665" x2="1664" y2="665" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1155.0" y="657" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">12: INSERT INTO t_suscripcion(id_empresa, codigo_plan, estado='ACTIVA', inicio, fin, motivo)</text>
  <line x1="1664" y1="695" x2="646" y2="695" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1155.0" y="687" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">13: return id_suscripcion</text>
  <line x1="646" y1="730" x2="1884" y2="730" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1265.0" y="722" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">14: INSERT INTO t_bitacora(id_usuario, id_empresa, modulo='SAAS', accion='ALTA_SUSCRIPCION', ...)</text>
  <line x1="1884" y1="760" x2="646" y2="760" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1265.0" y="752" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">15: return confirmacion_log</text>
  <line x1="634" y1="815" x2="376" y2="815" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="505.0" y="807" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">16: confirmar_suscripcion(id_suscripcion)</text>
  <line x1="364" y1="850" x2="130" y2="850" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="247.0" y="842" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">17: actualizar_suscripciones()</text>
</svg>