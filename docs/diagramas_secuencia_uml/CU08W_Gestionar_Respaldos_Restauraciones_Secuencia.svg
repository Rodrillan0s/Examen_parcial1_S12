<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 940" width="1860" height="940" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#b91c1c" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco exterior UML 2.5 -->
  <rect x="20" y="20" width="1820" height="900" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <!-- Pestana de titulo UML con esquina achaflanada -->
  <path d="M 20 20 L 616 20 L 634 38 L 634 56 L 20 56 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <text x="35" y="42" font-size="13.5" font-weight="bold" fill="#0f172a">sd [CU08W] Gestionar respaldos y restauraciones (UML 2.5+ / BCE)</text>

  <!-- Actor -->
  <g transform="translate(130, 65)">
    <circle cx="0" cy="14" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#000000" stroke-width="1.8" />
    <line x1="-22" y1="36" x2="22" y2="36" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="-18" y2="78" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="18" y2="78" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="98" text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador</text>
    <text x='0' y='114' text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>(SuperAdmin)</text>
  </g>
  <line x1="130" y1="195" x2="130" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="126,883 130,893 134,883" fill="#000000" />

  <!-- Participante: IU_Respaldos -->
  <g filter="url(#shadow)">
    <rect x="325" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="390" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;boundary&#187;</text>
    <text x="390" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IU_Respaldos</text>
  </g>
  <line x1="390" y1="191" x2="390" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="386,883 390,893 394,883" fill="#000000" />

  <!-- Participante: BackupControl -->
  <g filter="url(#shadow)">
    <rect x="625" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="700" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;control&#187;</text>
    <text x="700" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">BackupControl</text>
  </g>
  <line x1="700" y1="191" x2="700" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="696,883 700,893 704,883" fill="#000000" />

  <!-- Participante: :t_usuario -->
  <g filter="url(#shadow)">
    <rect x="940" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1000" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1000" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_usuario</text>
  </g>
  <line x1="1000" y1="191" x2="1000" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="996,883 1000,893 1004,883" fill="#000000" />

  <!-- Participante: :t_rol -->
  <g filter="url(#shadow)">
    <rect x="1190" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1250" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1250" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_rol</text>
  </g>
  <line x1="1250" y1="191" x2="1250" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1246,883 1250,893 1254,883" fill="#000000" />

  <!-- Participante: :PostgreSQL_DB -->
  <g filter="url(#shadow)">
    <rect x="1435" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1500" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1500" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:PostgreSQL_DB</text>
  </g>
  <line x1="1500" y1="191" x2="1500" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1496,883 1500,893 1504,883" fill="#000000" />

  <!-- Participante: :t_bitacora -->
  <g filter="url(#shadow)">
    <rect x="1670" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1730" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1730" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_bitacora</text>
  </g>
  <line x1="1730" y1="191" x2="1730" y2="885" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1726,883 1730,893 1734,883" fill="#000000" />
  <rect x="384" y="222" width="12" height="630" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="694" y="254" width="12" height="575" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="994" y="288" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1244" y="350" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1494" y="580" width="12" height="40" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1724" y="655" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <line x1="130" y1="228" x2="384" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="257.0" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">1: solicitar_generacion_backup(tipo='FULL_SQL')</text>
  <line x1="396" y1="260" x2="694" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="545.0" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">2: generar_backup(tipo)</text>
  <line x1="706" y1="292" x2="994" y2="292" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="850.0" y="284" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">3: SELECT id_rol FROM t_usuario WHERE id_usuario = :id_usuario</text>
  <line x1="994" y1="322" x2="706" y2="322" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="850.0" y="314" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">4: return id_rol</text>
  <line x1="706" y1="354" x2="1244" y2="354" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="975.0" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">5: SELECT nombre_rol FROM t_rol WHERE id_rol = :id_rol</text>
  <line x1="1244" y1="384" x2="706" y2="384" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="975.0" y="376" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6: return nombre_rol</text>
  <!-- Fragmento alt -->
  <rect x="35" y="405" width="1790" height="445" fill="none" stroke="#334155" stroke-width="1.3" />
  <path d="M 35 405 L 115 405 L 127 418 L 127 429 L 35 429 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3" />
  <text x="45" y="422" font-size="11" font-weight="bold" fill="#1e293b">alt</text>
  <text x="137" y="422" font-size="11" font-weight="bold" fill="#b91c1c">[nombre_rol != 'ADMINISTRADOR'] (Curso Alterno: Acceso Denegado)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="505" x2="1825" y2="505" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="497" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="523" font-size="11" font-weight="bold" fill="#15803d">[else: rol == 'ADMINISTRADOR'] (Curso Basico: Dump de Base de Datos y Descarga)</text>
  <line x1="694" y1="445" x2="396" y2="445" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="545.0" y="437" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7.1: (Error, "Acceso denegado: permisos insuficientes")</text>
  <line x1="384" y1="475" x2="130" y2="475" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="257.0" y="467" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7.2: Mostrar error: "Permisos insuficientes para generar respaldos"</text>
  <path d="M 706 540 L 732 540 L 732 560 L 706 560" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sync)" />
  <text x="738" y="554.0" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4px">8: preparar_comando_pg_dump(schema='comercio', host, db)</text>
  <line x1="706" y1="585" x2="1494" y2="585" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1100.0" y="577" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">9: SELECT pg_dump(schema='comercio', formato='sql')</text>
  <line x1="1494" y1="615" x2="706" y2="615" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1100.0" y="607" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10: return dump_sql_bytes</text>
  <line x1="706" y1="660" x2="1724" y2="660" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1215.0" y="652" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11: INSERT INTO t_bitacora(id_usuario, modulo='ADMIN', accion='BACKUP_GENERADO', ...)</text>
  <line x1="1724" y1="690" x2="706" y2="690" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1215.0" y="682" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">12: return confirmacion_log</text>
  <line x1="694" y1="740" x2="396" y2="740" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="545.0" y="732" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">13: entregar_archivo_sql(dump_sql_bytes, "backup.sql")</text>
  <line x1="384" y1="775" x2="130" y2="775" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="257.0" y="767" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">14: descargar_archivo_backup()</text>
</svg>