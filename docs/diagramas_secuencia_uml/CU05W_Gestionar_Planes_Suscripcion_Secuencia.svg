<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 880" width="1720" height="880" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polyline points="0,1 10,5 0,9" fill="none" stroke="#b91c1c" stroke-width="1.6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco exterior UML 2.5 -->
  <rect x="20" y="20" width="1680" height="840" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <!-- Pestana de titulo UML con esquina achaflanada -->
  <path d="M 20 20 L 571 20 L 589 38 L 589 56 L 20 56 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
  <text x="35" y="42" font-size="13.5" font-weight="bold" fill="#0f172a">sd [CU05W] Gestionar planes de suscripcion (UML 2.5+ / BCE)</text>

  <!-- Actor -->
  <g transform="translate(150, 65)">
    <circle cx="0" cy="14" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#000000" stroke-width="1.8" />
    <line x1="-22" y1="36" x2="22" y2="36" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="-18" y2="78" stroke="#000000" stroke-width="1.8" />
    <line x1="0" y1="52" x2="18" y2="78" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="98" text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>Administrador</text>
    <text x='0' y='114' text-anchor='middle' font-size='11' font-weight='bold' fill='#0f172a' paint-order='stroke fill' stroke='#ffffff' stroke-width='4px'>(SuperAdmin)</text>
  </g>
  <line x1="150" y1="195" x2="150" y2="825" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="146,823 150,833 154,823" fill="#000000" />

  <!-- Participante: IU_PlanesSaaS -->
  <g filter="url(#shadow)">
    <rect x="385" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="450" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;boundary&#187;</text>
    <text x="450" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IU_PlanesSaaS</text>
  </g>
  <line x1="450" y1="191" x2="450" y2="825" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="446,823 450,833 454,823" fill="#000000" />

  <!-- Participante: PlanSaaSControl -->
  <g filter="url(#shadow)">
    <rect x="725" y="135" width="150" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="800" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;control&#187;</text>
    <text x="800" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">PlanSaaSControl</text>
  </g>
  <line x1="800" y1="191" x2="800" y2="825" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="796,823 800,833 804,823" fill="#000000" />

  <!-- Participante: :t_plan -->
  <g filter="url(#shadow)">
    <rect x="1140" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1200" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1200" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_plan</text>
  </g>
  <line x1="1200" y1="191" x2="1200" y2="825" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1196,823 1200,833 1204,823" fill="#000000" />

  <!-- Participante: :t_bitacora -->
  <g filter="url(#shadow)">
    <rect x="1490" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1550" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1550" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_bitacora</text>
  </g>
  <line x1="1550" y1="191" x2="1550" y2="825" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1546,823 1550,833 1554,823" fill="#000000" />
  <rect x="444" y="222" width="12" height="570" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="794" y="254" width="12" height="515" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1194" y="318" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1194" y="510" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1544" y="576" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <line x1="150" y1="228" x2="444" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="297.0" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">1: solicitar_actualizacion_plan(codigo_plan, nombre, activo)</text>
  <line x1="456" y1="260" x2="794" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="625.0" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">2: actualizar_plan(codigo_plan, datos)</text>
  <path d="M 806 276 L 832 276 L 832 296 L 806 296" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sync)" />
  <text x="838" y="290.0" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4px">3: verificar_permiso_superadmin(payload)</text>
  <line x1="806" y1="322" x2="1194" y2="322" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1000.0" y="314" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">4: SELECT codigo, max_sucursales, activo FROM t_plan WHERE codigo = :codigo</text>
  <line x1="1194" y1="352" x2="806" y2="352" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1000.0" y="344" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">5: return plan_db</text>
  <!-- Fragmento alt -->
  <rect x="35" y="375" width="1650" height="410" fill="none" stroke="#334155" stroke-width="1.3" />
  <path d="M 35 375 L 115 375 L 127 388 L 127 399 L 35 399 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3" />
  <text x="45" y="392" font-size="11" font-weight="bold" fill="#1e293b">alt</text>
  <text x="137" y="392" font-size="11" font-weight="bold" fill="#b91c1c">[plan_db == null] (Curso Alterno: Plan No Encontrado)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="475" x2="1685" y2="475" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="467" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="493" font-size="11" font-weight="bold" fill="#15803d">[else: plan_db != null] (Curso Basico: Actualizacion de Parametros del Plan)</text>
  <line x1="794" y1="415" x2="456" y2="415" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="625.0" y="407" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6.1: (Error, "Plan de suscripcion no encontrado")</text>
  <line x1="444" y1="445" x2="150" y2="445" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="297.0" y="437" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6.2: Mostrar error: "Plan de suscripcion inexistente en la plataforma"</text>
  <line x1="806" y1="515" x2="1194" y2="515" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1000.0" y="507" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7: UPDATE t_plan SET nombre = :nombre, activo = :activo WHERE codigo = :codigo RETURNING codigo</text>
  <line x1="1194" y1="545" x2="806" y2="545" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1000.0" y="537" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">8: return plan_actualizado</text>
  <line x1="806" y1="580" x2="1544" y2="580" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1175.0" y="572" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">9: INSERT INTO t_bitacora(id_usuario, modulo='SAAS', accion='ACTUALIZAR_PLAN', entidad='t_plan', ...)</text>
  <line x1="1544" y1="610" x2="806" y2="610" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1175.0" y="602" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10: return confirmacion_log</text>
  <line x1="794" y1="665" x2="456" y2="665" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="625.0" y="657" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11: confirmar_actualizacion(plan_actualizado)</text>
  <line x1="444" y1="700" x2="150" y2="700" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="297.0" y="692" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">12: actualizar_planes()</text>
</svg>