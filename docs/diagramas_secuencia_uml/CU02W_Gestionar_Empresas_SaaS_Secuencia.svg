    <text x="990" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="990" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:empresa</text>
  </g>
  <line x1="990" y1="191" x2="990" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="986,903 990,913 994,903" fill="#000000" />

  <!-- Participante: :t_plan -->
  <g filter="url(#shadow)">
    <rect x="1200" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1260" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1260" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_plan</text>
  </g>
  <line x1="1260" y1="191" x2="1260" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1256,903 1260,913 1264,903" fill="#000000" />

  <!-- Participante: :t_suscripcion -->
  <g filter="url(#shadow)">
    <rect x="1445" y="135" width="130" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1510" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1510" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_suscripcion</text>
  </g>
  <line x1="1510" y1="191" x2="1510" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1506,903 1510,913 1514,903" fill="#000000" />

  <!-- Participante: :t_bitacora -->
  <g filter="url(#shadow)">
    <rect x="1670" y="135" width="120" height="56" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1730" y="157" text-anchor="middle" font-size="11" fill="#475569">&#171;entity&#187;</text>
    <text x="1730" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">:t_bitacora</text>
  </g>
  <line x1="1730" y1="191" x2="1730" y2="905" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />
  <polygon points="1726,903 1730,913 1734,903" fill="#000000" />
  <rect x="374" y="222" width="12" height="650" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="674" y="254" width="12" height="595" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="984" y="318" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="984" y="508" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1254" y="572" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1504" y="638" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <rect x="1724" y="702" width="12" height="38" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
  <line x1="130" y1="228" x2="374" y2="228" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="252.0" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">1: solicitar_registro_tenant(datos_empresa)</text>
  <line x1="386" y1="260" x2="674" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="530.0" y="252" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">2: registrar_tenant(datos_empresa)</text>
  <path d="M 686 276 L 712 276 L 712 296 L 686 296" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow-sync)" />
  <text x="718" y="290.0" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4px">3: validar_datos_fiscales(datos)</text>
  <line x1="686" y1="322" x2="984" y2="322" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="835.0" y="314" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">4: SELECT 1 FROM empresa WHERE LOWER(nit) = LOWER(:nit)</text>
  <line x1="984" y1="352" x2="686" y2="352" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="835.0" y="344" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">5: return nit_existente</text>
  <!-- Fragmento alt -->
  <rect x="35" y="375" width="1790" height="480" fill="none" stroke="#334155" stroke-width="1.3" />
  <path d="M 35 375 L 115 375 L 127 388 L 127 399 L 35 399 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3" />
  <text x="45" y="392" font-size="11" font-weight="bold" fill="#1e293b">alt</text>
  <text x="137" y="392" font-size="11" font-weight="bold" fill="#b91c1c">[nit_existente == true] (Curso Alterno: Rechazo por NIT Duplicado)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="475" x2="1825" y2="475" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="467" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="493" font-size="11" font-weight="bold" fill="#15803d">[else: nit_valido &amp;&amp; no_duplicado] (Curso Basico: Creacion de Tenant y Plan Inicial)</text>
  <line x1="674" y1="415" x2="386" y2="415" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="530.0" y="407" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6.1: (Error, "NIT fiscal ya registrado")</text>
  <line x1="374" y1="445" x2="130" y2="445" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="252.0" y="437" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">6.2: Mostrar error: "Empresa ya registrada con ese NIT"</text>
  <line x1="686" y1="512" x2="984" y2="512" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="835.0" y="504" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7: INSERT INTO empresa(nombre_empresa, razon_social, nit, correo, estado='ACTIVO')</text>
  <line x1="984" y1="542" x2="686" y2="542" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="835.0" y="534" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">8: return id_empresa</text>
  <line x1="686" y1="576" x2="1254" y2="576" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="970.0" y="568" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">9: SELECT codigo, max_sucursales FROM t_plan WHERE codigo = 'BASICO' AND activo = true</text>
  <line x1="1254" y1="606" x2="686" y2="606" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="970.0" y="598" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10: return plan_base</text>
  <line x1="686" y1="642" x2="1504" y2="642" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1095.0" y="634" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11: INSERT INTO t_suscripcion(id_empresa, codigo_plan, estado='ACTIVA', inicio, fin, motivo)</text>
  <line x1="1504" y1="672" x2="686" y2="672" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1095.0" y="664" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">12: return id_suscripcion</text>
  <line x1="686" y1="706" x2="1724" y2="706" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1205.0" y="698" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">13: INSERT INTO t_bitacora(id_usuario, id_empresa, modulo='EMPRESAS', accion='REGISTRAR_TENANT', ...)</text>
  <line x1="1724" y1="736" x2="686" y2="736" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1205.0" y="728" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">14: return confirmacion_log</text>
  <line x1="674" y1="790" x2="386" y2="790" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="530.0" y="782" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">15: confirmar_registro(id_empresa)</text>
  <line x1="374" y1="825" x2="130" y2="825" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="252.0" y="817" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">16: actualizar_empresas()</text>
</svg>