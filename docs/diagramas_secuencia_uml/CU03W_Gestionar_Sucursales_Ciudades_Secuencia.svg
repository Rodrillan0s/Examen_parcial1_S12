  <line x1="364" y1="565" x2="130" y2="565" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
  <text x="247.0" y="557" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">10.2: Mostrar error: "Limite de sucursales alcanzado (actualice su plan)"</text>
  <!-- Fragmento opt -->
  <rect x="470" y="620" width="1210" height="75" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,3" />
