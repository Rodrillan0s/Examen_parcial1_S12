  <text x="137" y="512" font-size="11" font-weight="bold" fill="#b91c1c">[conteo_sucursales_activas &gt;= max_sucursales] (Curso Alterno: Limite de Plan Excedido)</text>

  <!-- Divisor alt else -->
  <line x1="35" y1="595" x2="1945" y2="595" stroke="#334155" stroke-width="1.3" stroke-dasharray="7,4" />
  <text x="47" y="587" font-size="10" font-weight="bold" fill="#475569">[else]</text>
  <text x="90" y="613" font-size="11" font-weight="bold" fill="#15803d">[else: conteo_sucursales_activas &lt; max_sucursales] (Curso Basico: Registro Permitido)</text>
  <line x1="634" y1="535" x2="376" y2="535" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-error)" />
