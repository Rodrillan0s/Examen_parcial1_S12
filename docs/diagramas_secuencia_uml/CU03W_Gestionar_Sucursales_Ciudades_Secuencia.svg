  <line x1="1164" y1="412" x2="646" y2="412" stroke="#000000" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="905.0" y="404" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">7: return max_sucursales</text>
  <line x1="646" y1="442" x2="1414" y2="442" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
