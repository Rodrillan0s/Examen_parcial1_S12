  <text x="536" y="636" font-size="10.5" font-weight="600" fill="#334155">[si ciudad no registrada previamente]</text>
  <line x1="646" y1="656" x2="1654" y2="656" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-sync)" />
  <text x="1150.0" y="648" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a" paint-order="stroke fill" stroke="#ffffff" stroke-width="4.5px" stroke-linecap="round" stroke-linejoin="round">11: INSERT INTO t_ciudad(nombre, codigo_pais) RETURNING id_ciudad</text>
