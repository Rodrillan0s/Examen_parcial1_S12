    <text x="390" y="303.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ReservaInvalida</text>
  </g>
  <!-- Estado: PrendaListaParaEntrega -->
  <g id="s2_ok">
