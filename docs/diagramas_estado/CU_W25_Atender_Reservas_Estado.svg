  <circle cx="390" cy="630" r="8.5" fill="#222222"/>

  <line x1="180" y1="318" x2="370" y2="620" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="390" y1="318" x2="390" y2="616" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="590" y1="558" x2="410" y2="620" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
