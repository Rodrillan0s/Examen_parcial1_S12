  <line x1="620" y1="318" x2="620" y2="410" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="630" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">confirmar_entrega_al_cliente()</text>
