  </g>
  <line x1="330" y1="193" x2="200" y2="280" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="120" y="235" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222" text-anchor="start">[Vencida &gt; 48h] / liberar_stock()</text>
  <line x1="390" y1="193" x2="390" y2="280" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="400" y="240.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">[Ya entregada]</text>
