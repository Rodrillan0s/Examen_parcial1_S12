    <text x="160" y="303.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ReservaCaducada48h</text>
  </g>
  <!-- Estado: ReservaInvalida -->
  <g id="s2_inval">
