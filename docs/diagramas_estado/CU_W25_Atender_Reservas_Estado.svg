<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" width="780" height="700">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#222222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="700" fill="#ffffff"/>
  <text x="390.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#000000" text-anchor="middle">CU_W25: Atender reservas en sucursal</text>

  <!-- Estado Inicial -->
  <circle cx="390" cy="95" r="11" fill="#222222"/>

  <line x1="390" y1="106" x2="390" y2="155" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="400" y="134.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">escanear_o_buscar_codigo_reserva()</text>
  <!-- Estado: ConsultandoEstadoReserva -->
  <g id="s1">
    <rect x="277.5" y="155" width="225" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="390" y="178.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ConsultandoEstadoReserva</text>
  </g>
