  <text x="360" y="668.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">mostrar_confirmacion()</text>
  <!-- Estado Final -->
  <circle cx="350" cy="705" r="14" fill="none" stroke="#222222" stroke-width="1.4"/>
