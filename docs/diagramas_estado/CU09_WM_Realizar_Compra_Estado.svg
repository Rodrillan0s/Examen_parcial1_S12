  <line x1="350" y1="458" x2="350" y2="510" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="360" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">registrar_bitacora("COMPRA")</text>
