  <line x1="350" y1="101" x2="350" y2="150" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="360" y="129.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">iniciar_checkout()</text>
  <!-- Estado: ConfigurandoEntrega -->
  <g id="s1">
    <rect x="252.5" y="150" width="195" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="350" y="173.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ConfigurandoEntrega</text>
  </g>
  <line x1="350" y1="188" x2="350" y2="240" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="360" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">seleccionar_metodo_pago()</text>
  <!-- Estado: MetodoPagoConfigurado -->
  <g id="s2">
