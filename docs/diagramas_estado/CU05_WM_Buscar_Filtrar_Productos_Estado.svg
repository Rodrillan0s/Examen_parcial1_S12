<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 720" width="740" height="720">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#222222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="740" height="720" fill="#ffffff"/>
  <text x="370.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#000000" text-anchor="middle">CU05 W/M: Buscar y filtrar productos</text>

  <!-- Estado Inicial -->
  <circle cx="370" cy="95" r="11" fill="#222222"/>

  <line x1="370" y1="106" x2="370" y2="160" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="380" y="137.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">abrir_catalogo()</text>
  <!-- Estado: CatalogoAbierto -->
  <g id="s1">
    <rect x="280.0" y="160" width="180" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="370" y="183.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">CatalogoAbierto</text>
  </g>
  <line x1="370" y1="198" x2="370" y2="255" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="380" y="230.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">seleccionar_filtros(categoria, precio)</text>
  <!-- Estado: FiltrandoProductos -->
  <g id="s2">
    <rect x="280.0" y="255" width="180" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="370" y="278.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">FiltrandoProductos</text>
  </g>
  <line x1="370" y1="293" x2="370" y2="350" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="380" y="325.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">listar_catalogo_publico(filtros)</text>
  <!-- Estado: ProcesandoConsulta -->
  <g id="s3">
    <rect x="272.5" y="350" width="195" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="370" y="373.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ProcesandoConsulta</text>
  </g>
  <!-- Estado: SinCoincidencias -->
  <g id="s4_err">
    <rect x="112.5" y="475" width="175" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="200" y="498.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">SinCoincidencias</text>
  </g>
  <!-- Estado: ProductosMostrados -->
  <g id="s4_ok">
    <rect x="447.5" y="475" width="185" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="540" y="498.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ProductosMostrados</text>
  </g>
  <path d="M 320 388 Q 230 420 200 475" fill="none" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="115" y="435" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">[Sin coincidencias]</text>
  <line x1="405" y1="388" x2="510" y2="475" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="480" y="425" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222" text-anchor="start">[Productos encontrados] / renderizar_grid()</text>
  <!-- Estado Final -->
  <circle cx="370" cy="630" r="14" fill="none" stroke="#222222" stroke-width="1.4"/>
  <circle cx="370" cy="630" r="8.5" fill="#222222"/>

  <line x1="225" y1="513" x2="356" y2="622" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="515" y1="513" x2="384" y2="622" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
</svg>
