<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#222222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="700" fill="#ffffff"/>
  <text x="380.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#000000" text-anchor="middle">CU10 W/M: Gestionar reservas</text>

  <!-- Estado Inicial -->
  <circle cx="380" cy="95" r="11" fill="#222222"/>

  <line x1="380" y1="106" x2="380" y2="155" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="390" y="134.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">solicitar_reserva(id_var, id_suc)</text>
  <!-- Estado: VerificandoStockSucursal -->
  <g id="s1">
    <rect x="275.0" y="155" width="210" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="380" y="178.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">VerificandoStockSucursal</text>
  </g>
  <!-- Estado: ReservaRechazada -->
  <g id="s2_err">
    <rect x="102.5" y="265" width="175" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="190" y="288.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ReservaRechazada</text>
  </g>
  <!-- Estado: ApartandoStockSucursal -->
  <g id="s2_ok">
    <rect x="432.5" y="265" width="195" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="530" y="288.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ApartandoStockSucursal</text>
  </g>
  <line x1="330" y1="193" x2="220" y2="265" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="120" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222" text-anchor="start">[Sin stock disponible]</text>
  <line x1="430" y1="193" x2="500" y2="265" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="440" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222" text-anchor="start">[Stock disponible]</text>
  <line x1="530" y1="303" x2="530" y2="365" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="540" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">registrar_bitacora("RESERVA")</text>
  <!-- Estado: BitacoraReservaAsentada -->
  <g id="s3">
    <rect x="427.5" y="365" width="205" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="530" y="388.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">BitacoraReservaAsentada</text>
  </g>
  <line x1="530" y1="403" x2="530" y2="470" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="540" y="440.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#222222">generar_codigo_qr_48h()</text>
  <!-- Estado: ReservaActivaVencimiento48h -->
  <g id="s4">
    <rect x="417.5" y="470" width="225" height="38" rx="9" ry="9" fill="#f4f4f4" stroke="#777777" stroke-width="0.9"/>
    <text x="530" y="493.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111" text-anchor="middle">ReservaActivaVencimiento48h</text>
  </g>
  <!-- Estado Final -->
  <circle cx="380" cy="610" r="14" fill="none" stroke="#222222" stroke-width="1.4"/>
  <circle cx="380" cy="610" r="8.5" fill="#222222"/>

  <line x1="190" y1="303" x2="362" y2="600" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="490" y1="508" x2="398" y2="600" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
