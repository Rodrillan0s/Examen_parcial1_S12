<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU26/M15 W/M: Mostrar ubicaciones de sucursales — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Unificación Web (CU/W26) y Móvil (CU/M15) | Form (Boundary) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Cliente (Web y Móvil)</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Mapa_Sucursales -->
  <g id="class_form">
    <rect x="35" y="290" width="235" height="184" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="338" x2="270" y2="338" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="398.0" x2="270" y2="398.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Mapa_Sucursales</text>
    <text x="45" y="354" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_ciudad_filtro</text>
    <text x="45" y="370" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ coords_origen</text>
    <text x="45" y="386" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ sucursal_seleccionada</text>
    <text x="45" y="414.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ cargar_mapa_interactivo()</text>
    <text x="45" y="430.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ filtrar_por_departamento()</text>
    <text x="45" y="446.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ver_horarios_contacto()</text>
    <text x="45" y="462.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ trazar_ruta_como_llegar()</text>
  </g>
  <!-- Clase: Sucursales_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="340" width="235" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="374" x2="545" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="396" x2="545" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Sucursales_Controller</text>
    <text x="320" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_sucursales_activas()</text>
    <text x="320" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_sucursales_por_ciudad(id)</text>
    <text x="320" y="444" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_info_tienda(id_suc)</text>
  </g>
  <!-- Clase: Sucursales_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Sucursales_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ listar_tiendas_geolocalizadas()</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ calcular_distancia_tiendas(lat, lng)</text>
    <text x="595" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ consolidar_horarios_contacto()</text>
  </g>
  <!-- Clase: Sucursales_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="100" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Sucursales_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_sucursales_with_ciudad()</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_ciudades_con_tiendas()</text>
  </g>
  <!-- Clase: T_SUCURSAL -->
  <g id="class_sucursal">
    <rect x="1175" y="300" width="205" height="228" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="334" x2="1380" y2="334" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="506.0" x2="1380" y2="506.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1277.5" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_SUCURSAL</text>
    <text x="1185" y="350" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1185" y="366" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPRESA</text>
    <text x="1185" y="382" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CIUDAD</text>
    <text x="1185" y="398" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1185" y="414" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DIRECCION</text>
    <text x="1185" y="430" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TELEFONO</text>
    <text x="1185" y="446" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ LATITUD</text>
    <text x="1185" y="462" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ LONGITUD</text>
    <text x="1185" y="478" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ HORARIO_APERTURA</text>
    <text x="1185" y="494" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_CIUDAD -->
  <g id="class_ciudad">
    <rect x="1445" y="310" width="180" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1445" y1="344" x2="1625" y2="344" stroke="#111827" stroke-width="1.4"/>
    <line x1="1445" y1="420.0" x2="1625" y2="420.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1535.0" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_CIUDAD</text>
    <text x="1455" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CIUDAD</text>
    <text x="1455" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1455" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DEPARTAMENTO</text>
    <text x="1455" y="408" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_EMPRESA -->
  <g id="class_empresa">
    <rect x="1675" y="310" width="170" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="344" x2="1845" y2="344" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="420.0" x2="1845" y2="420.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1760.0" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_EMPRESA</text>
    <text x="1685" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPRESA</text>
    <text x="1685" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE_EMPRESA</text>
    <text x="1685" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NIT</text>
    <text x="1685" y="408" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1380,410 1445,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1390" y="400" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1425" y="400" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1625,410 1675,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1632" y="400" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1655" y="400" font-size="11" font-weight="bold" fill="#111827">1</text>
  </g>
</svg>
