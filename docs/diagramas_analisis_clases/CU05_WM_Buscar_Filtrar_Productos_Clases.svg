<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU05 W/M: Buscar y filtrar productos — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Unificación Web (CU/W05) y Móvil (CU/M05) | Arquitectura: Form (Boundary) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Cliente (Web y Móvil), Administrador, Administrador de tienda, Encargado de sucursal, Cajero</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Buscar_Filtrar_Productos -->
  <g id="class_form">
    <rect x="35" y="270" width="235" height="296" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="318" x2="270" y2="318" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="458.0" x2="270" y2="458.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Buscar_Filtrar_Productos</text>
    <text x="45" y="334" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ texto_busqueda</text>
    <text x="45" y="350" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_categoria_sel</text>
    <text x="45" y="366" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ genero_sel</text>
    <text x="45" y="382" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ rango_precio_min</text>
    <text x="45" y="398" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ rango_precio_max</text>
    <text x="45" y="414" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_talla_sel</text>
    <text x="45" y="430" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_color_sel</text>
    <text x="45" y="446" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_sucursal_sel</text>
    <text x="45" y="474.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ingresar_termino()</text>
    <text x="45" y="490.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ seleccionar_categoria()</text>
    <text x="45" y="506.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ filtrar_por_precio()</text>
    <text x="45" y="522.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ filtrar_por_talla_color()</text>
    <text x="45" y="538.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ filtrar_por_sucursal()</text>
    <text x="45" y="554.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ mostrar_grilla_catalogo()</text>
  </g>
  <!-- Clase: Catalogo_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="340" width="235" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="374" x2="545" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="396" x2="545" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Catalogo_Controller</text>
    <text x="320" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_catalogo_filtrado(filtros)</text>
    <text x="320" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_detalle_producto(id)</text>
    <text x="320" y="444" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_stock_sucursales(id_var)</text>
  </g>
  <!-- Clase: Catalogo_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Catalogo_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ listar_catalogo_filtrado(filtros)</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ validar_filtros_busqueda(filtros)</text>
    <text x="595" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ obtener_variantes_con_stock(id)</text>
    <text x="595" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ verificar_stock_sucursal(id_suc)</text>
  </g>
  <!-- Clase: Catalogo_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Catalogo_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ query_productos_filtrados(criterios)</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_variantes_by_producto(id_prod)</text>
    <text x="890" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_stock_por_sucursal(id_var, id_suc)</text>
    <text x="890" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_categorias_activas()</text>
  </g>
  <!-- Clase: T_PRODUCTO -->
  <g id="class_producto">
    <rect x="1175" y="290" width="195" height="212" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="324" x2="1370" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="480.0" x2="1370" y2="480.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1272.5" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_PRODUCTO</text>
    <text x="1185" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1185" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CATEGORIA</text>
    <text x="1185" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPRESA</text>
    <text x="1185" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1185" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DESCRIPCION</text>
    <text x="1185" y="420" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ GENERO</text>
    <text x="1185" y="436" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ PRECIO_BASE</text>
    <text x="1185" y="452" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ IMAGEN_URL</text>
    <text x="1185" y="468" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_CATEGORIA -->
  <g id="class_categoria">
    <rect x="1175" y="80" width="195" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="114" x2="1370" y2="114" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="190.0" x2="1370" y2="190.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1272.5" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_CATEGORIA</text>
    <text x="1185" y="130" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CATEGORIA</text>
    <text x="1185" y="146" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1185" y="162" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DESCRIPCION</text>
    <text x="1185" y="178" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_PRODUCTO_VARIANTE -->
  <g id="class_variante">
    <rect x="1415" y="305" width="210" height="180" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1415" y1="339" x2="1625" y2="339" stroke="#111827" stroke-width="1.4"/>
    <line x1="1415" y1="463.0" x2="1625" y2="463.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1520.0" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_PRODUCTO_VARIANTE</text>
    <text x="1425" y="355" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1425" y="371" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1425" y="387" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_TALLA</text>
    <text x="1425" y="403" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_COLOR</text>
    <text x="1425" y="419" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ PRECIO_ADICIONAL</text>
    <text x="1425" y="435" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ SKU_VARIANTE</text>
    <text x="1425" y="451" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_TALLA -->
  <g id="class_talla">
    <rect x="1675" y="110" width="160" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="144" x2="1835" y2="144" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="204.0" x2="1835" y2="204.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1755.0" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_TALLA</text>
    <text x="1685" y="160" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_TALLA</text>
    <text x="1685" y="176" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1685" y="192" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_COLOR -->
  <g id="class_color">
    <rect x="1675" y="280" width="160" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="314" x2="1835" y2="314" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="374.0" x2="1835" y2="374.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1755.0" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_COLOR</text>
    <text x="1685" y="330" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_COLOR</text>
    <text x="1685" y="346" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1685" y="362" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_HEX</text>
  </g>
  <!-- Clase: T_INVENTARIO -->
  <g id="class_inventario">
    <rect x="1415" y="570" width="210" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1415" y1="604" x2="1625" y2="604" stroke="#111827" stroke-width="1.4"/>
    <line x1="1415" y1="712.0" x2="1625" y2="712.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1520.0" y="592" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_INVENTARIO</text>
    <text x="1425" y="620" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_INVENTARIO</text>
    <text x="1425" y="636" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1425" y="652" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1425" y="668" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_ACTUAL</text>
    <text x="1425" y="684" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_RESERVADO</text>
    <text x="1425" y="700" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_DISPONIBLE</text>
  </g>
  <!-- Clase: T_SUCURSAL -->
  <g id="class_sucursal">
    <rect x="1675" y="570" width="165" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="604" x2="1840" y2="604" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="712.0" x2="1840" y2="712.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1757.5" y="592" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_SUCURSAL</text>
    <text x="1685" y="620" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1685" y="636" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPRESA</text>
    <text x="1685" y="652" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CIUDAD</text>
    <text x="1685" y="668" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1685" y="684" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DIRECCION</text>
    <text x="1685" y="700" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1272,290 1272,220" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1280" y="275" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1280" y="235" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1370,400 1415,400" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1376" y="390" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1390" y="390" font-size="11" font-weight="bold" fill="#111827">1..*</text>
    <polyline points="1625,345 1650,345 1650,170 1675,170" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1628" y="335" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1655" y="160" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1625,385 1650,385 1650,340 1675,340" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1628" y="375" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1655" y="330" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1520,498 1520,570" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1530" y="518" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1530" y="555" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1625,655 1675,655" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1632" y="645" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1658" y="645" font-size="11" font-weight="bold" fill="#111827">1</text>
  </g>
</svg>
