<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU08 W/M: Gestionar carrito de compras — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Unificación Web (CU/W08) y Móvil (CU/M08) | Form (Boundary) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Cliente (Web y Móvil)</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Carrito_Compras -->
  <g id="class_form">
    <rect x="35" y="280" width="235" height="216" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="328" x2="270" y2="328" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="404.0" x2="270" y2="404.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Carrito_Compras</text>
    <text x="45" y="344" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_carrito</text>
    <text x="45" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_variante_agregar</text>
    <text x="45" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ cantidad_ajustar</text>
    <text x="45" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ codigo_cupon</text>
    <text x="45" y="420.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ agregar_item()</text>
    <text x="45" y="436.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ modificar_cantidad()</text>
    <text x="45" y="452.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ eliminar_item()</text>
    <text x="45" y="468.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ vaciar_carrito()</text>
    <text x="45" y="484.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ aplicar_descuento()</text>
  </g>
  <!-- Clase: Carrito_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="330" width="235" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="364" x2="545" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="386" x2="545" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Carrito_Controller</text>
    <text x="320" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ post_item_carrito(item)</text>
    <text x="320" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ put_cantidad_item(id, cant)</text>
    <text x="320" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ delete_item(id)</text>
    <text x="320" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_carrito(id_cli)</text>
  </g>
  <!-- Clase: Carrito_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Carrito_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ validar_stock_prenda(id, cant)</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ sincronizar_carrito_sesion(cli)</text>
    <text x="595" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ calcular_totales_carrito(cart)</text>
  </g>
  <!-- Clase: Carrito_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Carrito_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ save_or_update_carrito(cart)</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_detalle_carrito(id_cart)</text>
    <text x="890" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ update_item_cantidad(id, cant)</text>
    <text x="890" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ remove_item(id)</text>
  </g>
  <!-- Clase: T_CARRITO -->
  <g id="class_carrito">
    <rect x="1175" y="315" width="195" height="148" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="349" x2="1370" y2="349" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="441.0" x2="1370" y2="441.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1272.5" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_CARRITO</text>
    <text x="1185" y="365" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CARRITO</text>
    <text x="1185" y="381" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CLIENTE</text>
    <text x="1185" y="397" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ FECHA_CREACION</text>
    <text x="1185" y="413" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
    <text x="1185" y="429" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TOTAL_ESTIMADO</text>
  </g>
  <!-- Clase: T_DETALLE_CARRITO -->
  <g id="class_det_carrito">
    <rect x="1420" y="305" width="210" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1420" y1="339" x2="1630" y2="339" stroke="#111827" stroke-width="1.4"/>
    <line x1="1420" y1="447.0" x2="1630" y2="447.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1525.0" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_DETALLE_CARRITO</text>
    <text x="1430" y="355" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_DETALLE_CARRITO</text>
    <text x="1430" y="371" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CARRITO</text>
    <text x="1430" y="387" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1430" y="403" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ CANTIDAD</text>
    <text x="1430" y="419" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ PRECIO_UNITARIO</text>
    <text x="1430" y="435" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ SUBTOTAL</text>
  </g>
  <!-- Clase: T_PRODUCTO_VARIANTE -->
  <g id="class_variante">
    <rect x="1675" y="180" width="170" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="214" x2="1845" y2="214" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="290.0" x2="1845" y2="290.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1760.0" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_PRODUCTO_VARIANTE</text>
    <text x="1685" y="230" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1685" y="246" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1685" y="262" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ SKU_VARIANTE</text>
    <text x="1685" y="278" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ PRECIO_ADICIONAL</text>
  </g>
  <!-- Clase: T_INVENTARIO -->
  <g id="class_inventario">
    <rect x="1675" y="440" width="170" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="474" x2="1845" y2="474" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="550.0" x2="1845" y2="550.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1760.0" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_INVENTARIO</text>
    <text x="1685" y="490" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_INVENTARIO</text>
    <text x="1685" y="506" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1685" y="522" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1685" y="538" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_DISPONIBLE</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1370,400 1420,400" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1378" y="390" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1395" y="390" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1630,360 1655,360 1655,250 1675,250" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1632" y="350" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1655" y="240" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1630,420 1655,420 1655,500 1675,500" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1632" y="410" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1655" y="490" font-size="11" font-weight="bold" fill="#111827">1</text>
  </g>
</svg>
