<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 840" width="2100" height="840" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU/M14: Utilizar vestidor virtual (Probador RA) — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Sistema Aura Mobile | Probador Realidad Aumentada: Vestidor_Screen -&gt; AR_Camera_Controller -&gt; Pose_Detector -&gt; Vestidor_Service -&gt; Entities</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Cliente Móvil</text>
  <line x1="35" y1="82" x2="2065" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Arquitectura Específica -->
  <g transform="translate(1570, 24)">
    <rect x="0" y="0" width="495" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Arquitectura Visión Artificial &amp; Realidad Aumentada:</text>
    <text x="12" y="36" font-size="10" fill="#64748b">AR_Screen -&gt; AR_Controller -&gt; Pose_Body_Detector -&gt; Vestidor_Service -&gt; Entities (RA)</text>
  </g>
  <!-- Clase: Screen / Vestidor_Virtual_Screen -->
  <g id="class_screen_vestidor">
    <rect x="35" y="270" width="260" height="216" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="318" x2="295" y2="318" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="410.0" x2="295" y2="410.0" stroke="#111827" stroke-width="1.4"/>
    <text x="165.0" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">Screen</text>
    <text x="165.0" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Vestidor_Virtual_Screen</text>
    <text x="45" y="334" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ camera_preview_widget</text>
    <text x="45" y="350" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ prenda_activa_ra</text>
    <text x="45" y="366" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ escala_modelo_textil</text>
    <text x="45" y="382" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ selector_talla_color</text>
    <text x="45" y="398" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ status_deteccion_cuerpo</text>
    <text x="45" y="426.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ alternar_camara_frontal()</text>
    <text x="45" y="442.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ seleccionar_prenda_vestidor()</text>
    <text x="45" y="458.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ capturar_foto_con_prenda()</text>
    <text x="45" y="474.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ comprar_prenda_directa()</text>
  </g>
  <!-- Clase: AR_Camera_Controller -->
  <g id="class_ctrl_ar_camera">
    <rect x="335" y="330" width="250" height="138" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="335" y1="364" x2="585" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="335" y1="408.0" x2="585" y2="408.0" stroke="#111827" stroke-width="1.4"/>
    <text x="460.0" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">AR_Camera_Controller</text>
    <text x="345" y="380" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- camera_controller</text>
    <text x="345" y="396" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- is_detecting_pose</text>
    <text x="345" y="424.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ inicializar_feed_camara()</text>
    <text x="345" y="440.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ procesar_frame_camara(frame)</text>
    <text x="345" y="456.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ajustar_anclaje_hombros()</text>
  </g>
  <!-- Clase: Pose_Body_Detector -->
  <g id="class_srv_pose_detector">
    <rect x="625" y="315" width="265" height="138" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="625" y1="349" x2="890" y2="349" stroke="#111827" stroke-width="1.4"/>
    <line x1="625" y1="393.0" x2="890" y2="393.0" stroke="#111827" stroke-width="1.4"/>
    <text x="757.5" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Pose_Body_Detector</text>
    <text x="635" y="365" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- mediapipe_pose_engine</text>
    <text x="635" y="381" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- confidence_threshold</text>
    <text x="635" y="409.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ detectar_puntos_clave_torso()</text>
    <text x="635" y="425.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ calcular_dimensiones_pecho_cadera()</text>
    <text x="635" y="441.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ sincronizar_movimiento_prenda()</text>
  </g>
  <!-- Clase: Vestidor_Service -->
  <g id="class_srv_vestidor">
    <rect x="930" y="335" width="265" height="138" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="930" y1="369" x2="1195" y2="369" stroke="#111827" stroke-width="1.4"/>
    <line x1="930" y1="413.0" x2="1195" y2="413.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1062.5" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Vestidor_Service</text>
    <text x="940" y="385" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- catalogo_repository</text>
    <text x="940" y="401" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- cache_texturas_transparentes</text>
    <text x="940" y="429.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ get_prendas_compatibles_ra()</text>
    <text x="940" y="445.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ descargar_textura_2d_3d(id)</text>
    <text x="940" y="461.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ registrar_sesion_vestidor()</text>
  </g>
  <!-- Clase: T_VESTIDOR_VIRTUAL -->
  <g id="class_vestidor_virtual">
    <rect x="1245" y="100" width="205" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1245" y1="134" x2="1450" y2="134" stroke="#111827" stroke-width="1.4"/>
    <line x1="1245" y1="210.0" x2="1450" y2="210.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1347.5" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_VESTIDOR_VIRTUAL</text>
    <text x="1255" y="150" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_VESTIDOR_VIRTUAL</text>
    <text x="1255" y="166" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_CLIENTE</text>
    <text x="1255" y="182" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRENDA_RA</text>
    <text x="1255" y="198" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_USO</text>
  </g>
  <!-- Clase: T_PRENDA_RA -->
  <g id="class_prenda_ra">
    <rect x="1245" y="480" width="205" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1245" y1="514" x2="1450" y2="514" stroke="#111827" stroke-width="1.4"/>
    <line x1="1245" y1="622.0" x2="1450" y2="622.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1347.5" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PRENDA_RA</text>
    <text x="1255" y="530" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRENDA_RA</text>
    <text x="1255" y="546" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1255" y="562" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1255" y="578" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MODELO_3D_URL</text>
    <text x="1255" y="594" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MODELO_2D_URL</text>
    <text x="1255" y="610" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_PRODUCTO -->
  <g id="class_producto">
    <rect x="1500" y="240" width="210" height="244" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1500" y1="274" x2="1710" y2="274" stroke="#111827" stroke-width="1.4"/>
    <line x1="1500" y1="462.0" x2="1710" y2="462.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1605.0" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PRODUCTO</text>
    <text x="1510" y="290" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1510" y="306" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_CATEGORIA</text>
    <text x="1510" y="322" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_PRODUCTO</text>
    <text x="1510" y="338" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1510" y="354" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ DESCRIPCION</text>
    <text x="1510" y="370" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MARCA</text>
    <text x="1510" y="386" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ GENERO</text>
    <text x="1510" y="402" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ PRECIO</text>
    <text x="1510" y="418" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ IMAGEN_URL</text>
    <text x="1510" y="434" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
    <text x="1510" y="450" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_REGISTRO</text>
  </g>
  <!-- Clase: T_PRODUCTO_TALLA_COLOR -->
  <g id="class_variante">
    <rect x="1765" y="250" width="225" height="212" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1765" y1="284" x2="1990" y2="284" stroke="#111827" stroke-width="1.4"/>
    <line x1="1765" y1="440.0" x2="1990" y2="440.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1877.5" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PRODUCTO_TALLA_COLOR</text>
    <text x="1775" y="300" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1775" y="316" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1775" y="332" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_TALLA</text>
    <text x="1775" y="348" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_COLOR</text>
    <text x="1775" y="364" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ SKU</text>
    <text x="1775" y="380" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_BARRAS</text>
    <text x="1775" y="396" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ PRECIO</text>
    <text x="1775" y="412" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MODELO_3D_URL</text>
    <text x="1775" y="428" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="295,410 335,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="585,410 625,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="890,410 930,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1195,390 1220,390 1220,200 1245,200" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1195,430 1220,430 1220,580 1245,580" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1345,480 1345,230" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1355" y="465" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1355" y="245" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1500,380 1470,380 1470,580 1450,580" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1480" y="370" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1455" y="570" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1710,370 1765,370" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1715" y="360" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1740" y="360" font-size="11" font-weight="bold" fill="#111827">1..*</text>
  </g>
</svg>
