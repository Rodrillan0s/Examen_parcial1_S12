<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU/W25: Atender reservas — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Módulo Web | Form (Boundary) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Encargado de sucursal, Cajero</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Atender_Reservas -->
  <g id="class_form">
    <rect x="35" y="280" width="235" height="216" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="328" x2="270" y2="328" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="404.0" x2="270" y2="404.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Atender_Reservas</text>
    <text x="45" y="344" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ codigo_reserva_ingresado</text>
    <text x="45" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ scan_qr</text>
    <text x="45" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ estado_reserva_encontrada</text>
    <text x="45" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ prendas_reservadas</text>
    <text x="45" y="420.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ buscar_reserva_por_codigo()</text>
    <text x="45" y="436.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ escanear_codigo_qr()</text>
    <text x="45" y="452.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ verificar_vigencia_apartado()</text>
    <text x="45" y="468.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ convertir_reserva_a_venta()</text>
    <text x="45" y="484.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ liberar_reserva_vencida()</text>
  </g>
  <!-- Clase: Atencion_Reservas_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="340" width="235" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="374" x2="545" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="396" x2="545" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Atencion_Reservas_Controller</text>
    <text x="320" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_buscar_reserva(cod)</text>
    <text x="320" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ post_despachar_reserva_pos(id)</text>
    <text x="320" y="444" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ put_liberar_reserva(id)</text>
  </g>
  <!-- Clase: Atencion_Reservas_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Atencion_Reservas_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ validar_estado_reserva()</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ transformar_reserva_en_venta()</text>
    <text x="595" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ liberar_stock_reservado_a_disponible()</text>
  </g>
  <!-- Clase: Atencion_Reservas_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Atencion_Reservas_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_reserva_by_codigo(cod)</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ update_estado_reserva(id, est)</text>
    <text x="890" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ create_venta_from_reserva(id)</text>
    <text x="890" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ update_stock_liberar(var, cant)</text>
  </g>
  <!-- Clase: T_RESERVA -->
  <g id="class_reserva">
    <rect x="1175" y="290" width="200" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="324" x2="1375" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="432.0" x2="1375" y2="432.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1275.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_RESERVA</text>
    <text x="1185" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_RESERVA</text>
    <text x="1185" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CLIENTE</text>
    <text x="1185" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1185" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_RESERVA_QR</text>
    <text x="1185" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
    <text x="1185" y="420" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ FECHA_EXPIRACION</text>
  </g>
  <!-- Clase: T_DETALLE_RESERVA -->
  <g id="class_det_reserva">
    <rect x="1425" y="290" width="200" height="148" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1425" y1="324" x2="1625" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1425" y1="416.0" x2="1625" y2="416.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1525.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_DETALLE_RESERVA</text>
    <text x="1435" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_DETALLE_RESERVA</text>
    <text x="1435" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_RESERVA</text>
    <text x="1435" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1435" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ CANTIDAD</text>
    <text x="1435" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ PRECIO_CONGELADO</text>
  </g>
  <!-- Clase: T_VENTA -->
  <g id="class_venta">
    <rect x="1175" y="570" width="200" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="604" x2="1375" y2="604" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="680.0" x2="1375" y2="680.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1275.0" y="592" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_VENTA</text>
    <text x="1185" y="620" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VENTA</text>
    <text x="1185" y="636" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1185" y="652" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TOTAL_VENTA</text>
    <text x="1185" y="668" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_INVENTARIO -->
  <g id="class_inventario">
    <rect x="1675" y="290" width="170" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="324" x2="1845" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="432.0" x2="1845" y2="432.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1760.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_INVENTARIO</text>
    <text x="1685" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_INVENTARIO</text>
    <text x="1685" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1685" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1685" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_ACTUAL</text>
    <text x="1685" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_RESERVADO</text>
    <text x="1685" y="420" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_DISPONIBLE</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1375,380 1425,380" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1382" y="370" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1405" y="370" font-size="11" font-weight="bold" fill="#111827">1..*</text>
    <polyline points="1625,380 1675,380" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1632" y="370" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1655" y="370" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1275,450 1275,570" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1285" y="475" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1285" y="555" font-size="11" font-weight="bold" fill="#111827">0..1</text>
  </g>
</svg>
