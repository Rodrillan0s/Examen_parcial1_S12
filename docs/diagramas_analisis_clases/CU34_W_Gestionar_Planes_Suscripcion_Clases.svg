<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU34 W: Gestionar planes de suscripción — Diagrama de Análisis de Clases (UML / ICONIX)</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Catálogo Inmutable de Planes SaaS | Estereotipos: Boundary (Form) ── Control ── Entity</text>
  <text x="35" y="72" font-size="11.5" font-weight="bold" fill="#1e293b">Actor(es): <tspan font-weight="normal" fill="#334155">Superadministrador de Plataforma</tspan></text>
  <line x1="35" y1="82" x2="1405" y2="82" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Leyenda de Estructura ICONIX -->
  <g transform="translate(1010, 24)">
    <rect x="0" y="0" width="395" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#1e293b">Estructura del Análisis de Clases (ICONIX):</text>
    <text x="12" y="36" font-size="10.5" fill="#475569">Boundary (Form) ── Control (Lógica) ── Entity (Persistencia)</text>
  </g>
  <!-- Clase: Form / Planes_SaaS -->
  <g id="class_form_planes">
    <rect x="50" y="350" width="270" height="216" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="50" y1="398" x2="320" y2="398" stroke="#000000" stroke-width="1.2"/>
    <line x1="50" y1="490.0" x2="320" y2="490.0" stroke="#000000" stroke-width="1.2"/>
    <text x="185.0" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155" font-family="Arial, Helvetica, sans-serif">Form</text>
    <text x="185.0" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Planes_SaaS</text>
    <text x="60" y="414" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ codigo_plan: string</text>
    <text x="60" y="430" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ nombre_plan: string</text>
    <text x="60" y="446" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ max_sucursales: int</text>
    <text x="60" y="462" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ reportes_generativos: boolean</text>
    <text x="60" y="478" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ activo: boolean</text>
    <text x="60" y="506.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ consultar_catalogo_planes()</text>
    <text x="60" y="522.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ editar_disponibilidad_plan()</text>
    <text x="60" y="538.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ guardar_cambios_plan()</text>
    <text x="60" y="554.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ mostrar_alerta_codigo_arbitrario()</text>
  </g>
  <!-- Clase: Control / Planes_SaaS -->
  <g id="class_ctrl_planes">
    <rect x="370" y="350" width="340" height="168" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="370" y1="398" x2="710" y2="398" stroke="#000000" stroke-width="1.2"/>
    <line x1="370" y1="426.0" x2="710" y2="426.0" stroke="#000000" stroke-width="1.2"/>
    <text x="540.0" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155" font-family="Arial, Helvetica, sans-serif">Control</text>
    <text x="540.0" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Planes_SaaS</text>
    <text x="380" y="414" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">- rbac_guard: PlatformScopeGuard</text>
    <text x="380" y="442.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ listar_planes_disponibles()</text>
    <text x="380" y="458.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ validar_alcance_plataforma(token)</text>
    <text x="380" y="474.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ validar_codigo_fijo_y_limites(cod, dto)</text>
    <text x="380" y="490.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ actualizar_estado_plan(cod, act, desc)</text>
    <text x="380" y="506.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ verificar_contratos_vigentes(cod)</text>
  </g>
  <!-- Clase: T_PLAN -->
  <g id="class_ent_plan">
    <rect x="770" y="350" width="270" height="186" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="770" y1="384" x2="1040" y2="384" stroke="#000000" stroke-width="1.2"/>
    <line x1="770" y1="476.0" x2="1040" y2="476.0" stroke="#000000" stroke-width="1.2"/>
    <text x="905.0" y="372.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_PLAN</text>
    <text x="780" y="400" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ CODIGO: string [PK] (BASICO/PROF)</text>
    <text x="780" y="416" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ NOMBRE: string</text>
    <text x="780" y="432" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ MAX_SUCURSALES: int (2 o 10)</text>
    <text x="780" y="448" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ REPORTES_GENERATIVOS: boolean</text>
    <text x="780" y="464" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ACTIVO: boolean = true</text>
    <text x="780" y="492.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ buscar_todos()</text>
    <text x="780" y="508.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ buscar_por_codigo(codigo)</text>
    <text x="780" y="524.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ actualizar_estado(codigo, activo)</text>
  </g>
  <!-- Clase: T_SUSCRIPCION -->
  <g id="class_ent_suscripcion">
    <rect x="1100" y="350" width="270" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="1100" y1="384" x2="1370" y2="384" stroke="#000000" stroke-width="1.2"/>
    <line x1="1100" y1="492.0" x2="1370" y2="492.0" stroke="#000000" stroke-width="1.2"/>
    <text x="1235.0" y="372.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_SUSCRIPCION</text>
    <text x="1110" y="400" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_SUSCRIPCION: bigint [PK]</text>
    <text x="1110" y="416" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_EMPRESA: int [FK]</text>
    <text x="1110" y="432" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ CODIGO_PLAN: string [FK]</text>
    <text x="1110" y="448" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ESTADO: string</text>
    <text x="1110" y="464" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ INICIO: timestamptz</text>
    <text x="1110" y="480" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ FIN: timestamptz</text>
    <text x="1110" y="508.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ contar_vigentes_por_plan(codigo)</text>
  </g>
  <!-- Clase: EMPRESA -->
  <g id="class_ent_empresa">
    <rect x="1100" y="115" width="270" height="116" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="1100" y1="149" x2="1370" y2="149" stroke="#000000" stroke-width="1.2"/>
    <line x1="1100" y1="209.0" x2="1370" y2="209.0" stroke="#000000" stroke-width="1.2"/>
    <text x="1235.0" y="137.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">EMPRESA</text>
    <text x="1110" y="165" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_EMPRESA: int [PK]</text>
    <text x="1110" y="181" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ NOMBRE_EMPRESA: string</text>
    <text x="1110" y="197" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ESTADO: string</text>
  </g>
  <!-- Clase: T_BITACORA -->
  <g id="class_ent_bitacora">
    <rect x="770" y="700" width="270" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="770" y1="734" x2="1040" y2="734" stroke="#000000" stroke-width="1.2"/>
    <line x1="770" y1="842.0" x2="1040" y2="842.0" stroke="#000000" stroke-width="1.2"/>
    <text x="905.0" y="722.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_BITACORA</text>
    <text x="780" y="750" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_BITACORA: bigint [PK]</text>
    <text x="780" y="766" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ FECHA_HORA: timestamp</text>
    <text x="780" y="782" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_USUARIO: int [FK]</text>
    <text x="780" y="798" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ MODULO: string = &apos;SAAS_PLANES&apos;</text>
    <text x="780" y="814" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ACCION: string = &apos;ACTUALIZAR_PLAN&apos;</text>
    <text x="780" y="830" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ RESULTADO: string</text>
    <text x="780" y="858.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ registrar_evento(accion, codigo)</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="320,458.0 345,458.0 345,434.0 370,434.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="330" y="428.0" font-size="10" font-style="italic" fill="#334155">solicita</text>
    <polyline points="710,434.0 740,434.0 740,443.0 770,443.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="725" y="437.0" font-size="10" font-style="italic" fill="#334155">persiste</text>
    <polyline points="1040,443.0 1070,443.0 1070,435.0 1100,435.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="1048" y="437.0" font-size="11" font-weight="bold" fill="#000000">1</text>
    <text x="1075" y="429.0" font-size="11" font-weight="bold" fill="#000000">0..*</text>
    <polyline points="1235.0,350 1235.0,231" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="1243.0" y="342" font-size="11" font-weight="bold" fill="#000000">0..*</text>
    <text x="1243.0" y="247" font-size="11" font-weight="bold" fill="#000000">1</text>
    <polyline points="905.0,536 905.0,700" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="913.0" y="552" font-size="11" font-weight="bold" fill="#000000">1</text>
    <text x="913.0" y="692" font-size="11" font-weight="bold" fill="#000000">0..*</text>
  </g>
</svg>
