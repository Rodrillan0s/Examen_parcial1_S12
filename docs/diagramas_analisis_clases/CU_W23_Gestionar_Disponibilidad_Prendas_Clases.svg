<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU/W23: Gestionar disponibilidad de prendas — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Módulo Web | Form (Boundary) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Administrador, Administrador de tienda, Encargado de sucursal</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Disponibilidad_Prendas -->
  <g id="class_form">
    <rect x="35" y="280" width="235" height="200" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="328" x2="270" y2="328" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="404.0" x2="270" y2="404.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Prendas</text>
    <text x="45" y="344" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_variante</text>
    <text x="45" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ flag_visible_web</text>
    <text x="45" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ flag_disponible_tienda</text>
    <text x="45" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ umbral_stock_alerta</text>
    <text x="45" y="420.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ conmutar_visibilidad_web()</text>
    <text x="45" y="436.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ conmutar_disponibilidad_tienda()</text>
    <text x="45" y="452.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ configurar_stock_minimo()</text>
    <text x="45" y="468.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ guardar_cambios_disponibilidad()</text>
  </g>
  <!-- Clase: Disponibilidad_Prendas_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="340" width="235" height="100" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="374" x2="545" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="396" x2="545" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Prendas_Controller</text>
    <text x="320" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ put_visibilidad_prenda(id, p)</text>
    <text x="320" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_alertas_bajo_stock(id_suc)</text>
  </g>
  <!-- Clase: Disponibilidad_Prendas_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Prendas_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ validar_umbral_minimo()</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ evaluar_estado_publicacion()</text>
    <text x="595" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ actualizar_banderas_disponibilidad()</text>
    <text x="595" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ auditar_cambio_visibilidad()</text>
  </g>
  <!-- Clase: Disponibilidad_Prendas_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Prendas_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ update_variante_flags(id, flags)</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ update_inventario_umbral(id, umbral)</text>
    <text x="890" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ insert_bitacora(b)</text>
  </g>
  <!-- Clase: T_PRODUCTO_VARIANTE -->
  <g id="class_variante">
    <rect x="1175" y="290" width="210" height="148" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="324" x2="1385" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="416.0" x2="1385" y2="416.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1280.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_PRODUCTO_VARIANTE</text>
    <text x="1185" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1185" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1185" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ SKU_VARIANTE</text>
    <text x="1185" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ES_VISIBLE_WEB</text>
    <text x="1185" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_INVENTARIO -->
  <g id="class_inventario">
    <rect x="1435" y="290" width="210" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1435" y1="324" x2="1645" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1435" y1="432.0" x2="1645" y2="432.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1540.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_INVENTARIO</text>
    <text x="1445" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_INVENTARIO</text>
    <text x="1445" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1445" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1445" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_ACTUAL</text>
    <text x="1445" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_DISPONIBLE</text>
    <text x="1445" y="420" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ UMBRAL_MINIMO</text>
  </g>
  <!-- Clase: T_PRODUCTO -->
  <g id="class_producto">
    <rect x="1695" y="290" width="150" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1695" y1="324" x2="1845" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1695" y1="384.0" x2="1845" y2="384.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1770.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_PRODUCTO</text>
    <text x="1705" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1705" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1705" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_BITACORA -->
  <g id="class_bitacora">
    <rect x="1175" y="570" width="210" height="148" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="604" x2="1385" y2="604" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="696.0" x2="1385" y2="696.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1280.0" y="592" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_BITACORA</text>
    <text x="1185" y="620" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_BITACORA</text>
    <text x="1185" y="636" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_USUARIO</text>
    <text x="1185" y="652" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ACCION</text>
    <text x="1185" y="668" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TABLA_AFECTADA</text>
    <text x="1185" y="684" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ FECHA</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1385,390 1435,390" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1392" y="380" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1412" y="380" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1645,390 1695,390" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1652" y="380" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1675" y="380" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1280,450 1280,570" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1290" y="475" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1290" y="555" font-size="11" font-weight="bold" fill="#111827">1</text>
  </g>
</svg>
