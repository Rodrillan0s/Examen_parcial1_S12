<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2150 840" width="2150" height="840" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU/W32: Visualizar indicadores empresariales — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Sistema Aura Store | Arquitectura Analítica: Dashboard_KPIs_View -&gt; Controller -&gt; Analytics_Engine (Sin Repo intermedio) -&gt; Entities</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Gerente General, Propietario, Administrador</text>
  <line x1="35" y1="82" x2="2115" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Arquitectura Específica -->
  <g transform="translate(1620, 24)">
    <rect x="0" y="0" width="495" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Arquitectura Analítica Optimizada:</text>
    <text x="12" y="36" font-size="10" fill="#64748b">Dashboard_View -&gt; KPI_Analytics_Controller -&gt; Analytics_Engine_Service -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Dashboard_KPIs_View -->
  <g id="class_dashboard_kpis">
    <rect x="35" y="270" width="260" height="216" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="318" x2="295" y2="318" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="410.0" x2="295" y2="410.0" stroke="#111827" stroke-width="1.4"/>
    <text x="165.0" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">Form</text>
    <text x="165.0" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Dashboard_KPIs_View</text>
    <text x="45" y="334" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ periodo_seleccionado</text>
    <text x="45" y="350" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ticket_promedio_bs</text>
    <text x="45" y="366" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ margen_bruto_pct</text>
    <text x="45" y="382" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ rotacion_inventario</text>
    <text x="45" y="398" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ canal_mas_rentable</text>
    <text x="45" y="426.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ seleccionar_rango_fechas()</text>
    <text x="45" y="442.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ cambiar_filtro_sucursal()</text>
    <text x="45" y="458.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ exportar_grafico_kpis()</text>
    <text x="45" y="474.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ actualizar_tablero()</text>
  </g>
  <!-- Clase: KPI_Analytics_Controller -->
  <g id="class_ctrl_kpis">
    <rect x="340" y="340" width="255" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="340" y1="374" x2="595" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="340" y1="396" x2="595" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="467.5" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">KPI_Analytics_Controller</text>
    <text x="350" y="412" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ get_dashboard_summary(periodo)</text>
    <text x="350" y="428" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ get_ventas_por_canal(periodo)</text>
    <text x="350" y="444" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ get_top_prendas_rentabilidad()</text>
  </g>
  <!-- Clase: Analytics_Engine_Service -->
  <g id="class_srv_analytics">
    <rect x="645" y="320" width="285" height="154" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="645" y1="354" x2="930" y2="354" stroke="#111827" stroke-width="1.4"/>
    <line x1="645" y1="398.0" x2="930" y2="398.0" stroke="#111827" stroke-width="1.4"/>
    <text x="787.5" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Analytics_Engine_Service</text>
    <text x="655" y="370" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- db_engine_postgres</text>
    <text x="655" y="386" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">- cache_metricas_redis</text>
    <text x="655" y="414.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ calcular_ticket_promedio()</text>
    <text x="655" y="430.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ calcular_crecimiento_interanual()</text>
    <text x="655" y="446.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ calcular_margen_por_categoria()</text>
    <text x="655" y="462.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ procesar_arqueos_por_caja()</text>
  </g>
  <!-- Clase: T_VENTA -->
  <g id="class_venta">
    <rect x="985" y="260" width="210" height="244" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="985" y1="294" x2="1195" y2="294" stroke="#111827" stroke-width="1.4"/>
    <line x1="985" y1="482.0" x2="1195" y2="482.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1090.0" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_VENTA</text>
    <text x="995" y="310" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_VENTA</text>
    <text x="995" y="326" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_CLIENTE</text>
    <text x="995" y="342" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="995" y="358" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPLEADO</text>
    <text x="995" y="374" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ NUMERO_VENTA</text>
    <text x="995" y="390" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ TIPO_VENTA</text>
    <text x="995" y="406" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_VENTA</text>
    <text x="995" y="422" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ SUBTOTAL</text>
    <text x="995" y="438" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ DESCUENTO</text>
    <text x="995" y="454" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ TOTAL</text>
    <text x="995" y="470" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_DETALLE_VENTA -->
  <g id="class_det_venta">
    <rect x="1255" y="100" width="210" height="180" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1255" y1="134" x2="1465" y2="134" stroke="#111827" stroke-width="1.4"/>
    <line x1="1255" y1="258.0" x2="1465" y2="258.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1360.0" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_DETALLE_VENTA</text>
    <text x="1265" y="150" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_DETALLE_VENTA</text>
    <text x="1265" y="166" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_VENTA</text>
    <text x="1265" y="182" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1265" y="198" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CANTIDAD</text>
    <text x="1265" y="214" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ PRECIO_UNITARIO</text>
    <text x="1265" y="230" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ DESCUENTO</text>
    <text x="1265" y="246" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ SUBTOTAL</text>
  </g>
  <!-- Clase: T_PAGO -->
  <g id="class_pago">
    <rect x="1255" y="480" width="210" height="196" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1255" y1="514" x2="1465" y2="514" stroke="#111827" stroke-width="1.4"/>
    <line x1="1255" y1="654.0" x2="1465" y2="654.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1360.0" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PAGO</text>
    <text x="1265" y="530" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PAGO</text>
    <text x="1265" y="546" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_VENTA</text>
    <text x="1265" y="562" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_METODO_PAGO</text>
    <text x="1265" y="578" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1265" y="594" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_TRANSACCION</text>
    <text x="1265" y="610" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MONTO</text>
    <text x="1265" y="626" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_PAGO</text>
    <text x="1265" y="642" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_METODO_PAGO -->
  <g id="class_metodo_pago">
    <rect x="1530" y="495" width="195" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1530" y1="529" x2="1725" y2="529" stroke="#111827" stroke-width="1.4"/>
    <line x1="1530" y1="605.0" x2="1725" y2="605.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1627.5" y="517" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_METODO_PAGO</text>
    <text x="1540" y="545" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_METODO_PAGO</text>
    <text x="1540" y="561" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1540" y="577" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ TIPO</text>
    <text x="1540" y="593" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_EMPLEADO -->
  <g id="class_empleado">
    <rect x="1530" y="240" width="205" height="180" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1530" y1="274" x2="1735" y2="274" stroke="#111827" stroke-width="1.4"/>
    <line x1="1530" y1="398.0" x2="1735" y2="398.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1632.5" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_EMPLEADO</text>
    <text x="1540" y="290" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPLEADO</text>
    <text x="1540" y="306" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_USUARIO</text>
    <text x="1540" y="322" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1540" y="338" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_EMPLEADO</text>
    <text x="1540" y="354" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CARGO</text>
    <text x="1540" y="370" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_CONTRATACION</text>
    <text x="1540" y="386" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="295,410 340,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="595,410 645,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="930,410 985,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1195,340 1225,340 1225,190 1255,190" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1200" y="330" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1230" y="180" font-size="11" font-weight="bold" fill="#111827">1..*</text>
    <polyline points="1195,440 1225,440 1225,570 1255,570" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1200" y="430" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1230" y="560" font-size="11" font-weight="bold" fill="#111827">1..*</text>
    <polyline points="1530,560 1465,560" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1505" y="550" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1472" y="550" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1530,310 1225,310 1195,310" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1505" y="300" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1200" y="300" font-size="11" font-weight="bold" fill="#111827">0..*</text>
  </g>
</svg>
