<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU/W29: Emitir comprobante de venta — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Módulo Web (Factura / Recibo) | Form -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Cajero</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Emision_Comprobante -->
  <g id="class_form">
    <rect x="35" y="280" width="235" height="200" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="328" x2="270" y2="328" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="404.0" x2="270" y2="404.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Emision_Comprobante</text>
    <text x="45" y="344" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_venta</text>
    <text x="45" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ tipo_comprobante</text>
    <text x="45" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ nit_razon_social</text>
    <text x="45" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ email_digital</text>
    <text x="45" y="420.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ seleccionar_tipo_factura_recibo()</text>
    <text x="45" y="436.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ingresar_datos_tributarios()</text>
    <text x="45" y="452.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ generar_codigo_control_qr()</text>
    <text x="45" y="468.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ mandar_impresion_termica()</text>
  </g>
  <!-- Clase: Comprobante_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="340" width="235" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="374" x2="545" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="396" x2="545" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Comprobante_Controller</text>
    <text x="320" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ post_emitir_comprobante(p)</text>
    <text x="320" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_comprobante_por_venta(id_v)</text>
    <text x="320" y="444" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_reimprimir_ticket(id_c)</text>
  </g>
  <!-- Clase: Comprobante_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Comprobante_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ validar_dosificacion_tributaria()</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ generar_codigo_control_y_qr()</text>
    <text x="595" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ registrar_comprobante_fiscal()</text>
    <text x="595" y="450" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ auditar_emision_fiscal()</text>
  </g>
  <!-- Clase: Comprobante_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Comprobante_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ insert_comprobante(comp)</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ update_venta_comprobante(id_v, id_c)</text>
    <text x="890" y="434" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ insert_bitacora(b)</text>
  </g>
  <!-- Clase: T_COMPROBANTE -->
  <g id="class_comprobante">
    <rect x="1175" y="290" width="210" height="196" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="324" x2="1385" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="464.0" x2="1385" y2="464.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1280.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_COMPROBANTE</text>
    <text x="1185" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_COMPROBANTE</text>
    <text x="1185" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VENTA</text>
    <text x="1185" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TIPO_COMPROBANTE</text>
    <text x="1185" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NUMERO_COMPROBANTE</text>
    <text x="1185" y="404" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_CONTROL</text>
    <text x="1185" y="420" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ QR_IMPRESION</text>
    <text x="1185" y="436" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ FECHA_EMISION</text>
    <text x="1185" y="452" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TOTAL</text>
  </g>
  <!-- Clase: T_VENTA -->
  <g id="class_venta">
    <rect x="1435" y="290" width="190" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1435" y1="324" x2="1625" y2="324" stroke="#111827" stroke-width="1.4"/>
    <line x1="1435" y1="400.0" x2="1625" y2="400.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1530.0" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_VENTA</text>
    <text x="1445" y="340" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VENTA</text>
    <text x="1445" y="356" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1445" y="372" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TOTAL_VENTA</text>
    <text x="1445" y="388" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_EMPRESA -->
  <g id="class_empresa">
    <rect x="1675" y="310" width="170" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1675" y1="344" x2="1845" y2="344" stroke="#111827" stroke-width="1.4"/>
    <line x1="1675" y1="420.0" x2="1845" y2="420.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1760.0" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_EMPRESA</text>
    <text x="1685" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPRESA</text>
    <text x="1685" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE_EMPRESA</text>
    <text x="1685" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NIT</text>
    <text x="1685" y="408" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ LEYENDA_FACTURA</text>
  </g>
  <!-- Clase: T_BITACORA -->
  <g id="class_bitacora">
    <rect x="1175" y="570" width="210" height="148" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="604" x2="1385" y2="604" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="696.0" x2="1385" y2="696.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1280.0" y="592" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_BITACORA</text>
    <text x="1185" y="620" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_BITACORA</text>
    <text x="1185" y="636" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_USUARIO</text>
    <text x="1185" y="652" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ACCION</text>
    <text x="1185" y="668" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TABLA_AFECTADA</text>
    <text x="1185" y="684" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ FECHA</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1385,380 1435,380" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1392" y="370" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1412" y="370" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1625,380 1675,380" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1632" y="370" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1655" y="370" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1280,490 1280,570" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1290" y="510" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1290" y="555" font-size="11" font-weight="bold" fill="#111827">1</text>
  </g>
</svg>
