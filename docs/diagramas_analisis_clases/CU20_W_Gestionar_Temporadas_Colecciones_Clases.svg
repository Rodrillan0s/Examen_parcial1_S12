<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU20 W: Gestionar temporadas y colecciones — Diagrama de Análisis de Clases (UML / ICONIX)</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Periodos Comerciales y Agrupaciones | Estereotipos: Boundary (Form) ── Control ── Entity</text>
  <text x="35" y="72" font-size="11.5" font-weight="bold" fill="#1e293b">Actor(es): <tspan font-weight="normal" fill="#334155">Administrador de Tienda</tspan></text>
  <line x1="35" y1="82" x2="1405" y2="82" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Leyenda de Estructura ICONIX -->
  <g transform="translate(1010, 24)">
    <rect x="0" y="0" width="395" height="48" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#1e293b">Estructura del Análisis de Clases (ICONIX):</text>
    <text x="12" y="36" font-size="10.5" fill="#475569">Boundary (Form) ── Control (Lógica) ── Entity (Persistencia)</text>
  </g>
  <!-- Clase: Form / Temporadas_Colecciones -->
  <g id="class_form_temporadas">
    <rect x="50" y="350" width="270" height="248" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="50" y1="398" x2="320" y2="398" stroke="#000000" stroke-width="1.2"/>
    <line x1="50" y1="506.0" x2="320" y2="506.0" stroke="#000000" stroke-width="1.2"/>
    <text x="185.0" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155" font-family="Arial, Helvetica, sans-serif">Form</text>
    <text x="185.0" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Temporadas_Colecciones</text>
    <text x="60" y="414" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ id_temporada: int</text>
    <text x="60" y="430" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ nombre_temporada: string</text>
    <text x="60" y="446" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ fecha_inicio: date</text>
    <text x="60" y="462" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ fecha_fin: date</text>
    <text x="60" y="478" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ id_coleccion: int</text>
    <text x="60" y="494" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ nombre_coleccion: string</text>
    <text x="60" y="522.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ingresar_datos_temporada()</text>
    <text x="60" y="538.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ingresar_datos_coleccion()</text>
    <text x="60" y="554.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ guardar_temporada()</text>
    <text x="60" y="570.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ guardar_coleccion()</text>
    <text x="60" y="586.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ mostrar_error_fechas()</text>
  </g>
  <!-- Clase: Control / Temporadas_Colecciones -->
  <g id="class_ctrl_temporadas">
    <rect x="380" y="350" width="330" height="152" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="380" y1="398" x2="710" y2="398" stroke="#000000" stroke-width="1.2"/>
    <line x1="380" y1="426.0" x2="710" y2="426.0" stroke="#000000" stroke-width="1.2"/>
    <text x="545.0" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155" font-family="Arial, Helvetica, sans-serif">Control</text>
    <text x="545.0" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">Temporadas_Colecciones</text>
    <text x="390" y="414" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">- season_service: SeasonService</text>
    <text x="390" y="442.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ crear_temporada(nombre, ini, fin)</text>
    <text x="390" y="458.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ validar_rango_fechas(ini, fin)</text>
    <text x="390" y="474.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ crear_coleccion(id_temp, nom, desc)</text>
    <text x="390" y="490.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ vincular_productos(id_col, lista_p)</text>
  </g>
  <!-- Clase: T_TEMPORADA -->
  <g id="class_ent_temporada">
    <rect x="770" y="350" width="270" height="186" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="770" y1="384" x2="1040" y2="384" stroke="#000000" stroke-width="1.2"/>
    <line x1="770" y1="492.0" x2="1040" y2="492.0" stroke="#000000" stroke-width="1.2"/>
    <text x="905.0" y="372.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_TEMPORADA</text>
    <text x="780" y="400" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_TEMPORADA: int [PK]</text>
    <text x="780" y="416" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_EMPRESA: int [FK]</text>
    <text x="780" y="432" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ NOMBRE: string</text>
    <text x="780" y="448" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ FECHA_INICIO: date</text>
    <text x="780" y="464" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ FECHA_FIN: date</text>
    <text x="780" y="480" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ACTIVO: boolean = true</text>
    <text x="780" y="508.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ insertar(datos)</text>
    <text x="780" y="524.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ validar_rango(ini, fin)</text>
  </g>
  <!-- Clase: T_COLECCION -->
  <g id="class_ent_coleccion">
    <rect x="1100" y="350" width="280" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="1100" y1="384" x2="1380" y2="384" stroke="#000000" stroke-width="1.2"/>
    <line x1="1100" y1="476.0" x2="1380" y2="476.0" stroke="#000000" stroke-width="1.2"/>
    <text x="1240.0" y="372.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_COLECCION</text>
    <text x="1110" y="400" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_COLECCION: int [PK]</text>
    <text x="1110" y="416" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_TEMPORADA: int [FK]</text>
    <text x="1110" y="432" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ NOMBRE: string</text>
    <text x="1110" y="448" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ DESCRIPCION: string</text>
    <text x="1110" y="464" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ESTADO: string = &apos;ACTIVO&apos;</text>
    <text x="1110" y="492.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ insertar(datos)</text>
    <text x="1110" y="508.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ asociar_temporada(id_temp)</text>
  </g>
  <!-- Clase: T_PRODUCTO -->
  <g id="class_ent_producto">
    <rect x="1100" y="115" width="280" height="116" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="1100" y1="149" x2="1380" y2="149" stroke="#000000" stroke-width="1.2"/>
    <line x1="1100" y1="209.0" x2="1380" y2="209.0" stroke="#000000" stroke-width="1.2"/>
    <text x="1240.0" y="137.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_PRODUCTO</text>
    <text x="1110" y="165" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_PRODUCTO: int [PK]</text>
    <text x="1110" y="181" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ NOMBRE: string</text>
    <text x="1110" y="197" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ESTADO: string</text>
  </g>
  <!-- Clase: T_BITACORA -->
  <g id="class_ent_bitacora">
    <rect x="770" y="700" width="270" height="154" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <line x1="770" y1="734" x2="1040" y2="734" stroke="#000000" stroke-width="1.2"/>
    <line x1="770" y1="826.0" x2="1040" y2="826.0" stroke="#000000" stroke-width="1.2"/>
    <text x="905.0" y="722.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000" font-family="Arial, Helvetica, sans-serif">T_BITACORA</text>
    <text x="780" y="750" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_BITACORA: bigint [PK]</text>
    <text x="780" y="766" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ FECHA_HORA: timestamp</text>
    <text x="780" y="782" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ID_USUARIO: int [FK]</text>
    <text x="780" y="798" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ MODULO: string = &apos;TEMPORADA&apos;</text>
    <text x="780" y="814" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ ACCION: string = &apos;CREAR_TEMPORADA&apos;</text>
    <text x="780" y="842.0" font-size="11" fill="#000000" font-family="monospace, Courier New, sans-serif">+ registrar_evento(accion, id_temp)</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="320,474.0 350,474.0 350,426.0 380,426.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="335" y="420.0" font-size="10" font-style="italic" fill="#334155">solicita</text>
    <polyline points="710,426.0 740,426.0 740,443.0 770,443.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="725" y="437.0" font-size="10" font-style="italic" fill="#334155">persiste</text>
    <polyline points="1040,443.0 1070,443.0 1070,435.0 1100,435.0" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="1048" y="437.0" font-size="11" font-weight="bold" fill="#000000">1</text>
    <text x="1075" y="429.0" font-size="11" font-weight="bold" fill="#000000">0..*</text>
    <polyline points="1240.0,350 1240.0,231" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="1248.0" y="342" font-size="11" font-weight="bold" fill="#000000">0..1</text>
    <text x="1248.0" y="247" font-size="11" font-weight="bold" fill="#000000">0..*</text>
    <polyline points="905.0,536 905.0,700" fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="913.0" y="552" font-size="11" font-weight="bold" fill="#000000">1</text>
    <text x="913.0" y="692" font-size="11" font-weight="bold" fill="#000000">0..*</text>
  </g>
</svg>
