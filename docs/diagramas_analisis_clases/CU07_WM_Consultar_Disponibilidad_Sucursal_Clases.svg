<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 850" width="1880" height="850" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU07 W/M: Consultar disponibilidad por sucursal — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Unificación Web (CU/W07) y Móvil (CU/M07) | Form (Boundary) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD en MAYÚSCULAS)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Cliente (Web y Móvil), Administrador, Administrador de tienda, Encargado de sucursal, Cajero</text>
  <line x1="35" y1="82" x2="1845" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Roles Arquitectónicos -->
  <g transform="translate(1390, 24)">
    <rect x="0" y="0" width="455" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Capas del Análisis de Clases:</text>
    <text x="12" y="36" font-size="10.5" fill="#64748b">Boundary (Form) -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  </g>
  <!-- Clase: Form / Disponibilidad_Sucursal -->
  <g id="class_form">
    <rect x="35" y="290" width="235" height="200" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="338" x2="270" y2="338" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="414.0" x2="270" y2="414.0" stroke="#111827" stroke-width="1.4"/>
    <text x="152.5" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">Form</text>
    <text x="152.5" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Sucursal</text>
    <text x="45" y="354" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_variante_sel</text>
    <text x="45" y="370" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ id_ciudad_sel</text>
    <text x="45" y="386" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ lat_usuario</text>
    <text x="45" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ lng_usuario</text>
    <text x="45" y="430.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ seleccionar_variante()</text>
    <text x="45" y="446.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ filtrar_por_ciudad()</text>
    <text x="45" y="462.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ calcular_tienda_cercana()</text>
    <text x="45" y="478.0" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ mostrar_stock_tiendas()</text>
  </g>
  <!-- Clase: Disponibilidad_Controller -->
  <g id="class_ctrl">
    <rect x="310" y="340" width="235" height="100" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="310" y1="374" x2="545" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="310" y1="396" x2="545" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="427.5" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Controller</text>
    <text x="320" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_disponibilidad_variante(id_var)</text>
    <text x="320" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ get_stock_por_sucursal(id_var, id_suc)</text>
  </g>
  <!-- Clase: Disponibilidad_Service -->
  <g id="class_srv">
    <rect x="585" y="330" width="255" height="100" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="585" y1="364" x2="840" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="585" y1="386" x2="840" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="712.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Service</text>
    <text x="595" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ consultar_stock_sucursales(id_var)</text>
    <text x="595" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ filtrar_sucursales_con_existencias(lista)</text>
  </g>
  <!-- Clase: Disponibilidad_Repository -->
  <g id="class_repo">
    <rect x="880" y="330" width="255" height="100" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="880" y1="364" x2="1135" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="880" y1="386" x2="1135" y2="386" stroke="#111827" stroke-width="1.4"/>
    <text x="1007.5" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Disponibilidad_Repository</text>
    <text x="890" y="402" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_stock_en_sucursales(id_var)</text>
    <text x="890" y="418" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ find_sucursales_activas_con_ciudad()</text>
  </g>
  <!-- Clase: T_INVENTARIO -->
  <g id="class_inventario">
    <rect x="1175" y="310" width="210" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="344" x2="1385" y2="344" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="452.0" x2="1385" y2="452.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1280.0" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_INVENTARIO</text>
    <text x="1185" y="360" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_INVENTARIO</text>
    <text x="1185" y="376" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1185" y="392" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1185" y="408" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_ACTUAL</text>
    <text x="1185" y="424" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_RESERVADO</text>
    <text x="1185" y="440" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ STOCK_DISPONIBLE</text>
  </g>
  <!-- Clase: T_PRODUCTO_VARIANTE -->
  <g id="class_variante">
    <rect x="1175" y="90" width="210" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1175" y1="124" x2="1385" y2="124" stroke="#111827" stroke-width="1.4"/>
    <line x1="1175" y1="200.0" x2="1385" y2="200.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1280.0" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_PRODUCTO_VARIANTE</text>
    <text x="1185" y="140" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_VARIANTE</text>
    <text x="1185" y="156" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1185" y="172" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ SKU_VARIANTE</text>
    <text x="1185" y="188" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_SUCURSAL -->
  <g id="class_sucursal">
    <rect x="1445" y="300" width="195" height="212" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1445" y1="334" x2="1640" y2="334" stroke="#111827" stroke-width="1.4"/>
    <line x1="1445" y1="490.0" x2="1640" y2="490.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1542.5" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_SUCURSAL</text>
    <text x="1455" y="350" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_SUCURSAL</text>
    <text x="1455" y="366" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_EMPRESA</text>
    <text x="1455" y="382" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CIUDAD</text>
    <text x="1455" y="398" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1455" y="414" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DIRECCION</text>
    <text x="1455" y="430" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ TELEFONO</text>
    <text x="1455" y="446" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ LATITUD</text>
    <text x="1455" y="462" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ LONGITUD</text>
    <text x="1455" y="478" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_CIUDAD -->
  <g id="class_ciudad">
    <rect x="1695" y="330" width="150" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1695" y1="364" x2="1845" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="1695" y1="440.0" x2="1845" y2="440.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1770.0" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">T_CIUDAD</text>
    <text x="1705" y="380" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ID_CIUDAD</text>
    <text x="1705" y="396" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1705" y="412" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ DEPARTAMENTO</text>
    <text x="1705" y="428" font-size="11" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="270,410 310,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="545,410 585,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="840,410 880,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1135,410 1175,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1280,310 1280,215" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1290" y="290" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1290" y="235" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1385,410 1445,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1395" y="400" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1425" y="400" font-size="11" font-weight="bold" fill="#111827">1</text>
    <polyline points="1640,410 1695,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1648" y="400" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <text x="1675" y="400" font-size="11" font-weight="bold" fill="#111827">1</text>
  </g>
</svg>
