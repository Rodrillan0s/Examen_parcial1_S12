<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 840" width="2100" height="840" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <!-- Encabezado del Diagrama -->
  <text x="35" y="34" font-size="16" font-weight="bold" fill="#0f172a">CU/W30: Gestionar promociones — Diagrama de Análisis de Clases</text>
  <text x="35" y="54" font-size="12" font-weight="500" fill="#475569">Sistema Aura Store | Arquitectura Multicapa: Form -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (BD)</text>
  <text x="35" y="72" font-size="11.5" font-weight="600" fill="#2563eb">Actor(es): Administrador de tienda, Encargado de Marketing</text>
  <line x1="35" y1="82" x2="2065" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Leyenda de Arquitectura Específica -->
  <g transform="translate(1570, 24)">
    <rect x="0" y="0" width="495" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="19" font-size="11" font-weight="bold" fill="#334155">Arquitectura Promociones &amp; Auditoría:</text>
    <text x="12" y="36" font-size="10" fill="#64748b">Boundary -&gt; Controller -&gt; Service -&gt; Repository -&gt; Entities (con T_BITACORA)</text>
  </g>
  <!-- Clase: Form / Gestion_Promociones -->
  <g id="class_form_promocion">
    <rect x="35" y="270" width="260" height="248" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="35" y1="318" x2="295" y2="318" stroke="#111827" stroke-width="1.4"/>
    <line x1="35" y1="426.0" x2="295" y2="426.0" stroke="#111827" stroke-width="1.4"/>
    <text x="165.0" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">Form</text>
    <text x="165.0" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Gestion_Promociones</text>
    <text x="45" y="334" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ id_promocion_sel</text>
    <text x="45" y="350" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ nombre_promocion</text>
    <text x="45" y="366" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ porcentaje_desc</text>
    <text x="45" y="382" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ fecha_inicio</text>
    <text x="45" y="398" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ fecha_fin</text>
    <text x="45" y="414" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ prendas_asignadas</text>
    <text x="45" y="442.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ crear_promocion()</text>
    <text x="45" y="458.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ vincular_prendas_catalogo()</text>
    <text x="45" y="474.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ modificar_vigencia()</text>
    <text x="45" y="490.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ desactivar_promocion()</text>
    <text x="45" y="506.0" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ mostrar_grilla_promociones()</text>
  </g>
  <!-- Clase: Promocion_Controller -->
  <g id="class_ctrl_promocion">
    <rect x="335" y="340" width="245" height="116" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="335" y1="374" x2="580" y2="374" stroke="#111827" stroke-width="1.4"/>
    <line x1="335" y1="396" x2="580" y2="396" stroke="#111827" stroke-width="1.4"/>
    <text x="457.5" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Promocion_Controller</text>
    <text x="345" y="412" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ post_crear_promocion(datos)</text>
    <text x="345" y="428" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ put_asignar_prendas(id, prendas)</text>
    <text x="345" y="444" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ get_promociones_activas()</text>
  </g>
  <!-- Clase: Promocion_Service -->
  <g id="class_srv_promocion">
    <rect x="620" y="325" width="270" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="620" y1="359" x2="890" y2="359" stroke="#111827" stroke-width="1.4"/>
    <line x1="620" y1="381" x2="890" y2="381" stroke="#111827" stroke-width="1.4"/>
    <text x="755.0" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Promocion_Service</text>
    <text x="630" y="397" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ registrar_promocion(datos)</text>
    <text x="630" y="413" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ validar_solapamiento_fechas()</text>
    <text x="630" y="429" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ aplicar_descuento_prendas()</text>
    <text x="630" y="445" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ auditar_evento_promocion()</text>
  </g>
  <!-- Clase: Promocion_Repository -->
  <g id="class_repo_promocion">
    <rect x="930" y="325" width="265" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="930" y1="359" x2="1195" y2="359" stroke="#111827" stroke-width="1.4"/>
    <line x1="930" y1="381" x2="1195" y2="381" stroke="#111827" stroke-width="1.4"/>
    <text x="1062.5" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Promocion_Repository</text>
    <text x="940" y="397" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ insert_promocion(datos)</text>
    <text x="940" y="413" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ insert_promocion_producto(id_p, id_pr)</text>
    <text x="940" y="429" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ find_promociones_activas()</text>
    <text x="940" y="445" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ insert_bitacora_auditoria(reg)</text>
  </g>
  <!-- Clase: T_PROMOCION -->
  <g id="class_promocion">
    <rect x="1245" y="330" width="205" height="164" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1245" y1="364" x2="1450" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="1245" y1="472.0" x2="1450" y2="472.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1347.5" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PROMOCION</text>
    <text x="1255" y="380" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PROMOCION</text>
    <text x="1255" y="396" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1255" y="412" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ DESCRIPCION</text>
    <text x="1255" y="428" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_INICIO</text>
    <text x="1255" y="444" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_FIN</text>
    <text x="1255" y="460" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
  </g>
  <!-- Clase: T_PROMOCION_PRODUCTO -->
  <g id="class_promo_prod">
    <rect x="1495" y="330" width="215" height="132" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1495" y1="364" x2="1710" y2="364" stroke="#111827" stroke-width="1.4"/>
    <line x1="1495" y1="440.0" x2="1710" y2="440.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1602.5" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PROMOCION_PRODUCTO</text>
    <text x="1505" y="380" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PROMOCION_PRODUCTO</text>
    <text x="1505" y="396" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PROMOCION</text>
    <text x="1505" y="412" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1505" y="428" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ PORCENTAJE_DESCUENTO</text>
  </g>
  <!-- Clase: T_PRODUCTO -->
  <g id="class_producto">
    <rect x="1755" y="240" width="210" height="244" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1755" y1="274" x2="1965" y2="274" stroke="#111827" stroke-width="1.4"/>
    <line x1="1755" y1="462.0" x2="1965" y2="462.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1860.0" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_PRODUCTO</text>
    <text x="1765" y="290" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_PRODUCTO</text>
    <text x="1765" y="306" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_CATEGORIA</text>
    <text x="1765" y="322" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ CODIGO_PRODUCTO</text>
    <text x="1765" y="338" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ NOMBRE</text>
    <text x="1765" y="354" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ DESCRIPCION</text>
    <text x="1765" y="370" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MARCA</text>
    <text x="1765" y="386" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ GENERO</text>
    <text x="1765" y="402" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ PRECIO</text>
    <text x="1765" y="418" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ IMAGEN_URL</text>
    <text x="1765" y="434" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ESTADO</text>
    <text x="1765" y="450" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_REGISTRO</text>
  </g>
  <!-- Clase: T_BITACORA -->
  <g id="class_bitacora">
    <rect x="1245" y="570" width="205" height="212" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
    <line x1="1245" y1="604" x2="1450" y2="604" stroke="#111827" stroke-width="1.4"/>
    <line x1="1245" y1="760.0" x2="1450" y2="760.0" stroke="#111827" stroke-width="1.4"/>
    <text x="1347.5" y="592" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">T_BITACORA</text>
    <text x="1255" y="620" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_BITACORA</text>
    <text x="1255" y="636" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ID_USUARIO</text>
    <text x="1255" y="652" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ MODULO</text>
    <text x="1255" y="668" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ ACCION</text>
    <text x="1255" y="684" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ DESCRIPCION</text>
    <text x="1255" y="700" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ FECHA_HORA</text>
    <text x="1255" y="716" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ IP</text>
    <text x="1255" y="732" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ TENANT_ORIGEN</text>
    <text x="1255" y="748" font-size="10.5" fill="#111827" font-family="monospace, sans-serif">+ RESULTADO</text>
  </g>

  <!-- Asociaciones y Multiplicidades -->
  <g id="associations">
    <polyline points="295,410 335,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="580,410 620,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="890,410 930,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1195,410 1245,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1195,430 1220,430 1220,650 1245,650" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <polyline points="1450,410 1495,410" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1456" y="400" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1472" y="400" font-size="11" font-weight="bold" fill="#111827">0..*</text>
    <polyline points="1755,370 1710,370" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1735" y="360" font-size="11" font-weight="bold" fill="#111827">1</text>
    <text x="1715" y="360" font-size="11" font-weight="bold" fill="#111827">0..*</text>
  </g>
</svg>
