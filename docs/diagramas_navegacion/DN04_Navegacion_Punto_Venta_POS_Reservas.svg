  <path d="M 1020 331.0 L 1140 331.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1080.0" y="325.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[cobrar_venta]</text>
  <path d="M 1460 331.0 L 1580 323.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1520.0" y="321.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[pago_asentado]</text>
  <path d="M 1740.0 386 L 1740 480 L 850 480 L 850.0 402" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1740.0" y="427.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[siguiente_venta]</text>
  <path d="M 140 680 L 680 680" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="410.0" y="674.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[modulo_reservas_tienda]</text>
  <path d="M 1020 705.0 L 1140 705.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1080.0" y="699.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[escanear_voucher_qr]</text>
  <path d="M 1300.0 650 L 1300.0 402" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1300.0" y="520.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[cobrar_saldo_reserva]</text>
  <path d="M 1460 705.0 L 1580 705.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1520.0" y="699.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[auditar_turnos]</text>
  <path d="M 1836.0 386 L 1800 560 L 1800 650 L 1804.0 650" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1818.0" y="467.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[fin_jornada / arqueo]</text>
</svg>