<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 920" width="1980" height="920" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Marcador de flecha de transición UML estándar -->
    <marker id="uml_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <!-- Marcador de flecha abierta para retornos -->
    <marker id="uml_return_arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 2 1.5 L 8 5 L 2 8.5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Marco Estándar UML -->
  <rect x="15" y="15" width="1950" height="890" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <path d="M 15 15 L 640 15 L 655 35 L 655 45 L 15 45 Z" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold" fill="#0f172a">stm [Módulo 01] DN01: Navegación de Autenticación y Gestión de Usuarios (CU01WM - CU04WM)</text>

  <g id="actor_ADMINISTRADOR">
    <circle cx="100" cy="210" r="12" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="222" x2="100" y2="255" stroke="#111827" stroke-width="1.8"/>
    <line x1="82" y1="233" x2="118" y2="233" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="255" x2="86" y2="282" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="255" x2="114" y2="282" stroke="#111827" stroke-width="1.8"/>
    <text x="100" y="300" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">ADMINISTRADOR</text>
    <text x="100" y="313" font-size="9" font-style="italic" fill="#64748b" text-anchor="middle">Gestor RBAC</text>
  </g>
  <g id="actor_CLIENTE">
    <circle cx="100" cy="550" r="12" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="562" x2="100" y2="595" stroke="#111827" stroke-width="1.8"/>
    <line x1="82" y1="573" x2="118" y2="573" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="595" x2="86" y2="622" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="595" x2="114" y2="622" stroke="#111827" stroke-width="1.8"/>
    <text x="100" y="640" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">CLIENTE</text>
    <text x="100" y="653" font-size="9" font-style="italic" fill="#64748b" text-anchor="middle">Usuario Registrado</text>
  </g>
  <g id="screen_login">
    <rect x="300" y="360" width="260" height="126" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="300" y1="394" x2="560" y2="394" stroke="#111827" stroke-width="1.2"/>
    <text x="430.0" y="373" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="430.0" y="387" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Login_Screen</text>
    <text x="310" y="410" font-size="9.5" fill="#1f2937">entry / inicializar_formulario()</text>
    <text x="310" y="426" font-size="9.5" fill="#1f2937">[click_iniciar] / enviar_credenciales()</text>
    <text x="310" y="442" font-size="9.5" fill="#1f2937">[click_crear] -&gt; Registro_Usuario</text>
    <text x="310" y="458" font-size="9.5" fill="#1f2937">[click_recuperar] -&gt; Recuperar_Clave</text>
    <text x="310" y="474" font-size="9.5" fill="#1f2937">[login_ok] -&gt; Enrutar según Rol</text>
  </g>
  <g id="screen_registro">
    <rect x="680" y="540" width="280" height="126" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="680" y1="574" x2="960" y2="574" stroke="#111827" stroke-width="1.2"/>
    <text x="820.0" y="553" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="820.0" y="567" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Registro_Usuario_Screen</text>
    <text x="690" y="590" font-size="9.5" fill="#1f2937">«CU01WM: Registrar Usuario»</text>
    <text x="690" y="606" font-size="9.5" fill="#1f2937">entry / cargar_formulario_registro()</text>
    <text x="690" y="622" font-size="9.5" fill="#1f2937">[click_guardar] / validar_datos()</text>
    <text x="690" y="638" font-size="9.5" fill="#1f2937">[registro_exitoso] -&gt; Login_Screen</text>
    <text x="690" y="654" font-size="9.5" fill="#1f2937">[cancelar] -&gt; Login_Screen</text>
  </g>
  <g id="screen_recuperar">
    <rect x="680" y="200" width="280" height="110" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="680" y1="234" x2="960" y2="234" stroke="#111827" stroke-width="1.2"/>
    <text x="820.0" y="213" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="820.0" y="227" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Recuperar_Password_Modal</text>
    <text x="690" y="250" font-size="9.5" fill="#1f2937">entry / solicitar_email_o_telefono()</text>
    <text x="690" y="266" font-size="9.5" fill="#1f2937">[click_enviar_otp] / despachar_codigo()</text>
    <text x="690" y="282" font-size="9.5" fill="#1f2937">[validar_otp] / restablecer_clave()</text>
    <text x="690" y="298" font-size="9.5" fill="#1f2937">[cerrar_modal] -&gt; Login_Screen</text>
  </g>
  <g id="screen_perfil">
    <rect x="1120" y="540" width="300" height="142" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="1120" y1="574" x2="1420" y2="574" stroke="#111827" stroke-width="1.2"/>
    <text x="1270.0" y="553" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="1270.0" y="567" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Perfil_Usuario_Screen</text>
    <text x="1130" y="590" font-size="9.5" fill="#1f2937">«CU03WM: Gestionar Perfil»</text>
    <text x="1130" y="606" font-size="9.5" fill="#1f2937">entry / cargar_datos_personales()</text>
    <text x="1130" y="622" font-size="9.5" fill="#1f2937">do / mostrar_direcciones_y_tarjetas()</text>
    <text x="1130" y="638" font-size="9.5" fill="#1f2937">[click_editar] -&gt; Editar_Perfil_Modal</text>
    <text x="1130" y="654" font-size="9.5" fill="#1f2937">[cambiar_password] -&gt; Modal_Password</text>
    <text x="1130" y="670" font-size="9.5" fill="#1f2937">[cerrar_sesion] -&gt; Login_Screen</text>
  </g>
  <g id="screen_edit_perfil">
    <rect x="1540" y="540" width="280" height="94" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="1540" y1="574" x2="1820" y2="574" stroke="#111827" stroke-width="1.2"/>
    <text x="1680.0" y="553" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="1680.0" y="567" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Editar_Perfil_Modal</text>
    <text x="1550" y="590" font-size="9.5" fill="#1f2937">entry / precargar_formulario()</text>
    <text x="1550" y="606" font-size="9.5" fill="#1f2937">[guardar_cambios] / update_perfil()</text>
    <text x="1550" y="622" font-size="9.5" fill="#1f2937">[cancelar] -&gt; Perfil_Usuario_Screen</text>
  </g>
  <g id="screen_roles">
    <rect x="1120" y="180" width="320" height="126" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="1120" y1="214" x2="1440" y2="214" stroke="#111827" stroke-width="1.2"/>
    <text x="1280.0" y="193" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="1280.0" y="207" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Gestion_Roles_Permisos_Screen</text>
    <text x="1130" y="230" font-size="9.5" fill="#1f2937">«CU04WM: Gestionar Roles y Permisos»</text>
    <text x="1130" y="246" font-size="9.5" fill="#1f2937">entry / listar_usuarios_y_roles()</text>
    <text x="1130" y="262" font-size="9.5" fill="#1f2937">[seleccionar_usuario] -&gt; Asignar_Rol_Modal</text>
    <text x="1130" y="278" font-size="9.5" fill="#1f2937">[crear_nuevo_rol] -&gt; Configurar_Permisos</text>
    <text x="1130" y="294" font-size="9.5" fill="#1f2937">[auditar_accesos] / exportar_bitacora()</text>
  </g>
  <g id="screen_asignar_rol">
    <rect x="1560" y="180" width="300" height="94" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="1560" y1="214" x2="1860" y2="214" stroke="#111827" stroke-width="1.2"/>
    <text x="1710.0" y="193" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="1710.0" y="207" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Asignar_Rol_Permisos_Modal</text>
    <text x="1570" y="230" font-size="9.5" fill="#1f2937">entry / cargar_arbol_permisos()</text>
    <text x="1570" y="246" font-size="9.5" fill="#1f2937">[guardar_asignacion] / commit_rbac()</text>
    <text x="1570" y="262" font-size="9.5" fill="#1f2937">[cancelar] -&gt; Gestion_Roles_Permisos</text>
  </g>
  <path d="M 140 580 L 300 440" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="220.0" y="504.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[acceder]</text>
  <path d="M 140 240 L 300 390" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="220.0" y="309.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[acceder_admin]</text>
  <path d="M 560 397.8 L 620 400 L 620 260 L 680 244.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="590.0" y="392.9" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[olvido_clave]</text>
  <path d="M 680 277.0 L 600 300 L 600 420 L 560 410.4" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="640.0" y="282.5" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[volver / clave_cambiada]</text>
  <path d="M 560 448.2 L 620 450 L 620 600 L 680 590.4" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="590.0" y="443.1" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[click_registrarse]</text>
  <path d="M 680 628.2 L 600 650 L 600 470 L 560 460.8" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="640.0" y="633.1" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[cuenta_creada]</text>
  <path d="M 560 423.0 L 1040 430 L 1040 600 L 1120 596.8" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="800.0" y="420.5" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[login_exitoso / rol == CLIENTE]</text>
  <path d="M 1420 611.0 L 1540 587.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1480.0" y="593.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[click_editar]</text>
  <path d="M 1540 605.8 L 1420 639.4" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1480.0" y="616.5999999999999" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[guardar / cancelar]</text>
  <path d="M 560 385.2 L 1040 380 L 1040 240 L 1120 230.4" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="800.0" y="376.6" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[login_exitoso / rol == ADMIN]</text>
  <path d="M 1440 243.0 L 1560 227.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1500.0" y="229.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[editar_permisos]</text>
  <path d="M 1560 245.8 L 1440 268.2" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1500.0" y="251.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[guardar_rbac]</text>
</svg>