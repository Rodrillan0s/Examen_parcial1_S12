  <path d="M 560 382.0 L 620 390 L 620 240 L 700 236.8" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="590.0" y="380.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[abrir_dashboard_kpi]</text>
  <path d="M 560 448.0 L 620 450 L 620 600 L 700 590.4" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="590.0" y="443.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[monitorear_rotacion]</text>
  <path d="M 560 415.0 L 1180 431.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="870.0" y="417.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[modulo_reportes]</text>
  <path d="M 1040 251.0 L 1080 240 L 1080 390 L 1180 402.6" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1060.0" y="239.5" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[exportar_informe_ejecutivo]</text>
  <path d="M 1040 603.0 L 1080 600 L 1080 430 L 1180 459.4" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1060.0" y="595.5" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[solicitar_auditoria_detallada]</text>
  <path d="M 1520 431.0 L 1640 415.0" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1580.0" y="417.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[configurar_filtros]</text>
  <path d="M 1800.0 470 L 1800.0 680" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="1800.0" y="569.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[compilacion_exitosa]</text>
