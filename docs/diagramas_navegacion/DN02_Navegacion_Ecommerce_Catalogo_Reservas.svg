  <path d="M 2180.0 442 L 2180.0 680" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#uml_arrow)"/>
  <text x="2180.0" y="555.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[pago_aprobado]</text>
  <path d="M 1900 780 L 1900 440 L 2040 440" fill="none" stroke="#111827" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#uml_arrow)"/>
  <text x="1900.0" y="604.0" font-size="9" font-weight="500" fill="#111827" text-anchor="middle" paint-order="stroke fill" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[webhook_notificacion_pago]</text>
