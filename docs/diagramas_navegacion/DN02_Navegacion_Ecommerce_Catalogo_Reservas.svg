<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2380 1040" width="2380" height="1040" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Marcador de flecha de transición UML estándar -->
    <marker id="uml_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <!-- Marcador de flecha abierta para retornos -->
    <marker id="uml_return_arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 2 1.5 L 8 5 L 2 8.5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Marco Estándar UML -->
  <rect x="15" y="15" width="2350" height="1010" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <path d="M 15 15 L 640 15 L 655 35 L 655 45 L 15 45 Z" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
  <text x="30" y="34" font-size="12" font-weight="bold" fill="#0f172a">stm [Módulos 02, 04, 05] DN02: Navegación E-Commerce, Catálogo Retail y Reservas (CU05WM-CU10WM, CU27W)</text>

  <g id="actor_CLIENTE">
    <circle cx="100" cy="330" r="12" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="342" x2="100" y2="375" stroke="#111827" stroke-width="1.8"/>
    <line x1="82" y1="353" x2="118" y2="353" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="375" x2="86" y2="402" stroke="#111827" stroke-width="1.8"/>
    <line x1="100" y1="375" x2="114" y2="402" stroke="#111827" stroke-width="1.8"/>
    <text x="100" y="420" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">CLIENTE</text>
    <text x="100" y="433" font-size="9" font-style="italic" fill="#64748b" text-anchor="middle">Comprador Retail</text>
  </g>
  <g id="ext_SISTEMA_DE_PAGOS">
    <rect x="1800.0" y="750.0" width="200" height="60" rx="6" ry="6" fill="#f8fafc" stroke="#111827" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="1900" y="766.0" font-size="8.5" font-style="italic" fill="#475569" text-anchor="middle">«external system»</text>
    <text x="1900" y="782.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">SISTEMA DE PAGOS</text>
  </g>
  <g id="screen_catalogo">
    <rect x="280" y="300" width="300" height="142" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="280" y1="334" x2="580" y2="334" stroke="#111827" stroke-width="1.2"/>
    <text x="430.0" y="313" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="430.0" y="327" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Catalogo_Prendas_Screen</text>
    <text x="290" y="350" font-size="9.5" fill="#1f2937">«CU05WM: Buscar y Filtrar Productos»</text>
    <text x="290" y="366" font-size="9.5" fill="#1f2937">entry / cargar_catalogo_reciente()</text>
    <text x="290" y="382" font-size="9.5" fill="#1f2937">[click_categoria] / filtrar_por_categoria()</text>
    <text x="290" y="398" font-size="9.5" fill="#1f2937">[click_prenda] -&gt; Ficha_Detalle_Prenda</text>
    <text x="290" y="414" font-size="9.5" fill="#1f2937">[abrir_filtros] -&gt; Filtros_Busqueda_Drawer</text>
    <text x="290" y="430" font-size="9.5" fill="#1f2937">[ver_carrito] -&gt; Carrito_Compras_Drawer</text>
  </g>
  <g id="screen_filtros">
    <rect x="280" y="680" width="300" height="110" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="280" y1="714" x2="580" y2="714" stroke="#111827" stroke-width="1.2"/>
    <text x="430.0" y="693" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="430.0" y="707" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Filtros_Busqueda_Drawer</text>
    <text x="290" y="730" font-size="9.5" fill="#1f2937">entry / cargar_tallas_colores_precios()</text>
    <text x="290" y="746" font-size="9.5" fill="#1f2937">[aplicar_filtros] / actualizar_grilla()</text>
    <text x="290" y="762" font-size="9.5" fill="#1f2937">[limpiar_filtros] / reset_query()</text>
    <text x="290" y="778" font-size="9.5" fill="#1f2937">[cerrar] -&gt; Catalogo_Prendas_Screen</text>
  </g>
  <g id="screen_detalle">
    <rect x="720" y="300" width="320" height="142" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="720" y1="334" x2="1040" y2="334" stroke="#111827" stroke-width="1.2"/>
    <text x="880.0" y="313" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="880.0" y="327" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Ficha_Detalle_Prenda_Screen</text>
    <text x="730" y="350" font-size="9.5" fill="#1f2937">«CU06WM: Consultar Detalle Producto»</text>
    <text x="730" y="366" font-size="9.5" fill="#1f2937">entry / cargar_variantes_stock_fotos()</text>
    <text x="730" y="382" font-size="9.5" fill="#1f2937">[seleccionar_talla_color] / recalcular_precio()</text>
    <text x="730" y="398" font-size="9.5" fill="#1f2937">[consultar_sucursal] -&gt; Modal_Disponibilidad</text>
    <text x="730" y="414" font-size="9.5" fill="#1f2937">[click_agregar] -&gt; Carrito_Compras_Drawer</text>
    <text x="730" y="430" font-size="9.5" fill="#1f2937">[click_reservar] -&gt; Formulario_Reserva_Modal</text>
  </g>
  <g id="screen_disp">
    <rect x="720" y="680" width="320" height="110" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="720" y1="714" x2="1040" y2="714" stroke="#111827" stroke-width="1.2"/>
    <text x="880.0" y="693" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="880.0" y="707" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Disponibilidad_Sucursal_Modal</text>
    <text x="730" y="730" font-size="9.5" fill="#1f2937">«CU07WM: Consultar Disponibilidad»</text>
    <text x="730" y="746" font-size="9.5" fill="#1f2937">entry / listar_sucursales_con_stock()</text>
    <text x="730" y="762" font-size="9.5" fill="#1f2937">[seleccionar_tienda_reserva] -&gt; Form_Reserva</text>
    <text x="730" y="778" font-size="9.5" fill="#1f2937">[cerrar] -&gt; Ficha_Detalle_Prenda</text>
  </g>
  <g id="screen_reserva_form">
    <rect x="1180" y="680" width="300" height="110" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="1180" y1="714" x2="1480" y2="714" stroke="#111827" stroke-width="1.2"/>
    <text x="1330.0" y="693" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="1330.0" y="707" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Formulario_Reserva_Modal</text>
    <text x="1190" y="730" font-size="9.5" fill="#1f2937">«CU10WM: Gestionar Reservas»</text>
    <text x="1190" y="746" font-size="9.5" fill="#1f2937">entry / fijar_tiempo_vigencia_48h()</text>
    <text x="1190" y="762" font-size="9.5" fill="#1f2937">[confirmar_reserva] / generar_token_reserva()</text>
    <text x="1190" y="778" font-size="9.5" fill="#1f2937">[reserva_exitosa] -&gt; Mis_Reservas_Screen</text>
  </g>
  <g id="screen_mis_reservas">
    <rect x="1620" y="680" width="300" height="110" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="1620" y1="714" x2="1920" y2="714" stroke="#111827" stroke-width="1.2"/>
    <text x="1770.0" y="693" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="1770.0" y="707" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Mis_Reservas_Screen</text>
    <text x="1630" y="730" font-size="9.5" fill="#1f2937">«CU10WM: Mis Reservas Activas»</text>
    <text x="1630" y="746" font-size="9.5" fill="#1f2937">entry / listar_reservas_vigentes()</text>
    <text x="1630" y="762" font-size="9.5" fill="#1f2937">[mostrar_qr_retiro] / mostrar_modal_qr()</text>
    <text x="1630" y="778" font-size="9.5" fill="#1f2937">[cancelar_reserva] / liberar_stock()</text>
  </g>
  <g id="screen_carrito">
    <rect x="1180" y="300" width="300" height="126" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="1180" y1="334" x2="1480" y2="334" stroke="#111827" stroke-width="1.2"/>
    <text x="1330.0" y="313" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«modal»</text>
    <text x="1330.0" y="327" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Carrito_Compras_Drawer</text>
    <text x="1190" y="350" font-size="9.5" fill="#1f2937">«CU08WM: Gestionar Carrito de Compras»</text>
    <text x="1190" y="366" font-size="9.5" fill="#1f2937">entry / calcular_subtotal_descuentos()</text>
    <text x="1190" y="382" font-size="9.5" fill="#1f2937">[modificar_cantidad] / actualizar_item()</text>
    <text x="1190" y="398" font-size="9.5" fill="#1f2937">[eliminar_prenda] / remover_linea()</text>
    <text x="1190" y="414" font-size="9.5" fill="#1f2937">[proceder_checkout] -&gt; Checkout_Envio_Screen</text>
  </g>
  <g id="screen_checkout">
    <rect x="1620" y="300" width="300" height="126" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="1620" y1="334" x2="1920" y2="334" stroke="#111827" stroke-width="1.2"/>
    <text x="1770.0" y="313" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="1770.0" y="327" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Checkout_Envio_Screen</text>
    <text x="1630" y="350" font-size="9.5" fill="#1f2937">«CU09WM: Realizar Compra Online»</text>
    <text x="1630" y="366" font-size="9.5" fill="#1f2937">entry / seleccionar_direccion_envio()</text>
    <text x="1630" y="382" font-size="9.5" fill="#1f2937">[elegir_retiro_sucursal] / asignar_tienda()</text>
    <text x="1630" y="398" font-size="9.5" fill="#1f2937">[calcular_tarifa_courier] / sumar_total()</text>
    <text x="1630" y="414" font-size="9.5" fill="#1f2937">[continuar_al_pago] -&gt; Pasarela_Pago_Screen</text>
  </g>
  <g id="screen_pasarela">
    <rect x="2040" y="300" width="280" height="142" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="2040" y1="334" x2="2320" y2="334" stroke="#111827" stroke-width="1.2"/>
    <text x="2180.0" y="313" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="2180.0" y="327" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Pasarela_Pago_Screen</text>
    <text x="2050" y="350" font-size="9.5" fill="#1f2937">«CU27W: Procesar Pago Electrónico»</text>
    <text x="2050" y="366" font-size="9.5" fill="#1f2937">entry / solicitar_intencion_pago()</text>
    <text x="2050" y="382" font-size="9.5" fill="#1f2937">[pagar_qr_simple] / generar_qr_dinamico()</text>
    <text x="2050" y="398" font-size="9.5" fill="#1f2937">[pagar_tarjeta] / tokenizar_pasarela()</text>
    <text x="2050" y="414" font-size="9.5" fill="#1f2937">[pago_aprobado] -&gt; Confirmacion_Compra</text>
    <text x="2050" y="430" font-size="9.5" fill="#1f2937">[pago_rechazado] / reintentar()</text>
  </g>
  <g id="screen_confirmacion">
    <rect x="2040" y="680" width="280" height="126" rx="6" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="2040" y1="714" x2="2320" y2="714" stroke="#111827" stroke-width="1.2"/>
    <text x="2180.0" y="693" font-size="9" font-style="italic" fill="#374151" text-anchor="middle">«screen»</text>
    <text x="2180.0" y="707" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Confirmacion_Compra_Screen</text>
    <text x="2050" y="730" font-size="9.5" fill="#1f2937">«CU09WM: Confirmación de Pedido»</text>
    <text x="2050" y="746" font-size="9.5" fill="#1f2937">entry / generar_recibo_digital()</text>
    <text x="2050" y="762" font-size="9.5" fill="#1f2937">do / enviar_notificacion_email()</text>
    <text x="2050" y="778" font-size="9.5" fill="#1f2937">[ver_seguimiento] -&gt; Mis_Pedidos_Screen</text>
    <text x="2050" y="794" font-size="9.5" fill="#1f2937">[volver_inicio] -&gt; Catalogo_Prendas</text>
  </g>
