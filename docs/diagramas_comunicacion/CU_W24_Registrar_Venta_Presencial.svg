<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2420 600" width="2420" height="600" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Flecha continua negra a la derecha -->
    <marker id="arrow-solid-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <!-- Flecha abierta punteada a la izquierda -->
    <marker id="arrow-open-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 2 1.5 L 8 5 L 2 8.5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Lineas guía -->
  <line x1="120" y1="20" x2="120" y2="580" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="20" x2="400" y2="580" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="2140" y1="20" x2="2140" y2="580" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="20" y1="346" x2="2400" y2="346" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 1. Actor to Boundary -->
  <line x1="138" y1="300" x2="400" y2="300" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="269.0" y="278" text-anchor="middle" font-size="11.5" font-weight="500">1.1: Escanear código de barras de prendas,</text>
  <text x="269.0" y="292" text-anchor="middle" font-size="11.5" font-weight="500">seleccionar cliente y crear venta()</text>
  
  <line x1="390" y1="336" x2="148" y2="336" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="269.0" y="326" text-anchor="middle" font-size="11" font-weight="500">1.14: proceder al cobro de la venta (W28)()</text>
  <!-- 2. Boundary to Route -->
  <line x1="506" y1="300" x2="794" y2="300" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="650.0" y="278" text-anchor="middle" font-size="11.5" font-weight="500">1.2: POST /api/pos/venta con id_sucursal,</text>
  <text x="650.0" y="292" text-anchor="middle" font-size="11.5" font-weight="500">items (variante, qty, precio) y cliente()</text>
  
  <line x1="784" y1="336" x2="516" y2="336" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="650.0" y="326" text-anchor="middle" font-size="11" font-weight="500">1.13: mostrar venta en panel de cobro inmediato()</text>
  <!-- 3. Route to Service -->
  <line x1="886" y1="300" x2="1174" y2="300" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="1030.0" y="278" text-anchor="middle" font-size="11.5" font-weight="500">1.3: registrar_venta_presencial()</text>
  <text x="1030.0" y="292" text-anchor="middle" font-size="11.5" font-weight="500">verificando sesión de caja abierta activa</text>
  
  <line x1="1164" y1="336" x2="896" y2="336" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="1030.0" y="326" text-anchor="middle" font-size="11" font-weight="500">1.12: responder HTTP 201 con venta generada()</text>
  <!-- 4. Service to Repo -->
  <line x1="1266" y1="300" x2="1554" y2="300" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="1410.0" y="278" text-anchor="middle" font-size="11.5" font-weight="500">1.4: descontar stock físico en sucursal</text>
  <text x="1410.0" y="292" text-anchor="middle" font-size="11.5" font-weight="500">y persistir venta con estado PENDIENTE_PAGO()</text>
  
  <line x1="1544" y1="336" x2="1276" y2="336" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="1410.0" y="326" text-anchor="middle" font-size="11" font-weight="500">1.11: retornar id_venta y resumen para cobro inmediato()</text>
  <!-- Conexiones a 3 Entidades -->
  <!-- Entidad 1 (Arriba) -->
  <line x1="1632" y1="262" x2="2094" y2="162" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="1883.0" y="198.0" text-anchor="middle" font-size="11" font-weight="500">1.5: INSERT cabecera de venta en t_venta</text>
  <line x1="2079" y1="186" x2="1638" y2="288" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="1878.5" y="255.0" text-anchor="middle" font-size="10.5" font-weight="500">1.6: retornar id_venta generado</text>

  <!-- Entidad 2 (Centro) -->
  <line x1="1646" y1="300" x2="2094" y2="300" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="1870.0" y="288" text-anchor="middle" font-size="11" font-weight="500">1.7: INSERT líneas de prendas y precios finales</text>
  <line x1="2084" y1="336" x2="1656" y2="336" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="1870.0" y="326" text-anchor="middle" font-size="10.5" font-weight="500">1.8: confirmar líneas registradas</text>

  <!-- Entidad 3 (Abajo) -->
  <line x1="1632" y1="338" x2="2094" y2="438" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow-solid-right)"/>
  <text x="1883.0" y="376.0" text-anchor="middle" font-size="11" font-weight="500">1.9: UPDATE descontar stock_actual en sucursal</text>
  <line x1="2079" y1="464" x2="1638" y2="364" stroke="#111827" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-left)"/>
  <text x="1878.5" y="432.0" text-anchor="middle" font-size="10.5" font-weight="500">1.10: confirmar salida física de mercadería</text>

  <!-- G Entidad 1 -->
  <g>
    <circle cx="2140" cy="150" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="2108" y1="199" x2="2172" y2="199" stroke="#111827" stroke-width="2.2"/>
    <text x="2140" y="155" text-anchor="middle" font-size="12" font-weight="bold">t_venta</text>
  </g>

  <!-- G Entidad 2 -->
  <g>
    <circle cx="2140" cy="300" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="2108" y1="349" x2="2172" y2="349" stroke="#111827" stroke-width="2.2"/>
    <text x="2140" y="296" text-anchor="middle" font-size="10.5" font-weight="bold">t_detalle_</text><text x="2140" y="311" text-anchor="middle" font-size="10.5" font-weight="bold">venta</text>
  </g>

  <!-- G Entidad 3 -->
  <g>
    <circle cx="2140" cy="450" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="2108" y1="499" x2="2172" y2="499" stroke="#111827" stroke-width="2.2"/>
    <text x="2140" y="455" text-anchor="middle" font-size="12" font-weight="bold">t_inventario</text>
  </g>
  <!-- 1. Actor -->
  <g id="actor">
    <circle cx="120" cy="264" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <line x1="120" y1="277" x2="120" y2="314" stroke="#111827" stroke-width="1.8"/>
    <line x1="102" y1="288" x2="138" y2="288" stroke="#111827" stroke-width="1.8"/>
    <line x1="120" y1="314" x2="106" y2="342" stroke="#111827" stroke-width="1.8"/>
    <line x1="120" y1="314" x2="134" y2="342" stroke="#111827" stroke-width="1.8"/>
    <text x="120" y="362" text-anchor="middle" font-size="11.5" font-weight="bold">CAJERO</text>
  </g>
  <!-- 2. Boundary -->
  <g id="boundary">
    <line x1="400" y1="266" x2="400" y2="334" stroke="#111827" stroke-width="2.2"/>
    <line x1="400" y1="300" x2="414" y2="300" stroke="#111827" stroke-width="2.0"/>
    <circle cx="460" cy="300" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="460" y="304" text-anchor="middle" font-size="11.5" font-weight="600">IU_POSCaja</text>
  </g>
  <!-- Controller: pos_routes -->
  <g>
    <circle cx="840" cy="300" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <!-- Flecha circular del estándar UML Robustness adherida a la circunferencia -->
    <path d="M 858 258 A 50 50 0 0 0 834 253" fill="none" stroke="#111827" stroke-width="1.8"/>
    <path d="M 846 244 L 834 253 L 844 262" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="840" y="304" text-anchor="middle" font-size="11.5" font-weight="600">pos_routes</text>
  </g>
  <!-- Controller: pos_services -->
  <g>
    <circle cx="1220" cy="300" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <!-- Flecha circular del estándar UML Robustness adherida a la circunferencia -->
    <path d="M 1238 258 A 50 50 0 0 0 1214 253" fill="none" stroke="#111827" stroke-width="1.8"/>
    <path d="M 1226 244 L 1214 253 L 1224 262" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1220" y="304" text-anchor="middle" font-size="11.5" font-weight="600">pos_services</text>
  </g>
  <!-- Controller: pos_repos -->
  <g>
    <circle cx="1600" cy="300" r="46" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <!-- Flecha circular del estándar UML Robustness adherida a la circunferencia -->
    <path d="M 1618 258 A 50 50 0 0 0 1594 253" fill="none" stroke="#111827" stroke-width="1.8"/>
    <path d="M 1606 244 L 1594 253 L 1604 262" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1600" y="304" text-anchor="middle" font-size="11.5" font-weight="600">pos_repos</text>
  </g>
  <text x="30" y="35" font-size="14" font-weight="bold" fill="#475569">CU/W24: Registrar venta presencial (POS Caja)</text>
</svg>
