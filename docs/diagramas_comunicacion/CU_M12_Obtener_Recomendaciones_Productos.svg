  <line x1="954.0" y1="369" x2="1006.0" y2="369" stroke="#000000" stroke-width="1.3" marker-end="url(#msg_arrow_right)"/>
  <text x="980.0" y="351" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="middle">1.4: consultar_recomendaciones_cliente()</text>
  <text x="980.0" y="363" font-size="9" fill="#222222" text-anchor="middle">priorizando tallas en stock</text>
  <line x1="1006.0" y1="393" x2="954.0" y2="393" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#msg_arrow_left)"/>
  <text x="980.0" y="407" font-size="9.5" fill="#333333" text-anchor="middle">1.11: return prendas_json_optimizadas()</text>
  <line x1="1150" y1="380" x2="1185" y2="380" stroke="#000000" stroke-width="1.4"/>
  <line x1="1185" y1="240" x2="1185" y2="520" stroke="#000000" stroke-width="1.4"/>
  <line x1="1185" y1="240" x2="1390" y2="240" stroke="#000000" stroke-width="1.4"/>
  <line x1="1261.5" y1="229" x2="1313.5" y2="229" stroke="#000000" stroke-width="1.3" marker-end="url(#msg_arrow_right)"/>
  <text x="1287.5" y="221" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="middle">1.5: SELECT recomendaciones activas cliente</text>
  <line x1="1313.5" y1="253" x2="1261.5" y2="253" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#msg_arrow_left)"/>
  <text x="1287.5" y="267" font-size="9.5" fill="#333333" text-anchor="middle">1.6: return IDs de prendas recomendadas</text>
  <line x1="1185" y1="380" x2="1390" y2="380" stroke="#000000" stroke-width="1.4"/>
  <line x1="1261.5" y1="369" x2="1313.5" y2="369" stroke="#000000" stroke-width="1.3" marker-end="url(#msg_arrow_right)"/>
  <text x="1287.5" y="361" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="middle">1.7: INSERT INTO T_HISTORIAL_NAVEGACION</text>
  <line x1="1313.5" y1="393" x2="1261.5" y2="393" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#msg_arrow_left)"/>
  <text x="1287.5" y="407" font-size="9.5" fill="#333333" text-anchor="middle">1.8: return confirmación de registro</text>
  <line x1="1185" y1="520" x2="1390" y2="520" stroke="#000000" stroke-width="1.4"/>
  <line x1="1261.5" y1="509" x2="1313.5" y2="509" stroke="#000000" stroke-width="1.3" marker-end="url(#msg_arrow_right)"/>
  <text x="1287.5" y="501" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="middle">1.9: SELECT fotos, tallas y precio prenda</text>
  <line x1="1313.5" y1="533" x2="1261.5" y2="533" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#msg_arrow_left)"/>
  <text x="1287.5" y="547" font-size="9.5" fill="#333333" text-anchor="middle">1.10: return cards con imagen optimizada</text>
  <!-- Actor: CLIENTE_MOVIL -->
