<!-- ========================================================================= -->
<!-- SIDEBAR DE FILTROS DESKTOP (Inspirado exactamente en la Maqueta)          -->
<!-- ========================================================================= -->
<aside class="hidden lg:block w-full rounded-2xl bg-white dark:bg-zinc-900 border border-stone-200 dark:border-zinc-800/90 shadow-xs p-5 space-y-6 text-zinc-900 dark:text-zinc-100 transition-colors">
  
  <!-- Encabezado de Filtros -->
  <div class="flex items-center justify-between pb-3 border-b border-stone-100 dark:border-zinc-800">
    <h3 class="text-sm font-bold tracking-tight text-zinc-900 dark:text-white">
      Filtros
    </h3>
    <button 
      *ngIf="contarFiltrosActivos() > 0"
      (click)="onLimpiar()" 
      class="text-xs font-medium text-amber-600 dark:text-amber-400 hover:underline cursor-pointer">
      Limpiar filtros
    </button>
  </div>

  <!-- Grupo 1: Categoría (Lista de Checkboxes con Conteos) -->
  <div class="space-y-3">
    <div class="flex items-center justify-between cursor-pointer select-none" (click)="toggleColapso('categoria')">
      <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200">Categoría</span>
      <i class="ph text-zinc-400 text-xs" [class.ph-caret-up]="!colapsados.categoria" [class.ph-caret-down]="colapsados.categoria"></i>
    </div>

    <div *ngIf="!colapsados.categoria" class="space-y-2 pt-1 animate-fade-in">
      <div 
        *ngFor="let cat of listaCategorias" 
        (click)="toggleCategoria(cat.id_categoria)"
        class="flex items-center justify-between text-xs py-1 px-1 rounded-lg hover:bg-stone-50 dark:hover:bg-zinc-800/50 cursor-pointer group">
        
        <div class="flex items-center space-x-2.5">
          <!-- Checkbox cuadrado estilizado -->
          <div 
            class="w-4 h-4 rounded border flex items-center justify-center transition-colors"
            [class.bg-amber-600]="selectedCategory === cat.id_categoria"
            [class.border-amber-600]="selectedCategory === cat.id_categoria"
            [class.text-white]="selectedCategory === cat.id_categoria"
            [class.border-stone-300]="selectedCategory !== cat.id_categoria"
            [class.dark:border-zinc-700]="selectedCategory !== cat.id_categoria"
            [class.bg-white]="selectedCategory !== cat.id_categoria"
            [class.dark:bg-zinc-950]="selectedCategory !== cat.id_categoria">
            <svg *ngIf="selectedCategory === cat.id_categoria" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          
          <span 
            class="transition-colors group-hover:text-amber-600 dark:group-hover:text-amber-400"
            [class.font-bold]="selectedCategory === cat.id_categoria"
            [class.text-zinc-900]="selectedCategory === cat.id_categoria"
            [class.dark:text-white]="selectedCategory === cat.id_categoria"
            [class.text-zinc-600]="selectedCategory !== cat.id_categoria"
            [class.dark:text-zinc-400]="selectedCategory !== cat.id_categoria">
            {{ cat.nombre }}
          </span>
        </div>

        <span class="text-[11px] font-mono text-zinc-400 dark:text-zinc-500">
          {{ cat.total_prendas || 18 }}
        </span>
      </div>
    </div>
  </div>

  <!-- Grupo 2: Color (Swatches Circulares) -->
  <div class="space-y-3 pt-3 border-t border-stone-100 dark:border-zinc-800">
    <div class="flex items-center justify-between cursor-pointer select-none" (click)="toggleColapso('color')">
      <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200">Color</span>
      <i class="ph text-zinc-400 text-xs" [class.ph-caret-up]="!colapsados.color" [class.ph-caret-down]="colapsados.color"></i>
    </div>

    <div *ngIf="!colapsados.color" class="flex flex-wrap items-center gap-2 pt-1 animate-fade-in">
      <button 
        *ngFor="let col of listaColores" 
        type="button"
        (click)="toggleColor(col.id_color)"
        [title]="col.nombre"
        class="w-6 h-6 rounded-full border transition-all cursor-pointer relative"
        [class.ring-2]="selectedColor === col.id_color"
        [class.ring-amber-500]="selectedColor === col.id_color"
        [class.ring-offset-2]="selectedColor === col.id_color"
        [class.ring-offset-white]="selectedColor === col.id_color"
        [class.dark:ring-offset-zinc-900]="selectedColor === col.id_color"
        [class.scale-110]="selectedColor === col.id_color"
        [class.border-stone-300]="selectedColor !== col.id_color"
        [class.dark:border-zinc-700]="selectedColor !== col.id_color"
        [style.backgroundColor]="col.codigo_hex">
        <span *ngIf="selectedColor === col.id_color" class="absolute inset-0 flex items-center justify-center text-[10px] text-white mix-blend-difference font-bold">✓</span>
      </button>

      <!-- Botón limpiar color -->
      <button 
        *ngIf="selectedColor !== null" 
        (click)="toggleColor(null)"
        class="w-6 h-6 rounded-full bg-stone-100 dark:bg-zinc-800 text-zinc-500 text-xs flex items-center justify-center hover:bg-stone-200 dark:hover:bg-zinc-700" 
        title="Quitar filtro de color">
        ✕
      </button>
    </div>
  </div>

  <!-- Grupo 3: Talla (Botones Cuadrados XS, S, M, L, XL) -->
  <div class="space-y-3 pt-3 border-t border-stone-100 dark:border-zinc-800">
    <div class="flex items-center justify-between cursor-pointer select-none" (click)="toggleColapso('talla')">
      <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200">Talla</span>
      <i class="ph text-zinc-400 text-xs" [class.ph-caret-up]="!colapsados.talla" [class.ph-caret-down]="colapsados.talla"></i>
    </div>

    <div *ngIf="!colapsados.talla" class="flex flex-wrap gap-1.5 pt-1 animate-fade-in">
      <button 
        *ngFor="let t of listaTallas" 
        type="button"
        (click)="toggleTalla(t.id_talla)"
        class="min-w-[36px] h-8 px-2.5 rounded-lg text-xs font-medium border transition-all cursor-pointer flex items-center justify-center"
        [class.bg-amber-500/15]="selectedTalla === t.id_talla"
        [class.border-amber-500]="selectedTalla === t.id_talla"
        [class.text-amber-700]="selectedTalla === t.id_talla"
        [class.dark:text-amber-400]="selectedTalla === t.id_talla"
        [class.font-bold]="selectedTalla === t.id_talla"
        [class.bg-stone-50]="selectedTalla !== t.id_talla"
        [class.dark:bg-zinc-950]="selectedTalla !== t.id_talla"
        [class.border-stone-200]="selectedTalla !== t.id_talla"
        [class.dark:border-zinc-800]="selectedTalla !== t.id_talla"
        [class.text-zinc-700]="selectedTalla !== t.id_talla"
        [class.dark:text-zinc-300]="selectedTalla !== t.id_talla"
        [class.hover:border-stone-400]="selectedTalla !== t.id_talla">
        {{ t.nombre }}
      </button>
    </div>
  </div>

  <!-- Grupo 4: Temporada (Dropdown) -->
  <div class="space-y-2 pt-3 border-t border-stone-100 dark:border-zinc-800">
    <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200 block">Temporada</span>
    <select 
      [ngModel]="selectedTemporada" 
      (ngModelChange)="onTemporadaSelect($event)"
      class="w-full bg-stone-50 dark:bg-zinc-950 border border-stone-300 dark:border-zinc-700/80 rounded-xl px-3 py-2 text-xs text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-amber-500 cursor-pointer">
      <option value="Todas">Otoño / Invierno 2026</option>
      <option value="Primavera / Verano 2026">Primavera / Verano 2026</option>
      <option value="Atemporal">Atemporal & Clásicos</option>
      <option *ngFor="let temp of filtrosDisponibles.temporadas" [value]="temp">{{ temp }}</option>
    </select>
  </div>

  <!-- Grupo 5: Rango de Precio -->
  <div class="space-y-3 pt-3 border-t border-stone-100 dark:border-zinc-800">
    <div class="flex items-center justify-between cursor-pointer select-none" (click)="toggleColapso('precio')">
      <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200">Rango de precio</span>
      <i class="ph text-zinc-400 text-xs" [class.ph-caret-up]="!colapsados.precio" [class.ph-caret-down]="colapsados.precio"></i>
    </div>

    <div *ngIf="!colapsados.precio" class="space-y-2.5 pt-1 animate-fade-in">
      <!-- Indicador visual slider -->
      <div class="relative py-1">
        <div class="h-1.5 w-full bg-stone-200 dark:bg-zinc-800 rounded-full overflow-hidden">
          <div class="h-full bg-amber-500 rounded-full w-3/4"></div>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs font-mono text-zinc-600 dark:text-zinc-400">
        <div class="flex items-center space-x-1">
          <span>Bs.</span>
          <input 
            type="number" 
            [ngModel]="precioMin" 
            (ngModelChange)="onPrecioMinChange($event)"
            placeholder="100" 
            class="w-16 bg-stone-50 dark:bg-zinc-950 border border-stone-300 dark:border-zinc-700 rounded-lg px-1.5 py-1 text-center text-xs text-zinc-900 dark:text-white"
          />
        </div>
        <span>—</span>
        <div class="flex items-center space-x-1">
          <span>Bs.</span>
          <input 
            type="number" 
            [ngModel]="precioMax" 
            (ngModelChange)="onPrecioMaxChange($event)"
            placeholder="1.000" 
            class="w-16 bg-stone-50 dark:bg-zinc-950 border border-stone-300 dark:border-zinc-700 rounded-lg px-1.5 py-1 text-center text-xs text-zinc-900 dark:text-white"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Grupo 6: Sucursal / Tienda Física -->
  <div class="space-y-2 pt-3 border-t border-stone-100 dark:border-zinc-800">
    <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200 block">Sucursal</span>
    <select 
      [ngModel]="selectedTenantId" 
      (change)="onTenantSelect($event)"
      class="w-full bg-stone-50 dark:bg-zinc-950 border border-stone-300 dark:border-zinc-700/80 rounded-xl px-3 py-2 text-xs text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-amber-500 cursor-pointer">
      <option [value]="null">Todas las sucursales</option>
      <option *ngFor="let t of tenants" [value]="t.id_empresa">
        {{ t.nombre_empresa }} ({{ t.ciudad || 'Bolivia' }})
      </option>
    </select>
  </div>

</aside>

<!-- ========================================================================= -->
<!-- DRAWER DE FILTROS MÓVIL (Para teléfonos y tablets)                        -->
<!-- ========================================================================= -->
<div *ngIf="mostrarDrawerMovil" class="fixed inset-0 z-50 lg:hidden flex justify-end animate-fade-in">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" (click)="toggleDrawer()"></div>

  <!-- Panel Deslizable -->
  <div class="relative w-full max-w-xs bg-white dark:bg-zinc-950 h-full p-6 space-y-6 overflow-y-auto shadow-2xl z-10 flex flex-col justify-between">
    <div class="space-y-6">
      <div class="flex items-center justify-between pb-3 border-b border-stone-200 dark:border-zinc-800">
        <h3 class="text-base font-bold text-zinc-900 dark:text-white">Filtros de Catálogo</h3>
        <button (click)="toggleDrawer()" class="text-zinc-400 hover:text-zinc-600 text-lg">✕</button>
      </div>

      <!-- Categorías Móvil -->
      <div class="space-y-2">
        <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200 block">Categoría</span>
        <div class="space-y-1.5">
          <div *ngFor="let cat of listaCategorias" 
               (click)="toggleCategoria(cat.id_categoria); toggleDrawer()"
               class="flex items-center justify-between text-xs py-1.5 px-2 rounded-lg hover:bg-stone-100 dark:hover:bg-zinc-900 cursor-pointer"
               [class.bg-amber-500/10]="selectedCategory === cat.id_categoria"
               [class.text-amber-600]="selectedCategory === cat.id_categoria">
            <span>{{ cat.nombre }}</span>
            <span class="text-zinc-400 font-mono">{{ cat.total_prendas || 18 }}</span>
          </div>
        </div>
      </div>

      <!-- Tallas Móvil -->
      <div class="space-y-2">
        <span class="text-xs font-bold text-zinc-900 dark:text-zinc-200 block">Talla</span>
        <div class="flex flex-wrap gap-1.5">
          <button *ngFor="let t of listaTallas" 
                  (click)="toggleTalla(t.id_talla); toggleDrawer()"
                  class="px-3 py-1.5 text-xs rounded-lg border"
                  [class.bg-amber-500]="selectedTalla === t.id_talla"
                  [class.text-black]="selectedTalla === t.id_talla"
                  [class.border-amber-500]="selectedTalla === t.id_talla">
            {{ t.nombre }}
          </button>
        </div>
      </div>
    </div>

    <div class="pt-4 border-t border-stone-200 dark:border-zinc-800 flex gap-2">
      <button (click)="onLimpiar()" class="w-1/2 py-2.5 rounded-xl border border-stone-300 dark:border-zinc-700 text-xs font-semibold">
        Limpiar
      </button>
      <button (click)="toggleDrawer()" class="w-1/2 py-2.5 rounded-xl bg-amber-500 text-black text-xs font-bold">
        Aplicar
      </button>
    </div>
  </div>
</div>
